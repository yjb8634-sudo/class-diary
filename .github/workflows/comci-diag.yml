# 컴시간 접속 진단 (손으로만 돌림): 컴시간 첫 화면과 도구 설정을 diag/ 폴더에 저장합니다.
name: 컴시간 진단
on: workflow_dispatch
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet "comci==0.7.0"
      - name: 진단
        run: |
          mkdir -p diag
          python - <<'PY'
          import os, re, glob, importlib.util, requests, shutil
          spec = importlib.util.find_spec('comci'); d = os.path.dirname(spec.origin)
          for f in glob.glob(d + '/**/*.py', recursive=True):
              out = 'diag/comci_' + os.path.relpath(f, d).replace('/', '_') + '.txt'
              shutil.copy(f, out)
          H = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36'}
          r = requests.get('http://comci.net:4082/st', headers=H, timeout=20)
          open('diag/st.html', 'wb').write(r.content)
          PY
      - name: 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diag && git commit -m "컴시간 진단 자료" && git push || echo nothing
