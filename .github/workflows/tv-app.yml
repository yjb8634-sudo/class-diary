# 클래스 나우 교실 TV 앱(안드로이드 APK)을 만듭니다.
# android-tv/ 폴더가 바뀌면 저절로 돌고, [Actions] 탭에서 [Run workflow]로도 돌릴 수 있어요.
# 결과(서명 전 앱 파일)는 tv-app-build 가지에 올라가고, 서명은 저장소 밖에서 합니다.

name: 교실 TV 앱 만들기

on:
  push:
    branches: [main]
    paths: ['android-tv/**', '.github/workflows/tv-app.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tv-app
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: 앱 만들기
        working-directory: android-tv
        env:
          VC: ${{ github.run_number }}
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: 결과 올리기 (tv-app-build 가지)
        run: |
          set -e
          APK=$(ls android-tv/app/build/outputs/apk/release/*.apk | head -1)
          mkdir -p /tmp/out && cp "$APK" /tmp/out/classnow-tv-unsigned.apk
          echo "${{ github.run_number }}" > /tmp/out/version.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan tv-app-build
          git rm -rfq . && git clean -fdq
          cp /tmp/out/* .
          git add -A && git commit -qm "교실 TV 앱 #${{ github.run_number }} (서명 전)"
          git push -f origin tv-app-build
          echo "::notice title=교실 TV 앱::#${{ github.run_number }} 만들기 끝 · $(du -h classnow-tv-unsigned.apk | cut -f1)"
