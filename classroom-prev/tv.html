<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>우리 반 교실 화면</title>
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="교실 TV">
<base target="_top">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
*,*::before,*::after{box-sizing:border-box}
html{font-size:calc(clamp(12px,min(1.04vw,1.85vh),46px) * var(--zoom,1))}
html,body{margin:0;height:100%;overflow:hidden}
h1,h2,h3,p,ol,ul{margin:0;padding:0}
button{font:inherit;color:inherit}
:root{
  --bg:#18241F; --card:#1F2E28; --card2:#26372F; --line:rgba(243,241,231,.10);
  --chalk:#F3F1E7; --chalk2:#C9CDBF; --chalk3:#8E9A8F;
  --yellow:#F4D35E; --yellow-ink:#2A2306; --mint:#8FD3C1; --pink:#F2A7A0; --sky:#9CC7F0;
}
body{background:var(--bg);color:var(--chalk);font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  -webkit-font-smoothing:antialiased;letter-spacing:-.01em;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.board{height:100vh;display:grid;grid-template-rows:auto 1fr auto;gap:1rem;padding:calc(1.1rem + var(--st,0px)) calc(1.6rem + var(--sr,0px)) calc(1.9rem + var(--sb,0px)) calc(1.6rem + var(--sl,0px))}
#flash{position:fixed;inset:0;z-index:60;background:rgba(10,15,12,.96);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2.2rem;padding:3rem;text-align:center;animation:fin .25s ease}
#flash[hidden]{display:none}
@keyframes fin{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
#flash .tag{font-size:1.7rem;font-weight:800;letter-spacing:.3rem;padding:.5rem 1.6rem;border-radius:999px;background:var(--mint);color:#0F2A23}
#flash.urgent .tag{background:#E5533D;color:#fff;animation:blink 1s steps(1,end) infinite}
@keyframes blink{50%{opacity:.35}}
#flash .who{font-size:7rem;font-weight:800;line-height:1.1;letter-spacing:-.04em;word-break:keep-all;color:var(--yellow)}
#flash.urgent .who{color:#FFB4A6}
#flash .msg2{font-size:3.2rem;font-weight:700;line-height:1.4;word-break:keep-all;max-width:24ch}
#flash .left{font-size:1.5rem;color:var(--chalk3);font-variant-numeric:tabular-nums}
#flash .ok{all:unset;cursor:pointer;min-height:6rem;padding:0 4rem;border-radius:1.2rem;background:var(--yellow);
  color:var(--yellow-ink);font-size:2.4rem;font-weight:800;display:flex;align-items:center;box-sizing:border-box}
@media (orientation:portrait){#flash .who{font-size:4rem}#flash .msg2{font-size:2rem}}
.newver{position:fixed;left:50%;top:calc(.8rem + var(--st,0px));transform:translateX(-50%);z-index:35;background:var(--yellow);color:var(--yellow-ink);font-weight:800;font-size:1.4rem;
  padding:.8rem 1.4rem;border-radius:1rem;text-decoration:none;box-shadow:0 1rem 2rem rgba(0,0,0,.45)}
.newver[hidden]{display:none}
.credit{position:fixed;right:calc(1.6rem + var(--sr,0px));bottom:calc(.45rem + var(--sb,0px));font-size:.85rem;color:var(--chalk3);letter-spacing:0;pointer-events:none;z-index:5}

/* 윗줄 */
.top{display:flex;align-items:center;gap:1.4rem;min-height:4.4rem}
.quote{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;max-height:10.4rem;overflow:hidden}
.quote .q{font-family:'Noto Serif KR','Pretendard',serif;font-weight:800;letter-spacing:-.03em;line-height:1.28;text-wrap:balance;word-break:keep-all;animation:qin .7s ease both}
.quote .by{font-size:1.35rem;color:var(--yellow);font-weight:700;margin-top:.35rem;animation:qin .7s ease both}
.quote .big-cls{font-size:2rem;font-weight:800;letter-spacing:-.02em}
@keyframes qin{from{opacity:0;transform:translateY(.5rem)}to{opacity:1;transform:none}}
.tools{display:flex;align-items:center;gap:.8rem;flex:none}
.pill.prev{border-color:rgba(244,211,94,.6);color:var(--yellow)}
.pill{font-size:1.05rem;color:var(--chalk2);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:.35rem .9rem;white-space:nowrap}
.pill b{color:var(--yellow);font-weight:800}
.iconbtn{all:unset;cursor:pointer;width:2.9rem;height:2.9rem;border-radius:.7rem;display:grid;place-items:center;background:var(--card);border:1px solid var(--line)}
.iconbtn svg{width:1.4rem;height:1.4rem}
.homebtn{flex:none;display:inline-flex;align-items:center;gap:.5rem;height:2.9rem;padding:0 1rem 0 .8rem;border-radius:.7rem;background:var(--card);border:1px solid var(--line);color:var(--chalk);font-size:1.15rem;font-weight:700;text-decoration:none;cursor:pointer}
.homebtn[hidden]{display:none}
.homebtn svg{width:1.35rem;height:1.35rem}
.homebtn:active{transform:scale(.96)}

/* 세 칸 */
.grid{display:grid;grid-template-columns:var(--c1,1.15fr) var(--c2,1fr) var(--c3,1fr);gap:1.1rem;min-height:0;position:relative}
.col{display:flex;flex-direction:column;gap:1.1rem;min-height:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:1.1rem;padding:1.2rem 1.4rem;min-height:0}
.card.grow{flex:1;display:flex;flex-direction:column}
.card h2{font-size:1.1rem;font-weight:700;color:var(--chalk3);letter-spacing:.02em;margin-bottom:.7rem}

.clock{font-weight:800;font-variant-numeric:tabular-nums;line-height:.95;letter-spacing:-.04em;display:flex;align-items:baseline}
.clock .hm{font-size:9.2rem}
.clock .ss{font-size:3rem;color:var(--chalk3);margin-left:.4rem}
.date{font-size:2rem;font-weight:700;margin-top:.5rem;display:flex;align-items:center;flex-wrap:wrap;gap:.25rem .9rem}
.wx{display:inline-flex;align-items:center;gap:.45rem;font-size:2rem;font-weight:700;white-space:nowrap}
.wx svg{width:2.1rem;height:2.1rem;flex:none}
.wx .hl{font-size:1.1rem;font-weight:600;color:var(--chalk3)}
.dust{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.45rem;font-size:1.05rem;font-weight:700}
.dust span{border-radius:.5rem;padding:.12rem .55rem;background:var(--card2);color:var(--chalk2)}
.dust .g좋음{background:rgba(156,199,240,.2);color:var(--sky)}
.dust .g보통{background:rgba(143,211,193,.2);color:var(--mint)}
.dust .g나쁨{background:rgba(244,180,90,.22);color:#F4B45A}
.dust .g매우나쁨{background:rgba(242,167,160,.25);color:var(--pink)}
.sharebox{display:flex;flex-direction:column;gap:1rem}
.sharebox .url{font-size:1.15rem;word-break:break-all;background:var(--card2);border-radius:.8rem;padding:.9rem 1rem;user-select:text;-webkit-user-select:text}
.ddays{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:.9rem}
.dd{font-size:1.25rem;background:var(--card2);border:1px solid var(--line);border-radius:.6rem;padding:.35rem .8rem}
.dd b{color:var(--yellow);margin-left:.4rem;font-variant-numeric:tabular-nums}

.now{flex:1;display:flex;flex-direction:column;justify-content:center;background:var(--card2)}
.col>.card.now{min-height:fit-content}
.col>.fill{flex:1}
.now .k{font-size:1.4rem;color:var(--chalk2);font-weight:700}
.now .big{font-size:4.4rem;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin:.2rem 0 .6rem}
.now .big.y{color:var(--yellow)}
.now .sub{font-size:1.45rem;color:var(--chalk2);line-height:1.5}
.now .sub b{color:var(--chalk)}
.bar{height:.75rem;background:rgba(243,241,231,.08);border-radius:1rem;overflow:hidden;margin:.6rem 0 .7rem}
.bar i{display:block;height:100%;background:var(--yellow);border-radius:1rem;transition:width .6s}

.tt{list-style:none;display:flex;flex-direction:column}
.tt li{display:grid;grid-template-columns:2.6rem 1fr auto;align-items:center;gap:.6rem;padding:.24rem .7rem;margin-bottom:.18rem;border-radius:.7rem;font-size:1.4rem;
  overflow:hidden;max-height:var(--h,none);
  transition:max-height 1.8s cubic-bezier(.4,0,.2,1),padding 1.8s cubic-bezier(.4,0,.2,1),margin 1.8s cubic-bezier(.4,0,.2,1),
    opacity 1.2s ease,background-color 1s ease,border-width 1.8s ease}
.tt li>*{transition:opacity .6s ease}
/* 지난 시간: 1) 글자는 바로 사라지고 얇은 줄로 줄어듦 → 2) 다음 시간이 되면 완전히 접힘 */
.tt li.p1,.tt li.sp.p1{max-height:.5rem;padding-top:0;padding-bottom:0;background:rgba(243,241,231,.1);border-radius:.3rem;border-color:transparent}
.tt li.p1>*,.tt li.sp.p1>*{opacity:0}
.tt li.p2,.tt li.sp.p2{max-height:0;padding-top:0;padding-bottom:0;margin-bottom:0;border-width:0;opacity:0}
.tt li.p2>*,.tt li.sp.p2>*{opacity:0}
.note.done{font-size:1.35rem;color:var(--chalk2);margin-top:.2rem}
@media (prefers-reduced-motion:reduce){.tt li,.tt li>*,.sch .r{transition:none}}
.tt li .n{font-size:1.15rem;color:var(--chalk3);font-weight:700}
.tt li .s{font-weight:700}
.tt li .t{font-size:1.05rem;color:var(--chalk3);font-variant-numeric:tabular-nums}
.tt li.on{background:var(--yellow);color:var(--yellow-ink)}
.tt li.on .n,.tt li.on .t{color:var(--yellow-ink)}
.tt li.next{outline:2px dashed rgba(244,211,94,.55);outline-offset:-2px}
.muted{color:var(--chalk3)}
.note{font-size:1rem;color:var(--chalk3);margin-top:.5rem}

.cs{display:flex;flex-direction:column;gap:.5rem}
.cs .r{display:flex;align-items:baseline;gap:.8rem;font-size:1.5rem}
.cs .r .l{font-size:1.1rem;color:var(--mint);font-weight:700;min-width:5rem}
.cs .r .w{font-weight:800}
.cs .r .tm{font-size:1.05rem;color:var(--chalk3);margin-left:auto}

.meal{display:flex;flex-wrap:wrap;gap:.4rem .5rem}
.meal span{word-break:keep-all;font-size:1.5rem;font-weight:600;background:var(--card2);border-radius:.55rem;padding:.25rem .65rem}
.meal span:first-child{color:var(--yellow)}
.meal2{margin-top:.8rem;font-size:1.1rem;color:var(--chalk2);line-height:1.5}

.nt{flex:1;overflow:hidden;position:relative}
.nt.ntpin{flex:none;overflow:visible;margin-bottom:.8rem;padding:.7rem .9rem;border-radius:.8rem;background:rgba(229,83,61,.08);border:1px solid rgba(229,83,61,.35)}
.nt.ntpin[hidden]{display:none}
.nt.ntpin ul+ul{margin-top:.6rem;padding-top:.6rem;border-top:1px dashed rgba(229,83,61,.3)}
.nt.ntpin .pinh{font-size:1rem;font-weight:800;color:var(--chalk3);letter-spacing:.04em;margin-bottom:.35rem;display:flex;align-items:center;gap:.35rem}
.nt.ntpin .pinh svg{width:1.05rem;height:1.05rem;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nt ul{list-style:none;display:flex;flex-direction:column;gap:.7rem}
.nt li{font-size:1.5rem;line-height:1.45;padding-left:1.1rem;position:relative;white-space:pre-wrap;word-break:keep-all}
.nt li::before{content:'';position:absolute;left:0;top:.6em;width:.45rem;height:.45rem;border-radius:50%;background:var(--chalk3)}
.nt li{cursor:pointer}
.nt li.lv1{color:var(--pink);font-weight:800}
.nt li.lv1::before{background:var(--pink)}
.nt li.lv2{color:#FF9A8A;font-weight:800}
.nt li.lv2::before{background:#E5533D}
.nt .notes{margin-bottom:.9rem;padding-bottom:.8rem;border-bottom:1px dashed var(--line)}
.nt li.note{font-weight:700;color:var(--chalk)}
.nt li.note::before{display:none}
.nt li.note{padding-left:0}
.kchip{display:inline-block;font-size:.95rem;font-weight:800;border-radius:.4rem;padding:.05rem .45rem;margin-right:.45rem;vertical-align:.15rem;white-space:nowrap}
.k0{background:rgba(143,211,193,.2);color:var(--mint)}
.k1{background:rgba(242,167,160,.2);color:var(--pink)}
.k2{background:rgba(156,199,240,.2);color:var(--sky)}
.k3{background:rgba(244,211,94,.2);color:var(--yellow)}
.nt .due{font-size:1.1rem;color:var(--chalk3);font-weight:600;margin-left:.5rem;white-space:nowrap}
.nt .due.today{color:var(--yellow)}
.nt .pend{font-size:1rem;color:var(--chalk3);font-weight:600;margin-left:.4rem;white-space:nowrap}
.mybtn{all:unset;cursor:pointer;float:right;font-size:1rem;font-weight:800;color:var(--yellow-ink);background:var(--yellow);border-radius:.6rem;padding:.25rem .7rem}
.mybtn[hidden]{display:none}
.mine{display:flex;flex-direction:column;gap:.8rem}
.mine h3{font-size:1.4rem;color:var(--chalk2);margin-top:.6rem}
.mi{background:var(--card);border:1px solid var(--line);border-radius:1rem;padding:1rem 1.2rem;cursor:pointer}
.mi.todo{border-color:rgba(244,211,94,.6)}
.mi.done{opacity:.55}
.mi .t1{font-size:1.6rem;font-weight:800;line-height:1.4}
.mi .t2{font-size:1.15rem;color:var(--chalk2);margin-top:.25rem}
.mi .tx{font-size:1.3rem;line-height:1.55;white-space:pre-wrap;margin-top:.6rem;color:var(--chalk)}
.mi .st{float:right;font-size:1.1rem;font-weight:800}
.mi.todo .st{color:var(--yellow)}
.mi.done .st{color:var(--mint)}
.calbox{margin-top:1.2rem;background:var(--card2);border-radius:1rem;padding:1rem 1.2rem;font-size:1.25rem;line-height:1.6}
.calbox a{display:inline-block;margin:.5rem .5rem 0 0;padding:.5rem 1rem;border-radius:.7rem;background:var(--yellow);color:var(--yellow-ink);font-weight:800;text-decoration:none}
.nt .badge{display:inline-block;font-size:1rem;background:#E5533D;color:#fff;border-radius:.4rem;padding:.05rem .5rem;margin-right:.5rem;vertical-align:.18rem;font-weight:800}
.nt .clip svg,.dd svg{width:1.15rem;height:1.15rem;vertical-align:-.18rem}
.nt .clip{display:inline-flex;align-items:center;gap:.3rem;margin-left:.5rem;padding:.15rem .7rem;border:1px solid var(--line);border-radius:.5rem .5rem 0 0;color:var(--chalk);font-size:1.05rem;font-weight:600;text-decoration:none;vertical-align:.12rem;white-space:nowrap}
.fv a.fvh{text-decoration:none;cursor:pointer}
.fv .fvo{margin-left:auto;font-size:1.05rem;font-weight:600;padding:.2rem .7rem;border:1px solid var(--line);border-radius:.5rem .5rem 0 0}
/* 누르는 느낌: 살짝 눌리고 밝아졌다가 돌아옵니다 */
button,.act,.go,.nt li,.press,.slot,.opt,.nm,.chipbtn{transition:transform .12s ease,background-color .15s ease,filter .15s ease,box-shadow .15s ease;-webkit-tap-highlight-color:transparent}
button:active:not(:disabled),.go:active,.slot:active,.opt:active,.nm:active,.chipbtn:active,.press:active,.press.down,.is-down{transform:scale(.95);filter:brightness(1.25)}
.act:active,.act.is-down{transform:scale(.97);filter:brightness(1.2)}
.nt li:active,.nt li.is-down{transform:scale(.985);background:rgba(255,255,255,.07);border-radius:.4rem}
.nt li{transition:transform .12s ease,background-color .15s ease}
.dd.bd{border-color:rgba(242,167,160,.45)}
.dd.bd b{color:var(--pink);margin:0 .25rem}
.dd.bd.today{background:var(--yellow);color:var(--yellow-ink);border-color:var(--yellow);font-weight:800}
.dd.bd.today b{color:var(--yellow-ink)}
.act.sg{flex:none;min-width:auto;padding:.9rem 1.3rem}
.act.sg .ic{background:var(--card2);color:var(--chalk);width:2.8rem;height:2.8rem}
.act.sg .tx b{font-size:1.35rem}
.fv{margin-top:1rem;border:1px solid var(--line);border-radius:1rem;overflow:hidden;background:#fff}
.fv .fvh{display:flex;align-items:center;gap:.6rem;padding:.7rem 1rem;background:var(--card2);color:var(--chalk);font-size:1.3rem;font-weight:700}
.fv .fvh svg{width:1.3rem;height:1.3rem}
.fpb{display:flex;align-items:center;justify-content:center;gap:1.2rem;margin-top:1rem}
.fpn{all:unset;cursor:pointer;min-width:9rem;height:3.6rem;padding:0 1.2rem;border-radius:.9rem;display:grid;place-items:center;background:var(--card2);border:1px solid var(--line);color:var(--chalk);font-size:1.3rem;font-weight:700;box-sizing:border-box}
.fpn[disabled]{opacity:.35;cursor:default}
.fpc{font-size:1.5rem;color:var(--chalk2);min-width:6rem;text-align:center}
.fpc b{color:var(--yellow);font-size:1.9rem}
.fpb+.fv{margin-top:.7rem}
.fpt{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.8rem}
.fpg{all:unset;cursor:pointer;padding:.35rem .9rem;border-radius:.6rem;border:1px solid var(--line);color:var(--chalk2);font-size:1.05rem;max-width:22rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;box-sizing:border-box}
.fpg.on{border-color:var(--yellow);color:var(--yellow)}
.fv iframe{display:block;width:100%;border:0;background:#fff}
.ntxt{font-size:2.4rem;font-weight:700;line-height:1.5;white-space:pre-wrap;word-break:keep-all}
.ntxt .badge{display:inline-block;font-size:1.3rem;background:#E5533D;color:#fff;border-radius:.5rem;padding:.1rem .6rem;margin-right:.7rem;vertical-align:.3rem}
.desc{font-size:1.8rem;line-height:1.6;white-space:pre-wrap;word-break:keep-all;color:var(--chalk)}
.evh{display:flex;align-items:center;gap:.6rem}
.iconbtn.phonebtn{width:auto;padding:0 .9rem 0 .7rem;gap:.35rem;display:inline-flex;align-items:center;font-size:1rem;font-weight:700;white-space:nowrap}
.iconbtn.phonebtn[hidden]{display:none}
.iconbtn.phonebtn svg{flex:none}
.appsteps{font-size:1.45rem;line-height:1.75;margin:.4rem 0 0}
/* 답 바꾸기 PIN: 오른쪽 아래 손바닥으로 가릴 만한 작은 숫자판 */
.cpmsg{max-width:52rem;padding:1rem 0 0 .4rem}
.cpmsg .big{font-size:5rem;line-height:1}
.cpmsg p{font-size:2rem;line-height:1.6;margin:1rem 0 0;word-break:keep-all}
.cpmsg p b{color:var(--yellow)}
.cpmsg p.sm{font-size:1.5rem;color:var(--chalk2)}
.cpmsg p.err{font-size:1.6rem;color:var(--pink);font-weight:700}
.cpad{position:fixed;right:max(1.2vw,10px);bottom:max(1.6vh,10px);z-index:60;width:clamp(190px,12vw,300px);padding:clamp(8px,.6vw,14px);
  border-radius:14px;background:#0F1814;border:2px solid var(--yellow);box-shadow:0 12px 40px rgba(0,0,0,.6)}
.cpad .cpd{display:flex;justify-content:center;gap:clamp(5px,.4vw,9px);margin:2px 0 clamp(6px,.5vw,10px)}
.cpad .cpd i{width:clamp(9px,.62vw,15px);height:clamp(9px,.62vw,15px);border-radius:50%;border:2px solid var(--chalk3)}
.cpad .cpd i.on{background:var(--yellow);border-color:var(--yellow)}
.cpad.bad .cpd{animation:shake .35s}
.cpad .ck{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(4px,.35vw,8px)}
.cpad .ck button{all:unset;cursor:pointer;text-align:center;height:clamp(40px,2.9vw,70px);line-height:clamp(40px,2.9vw,70px);border-radius:9px;
  background:#22322B;color:var(--chalk);font-size:clamp(18px,1.35vw,32px);font-weight:800;-webkit-tap-highlight-color:transparent}
.cpad .ck button:active{background:#33473E}
.cpad .ck button.sm{font-size:clamp(12px,.8vw,18px);font-weight:700;color:var(--chalk2)}
.cpad .cpbusy{position:absolute;inset:0;border-radius:12px;background:rgba(15,24,20,.85);display:grid;place-items:center;font-size:clamp(14px,.9vw,20px);font-weight:700;color:var(--yellow)}
.nm .pk{position:absolute;top:.35rem;right:.5rem;font-size:.85rem;font-weight:800;color:var(--mint)}
.nm .pk.no{color:var(--chalk3)}
#pinNudge{position:fixed;left:10px;right:10px;bottom:10px;z-index:40;display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:#26372F;border:1px solid var(--yellow);font-size:15px;line-height:1.45;box-shadow:0 8px 30px rgba(0,0,0,.5)}
#pinNudge button{all:unset;cursor:pointer;flex:none;padding:9px 14px;border-radius:10px;background:var(--yellow);color:var(--yellow-ink);font-weight:800}
#pinNudge .x{background:transparent;color:var(--chalk3);padding:9px 6px}
.appsteps b{color:var(--yellow)}
.evadd{all:unset;cursor:pointer;margin-left:auto;font-size:1.05rem;font-weight:700;color:var(--yellow);border:1.5px solid rgba(242,209,107,.55);border-radius:.7rem;padding:.25rem .8rem;letter-spacing:0}
.evadd[hidden]{display:none}
.evdays{display:grid;grid-template-columns:repeat(5,1fr);gap:.6rem;margin:.4rem 0 1rem}
.evdays button,.evps button{all:unset;cursor:pointer;box-sizing:border-box;text-align:center;border-radius:.9rem;border:2px solid var(--line);background:var(--card2);padding:.7rem .3rem;font-size:1.45rem;font-weight:700;line-height:1.25}
.evdays button:disabled{opacity:.3;cursor:default}
.evpg{display:flex;align-items:center;gap:.7rem}.evpg .gap{flex:1}.evpg b{font-size:1.3rem;color:var(--chalk)}
.evpg button{all:unset;cursor:pointer;white-space:nowrap;font-size:1.25rem;font-weight:700;padding:.4rem .9rem;border-radius:.7rem;border:2px solid var(--line);background:var(--card2);color:var(--chalk)}
.evpg button:disabled{opacity:.3;cursor:default}
.evdays button small{display:block;font-size:1.05rem;font-weight:500;color:var(--chalk3)}
.evdays button.on,.evps button.on{border-color:var(--yellow);color:var(--yellow);background:rgba(242,209,107,.1)}
.evdays button.today small{color:var(--mint)}
.evps{display:flex;flex-wrap:wrap;gap:.5rem;margin:.4rem 0 1rem}
.evps button{padding:.6rem 1.1rem;font-size:1.35rem}
.evlab{font-size:1.3rem;font-weight:700;color:var(--chalk3);margin-top:.6rem}
.evprev{font-size:2rem;font-weight:800;margin:.8rem 0 0;padding:.9rem 1.2rem;border-radius:1rem;border:2px dashed var(--line);min-height:2.6rem}
.evprev .ph{color:var(--chalk3);font-weight:500;font-size:1.5rem}
.sgta{width:100%;min-height:13rem;border-radius:1rem;border:2px solid var(--line);background:var(--card);color:var(--chalk);font:inherit;font-size:1.9rem;line-height:1.5;padding:1rem 1.2rem;box-sizing:border-box;resize:none;user-select:text;-webkit-user-select:text}
.sgta:focus{outline:none;border-color:var(--yellow)}
.row2{display:flex;gap:.9rem;align-items:center;flex-wrap:wrap;margin-top:1rem;font-size:1.4rem;color:var(--chalk2)}
.chipbtn{all:unset;cursor:pointer;min-height:3.6rem;padding:0 1.3rem;border-radius:.9rem;background:var(--card2);border:2px solid var(--line);font-size:1.4rem;font-weight:700;display:inline-flex;align-items:center;box-sizing:border-box}
.chipbtn.on{border-color:var(--yellow);color:var(--yellow)}
.pinwrap{display:flex;flex-direction:column;align-items:center;gap:1.4rem;padding-top:1rem}
.pindots{display:flex;gap:1.1rem}
.pindots i{width:1.5rem;height:1.5rem;border-radius:50%;border:3px solid var(--chalk3);background:transparent}
.pindots i.on{background:var(--yellow);border-color:var(--yellow)}
.pindots.bad i{border-color:var(--pink);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-.6rem)}75%{transform:translateX(.6rem)}}
.keys{display:grid;grid-template-columns:repeat(3,7.4rem);gap:.9rem}
.keys button{all:unset;cursor:pointer;height:5.6rem;border-radius:1rem;background:var(--card);border:2px solid var(--line);
  display:grid;place-items:center;font-size:2.4rem;font-weight:800;box-sizing:border-box}
.keys button:active{background:var(--card2)}
.keys button.sm{font-size:1.4rem;font-weight:700;color:var(--chalk2)}
.nm.nopin{opacity:.45}
.nm.nopin::after{content:'PIN 없음';position:absolute;top:.35rem;right:.5rem;font-size:.85rem;color:var(--chalk3);font-weight:800}

/* 아래 버튼 */
.actions{display:flex;gap:1rem;align-items:stretch;min-width:0}
.board{grid-template-columns:minmax(0,1fr)}
.board > *{min-width:0}   /* 아래 버튼이 많아도 화면 폭을 넘지 않게 */
/* 버튼이 많아지면: 6~8개는 두 줄 격자로 작게, 9개 넘으면 7개 + [더 보기] (화면 밖으로 밀려나지 않게) */
.actions.two{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.7rem}
.actions.two .act{min-height:4.2rem;padding:.6rem 1rem;gap:.7rem}
.actions.two .act .ic{width:2.6rem;height:2.6rem}
.actions.two .act .ic svg{width:1.5rem;height:1.5rem}
.actions.two .act .tx b{font-size:1.3rem}
.actions.two .act .tx span{font-size:.95rem}
.actions.two .act.sg{padding:.6rem 1rem}
.act.more{border-style:dashed}
.act.more .ic{background:var(--card2);color:var(--chalk)}
.actall{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem}
.actall .act{min-height:5.6rem}
@media (orientation:portrait){.actions.two{grid-template-columns:repeat(2,minmax(0,1fr))}.actall{grid-template-columns:1fr}}
.act{all:unset;cursor:pointer;flex:1 1 0;min-width:0;min-height:5.2rem;border-radius:1.1rem;padding:.9rem 1.4rem;display:flex;align-items:center;gap:1rem;
  background:var(--card);border:2px solid var(--line);box-sizing:border-box}
.act:active{transform:scale(.99)}
.act .ic{width:3.2rem;height:3.2rem;border-radius:.8rem;display:grid;place-items:center;flex:none}
.act .ic svg{width:1.8rem;height:1.8rem}
.act .tx{display:flex;flex-direction:column;min-width:0}
.act .tx b{font-size:1.6rem;font-weight:800;overflow:hidden;line-height:1.2;word-break:keep-all;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}   /* 긴 제목은 두 줄까지 */
.act .tx span{font-size:1.1rem;color:var(--chalk2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.act.sv{border-color:rgba(244,211,94,.55)}
.act.sv .ic{background:var(--yellow);color:var(--yellow-ink)}
.act.cn .ic{background:var(--mint);color:#0F2A23}
.act.lk{border-color:rgba(143,180,255,.5)}
.act.lk .ic{background:var(--sky);color:#0E2338}
.lkv{display:flex;gap:3rem;align-items:center;justify-content:center;flex-wrap:wrap;padding:1rem 0}
.lkq{width:min(54vh,44vw);aspect-ratio:1;background:#fff;border-radius:1.2rem;padding:1rem;flex:none}
.lkq svg{display:block;width:100%;height:100%}
.lkt{max-width:34rem;display:flex;flex-direction:column;gap:1.2rem}
.lkt .lead b{color:var(--yellow)}
.lku{font-size:1.15rem;color:var(--chalk3);word-break:break-all}
.lkt .go{text-decoration:none;text-align:center}
.lkn{font-size:1.1rem;color:var(--chalk3);line-height:1.5}
.act.rs .ic{background:var(--sky);color:#0E2338}

/* 겹침 화면 */
.ov{position:fixed;inset:0;background:rgba(14,20,17,.94);z-index:20;display:flex;flex-direction:column;padding:1.6rem 2rem}
.ov[hidden]{display:none}
.ovh{display:flex;align-items:center;gap:1rem;margin-bottom:1.2rem}
.ovh h1{font-size:2.4rem;font-weight:800;letter-spacing:-.02em;flex:1;line-height:1.25}
.ovh .back,.ovh .x{all:unset;cursor:pointer;min-width:5rem;height:4.2rem;padding:0 1.3rem;border-radius:1rem;display:grid;place-items:center;
  background:var(--card2);border:1px solid var(--line);font-size:1.4rem;font-weight:700;box-sizing:border-box}
.ovb{flex:1;min-height:0;overflow:auto}
.lead{font-size:1.5rem;color:var(--chalk2);margin-bottom:1rem}
.lead b{color:var(--yellow)}
.names{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:.7rem}
.nm{all:unset;cursor:pointer;min-height:5.4rem;border-radius:1rem;background:var(--card);border:2px solid var(--line);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:.1rem;box-sizing:border-box;position:relative}
.nm .no{font-size:1.05rem;color:var(--chalk3);font-weight:700}
.nm .na{font-size:1.75rem;font-weight:800}
.nm.done{background:rgba(143,211,193,.12);border-color:rgba(143,211,193,.5)}
.nm.done::after{content:'완료';position:absolute;top:.35rem;right:.5rem;font-size:.85rem;color:var(--mint);font-weight:800}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.9rem}
.og{margin-top:1.4rem}
.og h3{font-size:1.5rem;font-weight:800;color:var(--yellow);margin-bottom:.6rem;padding-bottom:.3rem;border-bottom:1px solid var(--line)}
.og .opts{grid-template-columns:repeat(3,minmax(0,1fr))}
.og .opt{min-height:4.6rem;font-size:1.35rem}
@media (orientation:portrait){.og .opts{grid-template-columns:repeat(2,minmax(0,1fr))}}
.go.stick{position:sticky;bottom:0;box-shadow:0 -1rem 1.6rem rgba(0,0,0,.45);z-index:2}
.og.etcg h3{color:var(--mint)}
.etcbox{margin-top:1rem;border:2px dashed var(--mint);border-radius:1rem;padding:1rem 1.1rem;background:rgba(143,211,193,.06)}
.etcbox .lead{margin:0 0 .6rem;font-size:1.5rem}
.etcshow{min-height:4.4rem;border-radius:.8rem;border:2px solid var(--line);background:var(--card);font-size:2rem;font-weight:700;padding:.6rem 1rem;box-sizing:border-box;word-break:break-all;display:flex;align-items:center;flex-wrap:wrap}
.etcshow .ph{color:var(--chalk3);font-weight:500;font-size:1.5rem}
.etcshow .caret{display:inline-block;width:3px;height:2.2rem;background:var(--yellow);margin-left:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.etcin{width:100%;min-height:4.6rem;border-radius:.8rem;border:2px solid var(--line);background:var(--card);color:var(--chalk);font:inherit;font-size:1.9rem;padding:.5rem 1rem;box-sizing:border-box;user-select:text;-webkit-user-select:text}
.kb{margin-top:.8rem;display:flex;flex-direction:column;gap:.5rem;user-select:none;-webkit-user-select:none}
.kb .kr{display:flex;gap:.5rem;justify-content:center}
.kb button{all:unset;cursor:pointer;flex:1 1 0;max-width:6.4rem;min-height:4.6rem;border-radius:.7rem;background:var(--card2);border:2px solid var(--line);font-size:2rem;font-weight:700;display:grid;place-items:center;box-sizing:border-box;touch-action:manipulation}
.kb button:active{transform:scale(.94);background:var(--yellow);color:var(--yellow-ink)}
.kb button.w{max-width:11rem;font-size:1.35rem}
.kb button.sp{max-width:none;flex:4 1 0;font-size:1.35rem}
.kb button.on{background:var(--yellow);color:var(--yellow-ink);border-color:var(--yellow)}
.etcsw{all:unset;cursor:pointer;margin-top:.6rem;font-size:1.2rem;color:var(--chalk3);text-decoration:underline}
.opt{all:unset;cursor:pointer;min-height:5.6rem;border-radius:1rem;background:var(--card);border:3px solid var(--line);padding:1rem 1.4rem;
  font-size:2rem;font-weight:800;display:flex;align-items:center;gap:1rem;box-sizing:border-box}
.opt .bx{width:2.2rem;height:2.2rem;border-radius:.5rem;border:3px solid var(--chalk3);flex:none;display:grid;place-items:center}
.opt.round .bx{border-radius:50%}
.opt.on{border-color:var(--yellow);background:rgba(244,211,94,.12)}
.opt.on .bx{background:var(--yellow);border-color:var(--yellow)}
.opt.on .bx::after{content:'';width:.9rem;height:.5rem;border-left:4px solid var(--yellow-ink);border-bottom:4px solid var(--yellow-ink);transform:rotate(-45deg) translate(1px,-2px)}
.go{all:unset;cursor:pointer;margin-top:1.3rem;min-height:5.2rem;border-radius:1rem;background:var(--yellow);color:var(--yellow-ink);font-size:2rem;font-weight:800;
  display:flex;align-items:center;justify-content:center;width:100%;box-sizing:border-box}
.go[disabled]{opacity:.35;cursor:default}
.go.mint{background:var(--mint);color:#0F2A23}
.days{display:flex;flex-direction:column;gap:.8rem}
.day{display:grid;grid-template-columns:11rem 1fr;gap:1rem;align-items:center}
.day .d{font-size:1.7rem;font-weight:800}
.day .d small{display:block;font-size:1.05rem;color:var(--chalk3);font-weight:600}
.day .ss{display:flex;gap:.8rem;flex-wrap:wrap}
.slot{all:unset;cursor:pointer;min-height:4.6rem;padding:0 1.6rem;border-radius:1rem;background:var(--card);border:2px solid rgba(143,211,193,.45);
  display:flex;flex-direction:column;justify-content:center;box-sizing:border-box}
.slot b{font-size:1.6rem}
.slot span{font-size:1.1rem;color:var(--chalk2)}
.done-msg{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;height:100%;text-align:center}
.done-msg .big{font-size:4rem;font-weight:800}
.done-msg p{font-size:1.6rem;color:var(--chalk2);line-height:1.6}
.res{display:flex;flex-direction:column;gap:1rem;max-width:70rem}
.res .rw{display:grid;grid-template-columns:18rem 1fr 6rem;gap:1rem;align-items:center;font-size:1.7rem;font-weight:700}
.res .rb{height:2.2rem;background:rgba(243,241,231,.08);border-radius:.6rem;overflow:hidden}
.res .rb i{display:block;height:100%;background:var(--sky)}
.res .rn{text-align:right;font-variant-numeric:tabular-nums}
/* 시간표: 선생님 성 · 특별 시간 */
.tt .tch{font-size:.72em;font-weight:600;margin-left:.12em;opacity:.85}
.big .tch{font-size:.5em;font-weight:700;margin-left:.15em;opacity:.8}
.tt li.sp{font-size:1.05rem;padding:.1rem .7rem;color:var(--mint);border:1px dashed rgba(143,211,193,.35)}
.tt li.sp .t{font-size:.95rem}
.tt li.sp.on{background:var(--mint);color:#0F2A23;border-color:var(--mint)}
.tt li.sp.on .t{color:#0F2A23}
/* 일정 */
.sch{--sz:1;flex:1;min-height:0;display:flex;flex-direction:column;gap:calc(.35rem * var(--sz))}
#csPin{display:flex;flex-direction:column;gap:.35rem}
.evwrap{flex:1;min-height:0;display:flex;gap:.6rem}
.evl{flex:1;min-width:0;min-height:0;overflow-x:hidden;overflow-y:auto;scrollbar-width:none;overscroll-behavior:contain;display:flex;flex-direction:column;gap:.35rem}
.evl::-webkit-scrollbar{display:none}
.evnav{flex:none;width:2.2rem;display:flex;flex-direction:column;align-items:center;gap:.4rem}
.evnav[hidden]{display:none}
.evnav button{all:unset;cursor:pointer;flex:none;width:2.2rem;height:2.2rem;border-radius:.6rem;background:var(--card2);border:1px solid var(--line);
  display:grid;place-items:center;color:var(--chalk2);box-sizing:border-box}
.evnav button:active{background:var(--bg)}
.evnav button[disabled]{opacity:.28;cursor:default}
.evnav button svg{width:1.15rem;height:1.15rem}
.evnav .track{flex:1;min-height:1rem;width:.35rem;border-radius:1rem;background:rgba(243,241,231,.1);position:relative}
.evnav .track i{position:absolute;left:0;right:0;border-radius:1rem;background:var(--chalk3);transition:top .25s ease}
.sch .r{display:grid;grid-template-columns:calc(5rem * var(--sz)) 1fr auto;align-items:center;gap:.7rem;font-size:calc(1.36rem * var(--sz));min-height:calc(2.2rem * var(--sz));
  transition:font-size 1.8s ease,min-height 1.8s ease}
.sch .d{font-size:calc(.98rem * var(--sz));font-weight:800;text-align:center;border-radius:.45rem;padding:.14rem .3rem;background:var(--card2);color:var(--chalk2);white-space:nowrap}
.sch .d.cs{background:rgba(143,211,193,.2);color:var(--mint)}
.sch .w{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 일정 줄: 제목 + 날짜만. 오늘 일정만 제목을 노란색으로 */
.sch .r.ev{grid-template-columns:1fr auto}
.sch .r.ev.tdy .w{color:var(--yellow)}
.sch .r.ev.stu{grid-template-columns:1fr auto auto}
.sch .r.ev .evx{all:unset;cursor:pointer;font-size:calc(.95rem * var(--sz));font-weight:700;color:var(--chalk3);border:1px solid var(--line);border-radius:.5rem;padding:.1rem .5rem;white-space:nowrap}
.sch .r.ev .evx:active{background:var(--card2)}
.evdelbox{font-size:2.2rem;font-weight:800;margin:1rem 0;padding:1.1rem 1.4rem;border-radius:1rem;border:2px dashed var(--line)}
.evdelbox small{display:block;font-size:1.4rem;font-weight:600;color:var(--chalk3);margin-top:.4rem}
.sch .tm{font-size:calc(1rem * var(--sz));color:var(--chalk3);white-space:nowrap;font-variant-numeric:tabular-nums}
.qwrap{flex:1;min-width:0}
.pbtn{cursor:pointer;border-color:rgba(244,211,94,.5) !important}
.pbtn b{color:var(--yellow)}
/* 진행 상황 */
.pgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:.7rem}
.pc{background:var(--card);border:2px solid var(--line);border-radius:1rem;padding:.7rem .8rem;display:flex;flex-direction:column;gap:.45rem}
.pc.done{border-color:rgba(244,211,94,.65)}
.pc .pt{display:flex;align-items:baseline;gap:.4rem;font-size:1.45rem;min-width:0}
.pc .pt b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .pt .no{font-size:1rem;color:var(--chalk3);font-weight:700}
.pc .tr{margin-left:auto;font-size:1.05rem;color:var(--yellow);font-weight:800;display:inline-flex;align-items:center;gap:.15rem}
.pc .tr svg{width:1.1rem;height:1.1rem}
.pc .pb{height:.6rem;background:rgba(243,241,231,.1);border-radius:1rem;overflow:hidden}
.pc .pb i{display:block;height:100%;background:var(--yellow)}
.pc .pm{display:flex;justify-content:space-between;font-size:1rem;color:var(--chalk2)}
.pc .ok{color:var(--mint);font-weight:800}
.tlist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.8rem}
.team{background:var(--card);border:2px solid var(--line);border-radius:1rem;padding:.9rem 1.1rem}
.team.done{border-color:rgba(244,211,94,.65)}
.team .tn{display:flex;align-items:center;gap:.6rem;font-size:1.6rem}
.team .tg2{font-size:.95rem;background:var(--card2);border-radius:.4rem;padding:.05rem .45rem;color:var(--chalk2);font-weight:700}
.team .mb{font-size:1.1rem;color:var(--chalk2);margin-top:.25rem}
.team .tp{font-size:1.25rem;margin-top:.3rem}
.steps{display:flex;gap:.3rem;align-items:center;margin-top:.6rem}
.steps i{flex:1;height:.7rem;border-radius:.3rem;background:rgba(243,241,231,.1)}
.steps i.s1{background:#F97316}.steps i.s2{background:#22C55E}.steps i.s3{background:#3B82F6}.steps i.s4{background:#A855F7}.steps i.s5{background:#F59E0B}
.steps span{font-size:1.05rem;color:var(--chalk2);margin-left:.4rem;font-weight:800;white-space:nowrap}
/* 크기 조절 */
body.editing [data-blk]{position:relative;outline:2px dashed rgba(244,211,94,.6);outline-offset:-1px}
.rz{position:absolute;right:0;bottom:0;width:2.6rem;height:2.6rem;background:var(--yellow);border-radius:.6rem 0 .9rem 0;cursor:nwse-resize;z-index:15;
  display:flex;align-items:flex-end;justify-content:flex-end;touch-action:none}
.rz::after{content:'';border-left:.9rem solid transparent;border-bottom:.9rem solid var(--yellow-ink);margin:0 .35rem .35rem 0}
.rz b{position:absolute;right:2.9rem;bottom:.3rem;font-size:.95rem;background:var(--yellow);color:var(--yellow-ink);padding:.05rem .4rem;border-radius:.4rem;white-space:nowrap}
.mv{position:absolute;left:0;top:0;z-index:15;background:var(--yellow);color:var(--yellow-ink);font-size:1rem;font-weight:800;padding:.35rem .8rem;
  border-radius:.9rem 0 .6rem 0;cursor:grab;touch-action:none;user-select:none;white-space:nowrap}
.mv:active{cursor:grabbing}
body.editing [data-blk].moving{outline:3px solid var(--yellow);opacity:.88;box-shadow:0 1rem 2.4rem rgba(0,0,0,.45)}
.colh{position:absolute;top:0;bottom:0;width:22px;cursor:ew-resize;z-index:16;touch-action:none;display:flex;justify-content:center}
.colh::before{content:'';width:6px;border-radius:3px;background:var(--yellow)}
#editBar{position:fixed;left:50%;top:.8rem;transform:translateX(-50%);z-index:30;background:#0E1512;border:2px solid var(--yellow);border-radius:1rem;
  padding:.8rem 1.1rem;display:flex;flex-wrap:wrap;gap:.6rem 1.1rem;align-items:center;font-size:1.05rem;max-width:94vw;box-shadow:0 1rem 2rem rgba(0,0,0,.5)}
#editBar.low{top:auto;bottom:.8rem}
#editBar label{display:flex;align-items:center;gap:.45rem;white-space:nowrap}
#editBar input[type=range]{width:9rem}
#editBar button{all:unset;cursor:pointer;padding:.45rem .9rem;border-radius:.6rem;background:var(--card2);border:1px solid var(--line);font-weight:700}
#editBar button.pri{background:var(--yellow);color:var(--yellow-ink)}
#editBar p{width:100%;margin:0;font-size:.95rem;color:var(--chalk2)}
#toast{position:fixed;left:50%;bottom:2rem;transform:translateX(-50%);background:var(--chalk);color:#14201B;padding:1rem 1.6rem;border-radius:1rem;
  font-size:1.5rem;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s;z-index:40;max-width:80vw;text-align:center}

function status(t){
  const P = (D.periods || []).map(p => ({...p, a: toMin(p.s), b: toMin(p.e)})).filter(p => p.a >= 0 && p.b > p.a).sort((x, y) => x.a - y.a);

  const [la, lb] = range(D.lunch);
  if (t.dow === 0 || t.dow === 6) return {mode: 'weekend', P, SP};
  if (!P.length) return {mode: 'none', P, SP};
  const sp = SP.find(s => t.hm >= s.a && t.hm < s.b);
  if (sp) return {mode: 'special', P, SP, sp, next: P.find(p => p.a >= sp.b)};
  const cur = P.find(p => t.hm >= p.a && t.hm < p.b);
  if (cur) return {mode: 'class', P, SP, cur, next: P[P.indexOf(cur) + 1]};
  const next = P.find(p => p.a > t.hm);
  if (!next) return {mode: 'after', P, SP};
  if (t.hm < P[0].a) return {mode: 'before', P, SP, next};
  if (la >= 0 && t.hm >= la && t.hm < lb) return {mode: 'lunch', P, SP, next, lunchEnd: lb};
  return {mode: 'break', P, SP, next};
}

let quoteKey = '';
function pickQuote(t){
  const Q = D.quote;
  if (!Q || !Q.list || !Q.list.length) return null;
  const n = Q.list.length, days = Math.floor(Date.UTC(t.y, t.mo - 1, t.d) / 864e5);
  let i = 0;
  if (Q.mode === 'day') i = days % n;
  else if (Q.mode === 'min') i = Math.floor((days * 1440 + t.hm) / 5) % n;
  return {i, q: Q.list[i]};
}
function quoteSize(n){ return n <= 14 ? 3.4 : n <= 28 ? 2.8 : n <= 48 ? 2.3 : n <= 72 ? 1.95 : 1.65; }
function paintQuote(){
  const box = $('quote'); if (!box || !D) return;
  const p = pickQuote(nowParts());
  const key = p ? p.i + '|' + p.q.t + '|' + (p.q.by || '') : 'none|' + D.label;

  if (!p){ box.innerHTML = `<div class="big-cls">${esc(D.label)}</div>`; return; }

let FLASH = null, flashTimer = null;

let ttSig = '';
function renderTT(rows, st, t, sj, spName){
  const box = $('tt');
  const sig = JSON.stringify(rows.map(r => r.k === 's' ? ['s', r.s.name, r.s.s] : ['p', r.p.n, sj(r.p), r.p.s]));
  const fresh = sig !== ttSig;
  if (fresh){
    ttSig = sig;
    box.innerHTML = rows.map(r => r.k === 's'
      ? `<li class="sp"><span class="n"></span><span class="s">${esc(spName(r.s.name))}</span><span class="t">${esc(r.s.s)}</span></li>`
      : `<li><span class="n">${esc(r.p.n)}</span><span class="s">${sj(r.p)}</span><span class="t">${esc(r.p.s)}</span></li>`).join('');
  }
  let cursor = rows.findIndex(r => t.hm < r.b);
  if (cursor < 0) cursor = rows.length;
  const allDone = cursor === rows.length;
  let gone = 0;
  rows.forEach((r, i) => {
    const li = box.children[i];
    if (!li) return;
    let state = '';
    if (i < cursor){
      state = (allDone || cursor - i > 1) ? 'p2' : 'p1';
      if (state === 'p2') gone++;
    } else if (r.k === 's') state = st.sp === r.s ? 'on' : '';
    else state = st.mode === 'class' && st.cur === r.p ? 'on' : (st.next === r.p && st.mode !== 'class' ? 'next' : '');
    const cls = ((r.k === 's' ? 'sp ' : '') + state).trim();
    if (li.className === cls) return;
    const willHide = state === 'p1' || state === 'p2';
    const wasHidden = /\bp[12]\b/.test(li.className);
    if (willHide && !wasHidden && !fresh){
      /* 지금 높이에서 줄어들기 시작하도록 현재 높이를 잡아 둡니다 */
      li.style.setProperty('--h', li.offsetHeight + 'px');
      void li.offsetHeight;
    } else if (!willHide) li.style.removeProperty('--h');
    li.className = cls;
  });
  /* 지나간 시간이 많을수록 아래 일정·상담 칸이 넓어지고 글자도 커집니다 */
  const sb = $('schBox');
  if (sb) sb.style.setProperty('--sz', (1 + Math.min(gone, 3) * 0.1).toFixed(2));
  return allDone;
}

function paintTime(force){
  if (!D) return;
  const t = nowParts();
  $('hm').textContent = hhmm(t.hm);
  $('ss').textContent = ':' + String(t.s).padStart(2, '0');
  if (!force && t.s !== 0) return;
  paintQuote();
  $('date').innerHTML = `<span>${t.mo}월 ${t.d}일 ${DOW[t.dow]}요일</span>${wxHtml()}`;

  /* D-day */
  const base = new Date(t.y, t.mo - 1, t.d);
  $('ddays').innerHTML = (D.ddays || []).map(x => {
    const [yy, mm, dd] = String(x.date).split('-').map(Number);
    const diff = Math.round((new Date(yy, mm - 1, dd) - base) / 864e5);
    if (isNaN(diff) || diff < -3) return '';
    return `<span class="dd">${esc(x.label)}<b>${diff === 0 ? 'D-DAY' : (diff > 0 ? 'D-' + diff : 'D+' + (-diff))}</b></span>`;
  }).join('');

  /* 지금 */
  const st = status(t);
  const sj = p => esc(p.subj || '수업') + (p.teacher ? `<span class="tch">(${esc(p.teacher)})</span>` : '');
  const bigSz = p => { const n = [...(p.subj || '수업')].length + (p.teacher ? 2 : 0); return n <= 4 ? 4.4 : n <= 6 ? 3.7 : n <= 8 ? 3.1 : 2.6; };
  const nx = p => p ? `${esc(p.n)}교시 <b>${sj(p)}</b>` : '';
  const spName = n => /시간$/.test(n) ? n : n + '시간';
  let h = '';
  if (st.mode === 'class'){
    const c = st.cur, pct = Math.round((t.hm - c.a) / (c.b - c.a) * 100);
    h = `<div class="k">${esc(c.n)}교시 · ${esc(c.s)}~${esc(c.e)}</div><div class="big y" style="font-size:${bigSz(c)}rem">${sj(c)}</div>

      <div class="sub"><b>${mins(c.b - t.hm)}</b> 남음${st.next ? ` · 다음 ${nx(st.next)}` : ' · 마지막 시간'}</div>`;
  } else if (st.mode === 'special'){
    const s = st.sp, pct = Math.round((t.hm - s.a) / (s.b - s.a) * 100);
    h = `<div class="k">${esc(s.s)}~${esc(s.e)}</div><div class="big y">${esc(spName(s.name))}</div>
      <div class="bar"><i style="width:${pct}%;background:var(--mint)"></i></div>
      <div class="sub"><b>${mins(s.b - t.hm)}</b> 남음${st.next ? ` · 다음 ${nx(st.next)}` : ''}</div>`;
  } else if (st.mode === 'break'){
    h = `<div class="k">쉬는 시간 · 다음 ${esc(st.next.n)}교시</div><div class="big" style="font-size:${bigSz(st.next)}rem">${sj(st.next)}</div>
      <div class="sub"><b>${mins(st.next.a - t.hm)}</b> 뒤 시작 · ${esc(st.next.s)}</div>`;
  } else if (st.mode === 'lunch'){
    h = `<div class="k">점심시간</div><div class="big y">맛있게 드세요</div>
      <div class="sub">다음 ${nx(st.next)} · ${esc(st.next.s)} 시작 (${mins(st.next.a - t.hm)} 뒤)</div>`;
  } else if (st.mode === 'before'){
    h = `<div class="k">좋은 아침이에요 · 1교시</div><div class="big" style="font-size:${bigSz(st.next)}rem">${sj(st.next)}</div>
      <div class="sub">${esc(st.next.s)} 시작 · <b>${mins(st.next.a - t.hm)}</b> 남음</div>`;
  } else if (st.mode === 'after'){
    h = `<div class="k">오늘 수업 끝</div><div class="big">수고했어요</div><div class="sub">내일도 반갑게 만나요</div>`;
  } else if (st.mode === 'weekend'){
    h = `<div class="k">주말</div><div class="big">푹 쉬어요</div>`;
  } else {
    h = `<div class="k">오늘</div><div class="big">수업 정보 없음</div><div class="sub">담임 기록실 → 교실 화면에서 시간표를 넣어 주세요</div>`;
  }
  $('now').innerHTML = h;

  /* 시간표 (특별 시간 끼워 넣기) */
  const P = st.P, SPL = P.length ? (st.SP || []) : [];
  const rows = P.map(p => ({k: 'p', a: p.a, b: p.b, p})).concat(SPL.map(s => ({k: 's', a: s.a, b: s.b, s}))).sort((x, y) => x.a - y.a || (x.k === 'p' ? -1 : 1));
  const sb = $('schBox');
  if (!P.length){
    ttSig = '';
    $('tt').innerHTML = `<li><span></span><span class="muted">${st.mode === 'weekend' ? '오늘은 수업이 없어요' : '시간표가 비어 있어요'}</span></li>`;
    if (sb) sb.style.setProperty('--sz', 1);
    $('ttNote').className = 'note';
    $('ttNote').textContent = D.ttNote && st.mode !== 'weekend' ? D.ttNote : '';
  } else {
    const allDone = renderTT(rows, st, t, sj, spName);
    $('ttNote').className = 'note' + (allDone ? ' done' : '');
    $('ttNote').textContent = allDone ? '오늘 수업이 모두 끝났어요' : (D.ttNote && st.mode !== 'weekend' ? D.ttNote : '');
  }

  /* 급식: 점심이 끝나면 다음 날 */
  const [, lb] = range(D.lunch);
  const showTom = (lb >= 0 && t.hm >= lb) || t.dow === 0 || t.dow === 6;
  const meals = showTom ? (D.mealTomorrow.meals || []) : (D.meal || []);
  const td = D.mealTomorrow.date;
  $('mealH').textContent = showTom ? `다음 급식 · ${+td.slice(5, 7)}/${+td.slice(8, 10)} (${DOW[new Date(td).getDay()]})` : '오늘 급식';
  const lunch = meals.find(m => /중식/.test(m.kind)) || meals[0];
  const others = meals.filter(m => m !== lunch);
  $('meal').innerHTML = lunch
    ? `<div class="meal">${lunch.dishes.map(d => `<span>${esc(d)}</span>`).join('')}</div>
       <div class="meal2">${esc(lunch.kind)}${lunch.cal ? ' · ' + esc(lunch.cal) : ''}${others.map(o => `<br>${esc(o.kind)}: ${esc(o.dishes.join(', '))}`).join('')}</div>`
    : `<div class="muted" style="font-size:1.4rem">${D.mealErr && !showTom ? esc(D.mealErr) : '급식 정보가 없어요'}</div>`;

  if (t.ymd !== dateKey && dateKey){ dateKey = t.ymd; load(); }
}
/* 일정 목록: 저절로 움직이지 않고, 작은 화살표(또는 손가락·휠)로만 넘깁니다.
 * 마지막으로 만진 뒤 40초가 지나면 맨 위로 한 번 되돌아갑니다. */
let lastNav = 0;
function evScrollTo(y){
  const e = $('evl'); if (!e) return;
  try { e.scrollTo({top: y, behavior: 'smooth'}); } catch (err){ e.scrollTop = y; }
}
function evStep(dir){
  const e = $('evl'); if (!e) return;
  lastNav = Date.now();
  evScrollTo(e.scrollTop + dir * Math.max(60, Math.round(e.clientHeight * 0.7)));
}
function updateNav(){
  const e = $('evl'), nav = $('evnav'); if (!e || !nav) return;
  const over = e.scrollHeight > e.clientHeight + 3;
  nav.hidden = !over;
  if (!over){ if (e.scrollTop) e.scrollTop = 0; return; }

const SCR = {};
function autoScroll(box, key){
  clearInterval(SCR[key]);
  if (!box) return;
  box.scrollTop = 0;
  let dir = 1, pause = 60;
  SCR[key] = setInterval(() => {
    if (box.scrollHeight <= box.clientHeight + 2){ if (box.scrollTop) box.scrollTop = 0; return; }
    if (pause > 0){ pause--; return; }
    box.scrollTop += dir;
    if (box.scrollTop + box.clientHeight >= box.scrollHeight - 1){ dir = -1; pause = 80; }
    if (box.scrollTop <= 0 && dir < 0){ dir = 1; pause = 80; }
  }, 50);
}

const FONT_BASE = 'https://yjb8634-sudo.github.io/class-diary/fonts/';

/* 날짜: 이번 주 월요일부터 2주씩 (월~금), 8주까지 */
function evDays(){
  const t = nowParts(), DW = ['일', '월', '화', '수', '목', '금', '토'], out = [];
  const today = Date.UTC(t.y, t.mo - 1, t.d), w0 = new Date(today).getUTCDay() || 7;
  let mon = today - (w0 - 1) * 864e5;
  if (w0 >= 6) mon += 7 * 864e5;   /* 주말에는 다음 주부터 */
  mon += (OV.wk || 0) * 14 * 864e5;
  for (let i = 0; i < 14; i++){
    const ms = mon + i * 864e5, d = new Date(ms), w = d.getUTCDay();
    if (w === 0 || w === 6) continue;
    out.push({ymd: d.toISOString().slice(0, 10), md: `${d.getUTCMonth() + 1}/${d.getUTCDate()}`, dow: DW[w], today: ms === today, past: ms < today});
  }
  return out;
}
function evPeriods(){
  const ns = (D.periods || []).map(p => String(p.n || '').trim()).filter(n => /^\d{1,2}$/.test(n)).map(n => n + '교시');
  return ['아침'].concat(ns.length ? ns : ['1교시', '2교시', '3교시', '4교시', '5교시', '6교시', '7교시'], ['점심시간', '방과후']);
}
function evTitle(){ return ((OV.per ? OV.per + ' ' : '') + etcText()).slice(0, 40); }
function evPreview(){
  if (!OV.date && !etcText()) return '<span class="ph">여기에 올라갈 모습이 보여요</span>';
  const DW = ['일', '월', '화', '수', '목', '금', '토'], d = OV.date ? new Date(OV.date + 'T00:00:00Z') : null;
  return (d ? `${d.getUTCMonth() + 1}월 ${d.getUTCDate()}일(${DW[d.getUTCDay()]}) ` : '') + esc(evTitle());
}

function resultBars(s){
  const max = Math.max(1, ...s.counts);
  return `<div class="res" style="width:100%">${s.options.map((op, i) => `<div class="rw"><span>${esc(op)}</span>
    <span class="rb"><i style="width:${Math.round(s.counts[i] / max * 100)}%"></i></span><span class="rn">${s.counts[i]}명</span></div>`).join('')}</div>`;
}

    OV.pick = (OV.slots || []).find(x => x.date === b.dataset.d && x.slot === b.dataset.s);
    OV.step = 'confirm'; drawOv(); return;
  }
  if (a === 'book' && BOOT.preview){
    OV.step = 'done'; drawOv(); toast('미리보기: 실제로는 신청되지 않았어요');
    clearTimeout(idleT); idleT = setTimeout(closeOv, 8000);
    return;
  }
  if (a === 'book'){
    b.disabled = true;
    call('apiBoardCounselBook', OV.no, OV.pick.date, OV.pick.slot, pinOf(OV.no)).then(r => {
      if (!r.ok){
        toast(REASON[r.reason] || '신청하지 못했어요. 다시 해 주세요.', true);
        OV.step = 'slot'; OV.slots = null; drawOv();
        call('apiBoardCounselSlots').then(x => { if (OV){ OV.slots = x.slots; drawOv(); } });
        return;
      }
      OV.step = 'done'; drawOv(); load();
      clearTimeout(idleT); idleT = setTimeout(closeOv, 8000);
    }).catch(e => { b.disabled = false; toast(e.message, true); });
  }
});
document.addEventListener('pointerdown', poke);
/* 누르는 효과: 손가락이 닿는 순간 표시하고 떼면 지웁니다 */
(function(){
  let cur = null;
  const off = () => { if (cur){ const c = cur; cur = null; setTimeout(() => c.classList.remove('is-down'), 120); } };
  document.addEventListener('pointerdown', ev => {
    const t = ev.target.closest && ev.target.closest('button,.act,.go,.press,.nt li,.slot,.opt,.nm,.chipbtn');
    if (!t || t.disabled) return;
    off(); cur = t; t.classList.add('is-down');
  }, {passive: true});
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(n => document.addEventListener(n, off, {passive: true}));
  document.addEventListener('touchstart', () => {}, {passive: true});
})();
document.addEventListener('keydown', ev => {
  poke();
  if (OV && (ev.key === 'ArrowLeft' || ev.key === 'ArrowRight')){
    const pb = document.querySelector(ev.key === 'ArrowLeft' ? '[data-fp="-1"]' : '[data-fp="1"]'); if (pb && !pb.disabled){ pb.click(); return; }
  }

document.addEventListener('input', ev => {

});

/* ---------- 화면 크기 조절 (관리자) ---------- */
let LAY = null, LAY0 = null, EDIT = null, DRAG = null;
const LDEF_COLS = [1.15, 1, 1];
const LDEF_ORDER = [['clock', 'now'], ['tt', 'sch'], ['meal', 'nt']];
const MOVABLE = LDEF_ORDER.flat();
function orderOk(o){
  if (!Array.isArray(o) || o.length !== 3 || o.some(c => !Array.isArray(c) || !c.length)) return false;
  const all = o.flat();
  return all.length === MOVABLE.length && MOVABLE.every(k => all.includes(k));
}
function layoutFrom(o){
  o = o || {};
  return {zoom: Number(o.zoom) || 1, top: Number(o.top) || 0, bottom: Number(o.bottom) || 0, left: Number(o.left) || 0, right: Number(o.right) || 0,
    cols: Array.isArray(o.cols) && o.cols.length === 3 ? o.cols.map(Number) : LDEF_COLS.slice(), blk: Object.assign({}, o.blk || {}),
    order: (orderOk(o.order) ? o.order : LDEF_ORDER).map(c => c.slice())};
}
/* 칸 위치: 정해진 순서대로 세 줄(열)에 다시 놓습니다. 이미 그 자리면 건드리지 않습니다. */
function placeBlocks(){
  const g = $('grid'); if (!g) return;
  const cols = g.querySelectorAll(':scope > .col'); if (cols.length !== 3) return;
  LAY.order.forEach((ks, i) => {
    const now = [...cols[i].querySelectorAll(':scope > [data-blk]')].map(el => el.dataset.blk);
    if (now.join() === ks.join()) return;
    ks.forEach(k => { const el = g.querySelector(`[data-blk="${k}"]`); if (el) cols[i].appendChild(el); });
  });
  /* 늘어나는 칸(일정 · 공지 · 지금 수업)이 없는 줄은 마지막 칸이 남은 높이를 채웁니다 */
  cols.forEach(c => {
    const kids = [...c.querySelectorAll(':scope > [data-blk]')];
    kids.forEach(el => el.classList.remove('fill'));
    if (!kids.some(el => el.classList.contains('grow') || el.classList.contains('now')) && kids.length) kids[kids.length - 1].classList.add('fill');
  });
}
function applyLayout(){
  if (!LAY) LAY = layoutFrom(D && D.layout);
  const r = document.documentElement.style;
  r.setProperty('--zoom', LAY.zoom); r.setProperty('--st', LAY.top + 'px'); r.setProperty('--sb', LAY.bottom + 'px');
  r.setProperty('--sl', LAY.left + 'px'); r.setProperty('--sr', LAY.right + 'px');
  LAY.cols.forEach((c, i) => r.setProperty('--c' + (i + 1), c + 'fr'));
  placeBlocks();
  document.querySelectorAll('[data-blk]').forEach(el => {
    const z = LAY.blk[el.dataset.blk] || 1;
    el.style.zoom = z !== 1 ? z : '';
    const lab = el.querySelector(':scope > .rz b'); if (lab) lab.textContent = Math.round(z * 100) + '%';
  });
  if (EDIT) placeColHandles();
}
function placeColHandles(){
  const g = $('grid'); if (!g) return;
  const cols = g.querySelectorAll(':scope > .col'), gr = g.getBoundingClientRect();
  g.querySelectorAll(':scope > .colh').forEach(hd => {
    const i = Number(hd.dataset.ch), x = (cols[i].getBoundingClientRect().right + cols[i + 1].getBoundingClientRect().left) / 2 - gr.left;
    hd.style.left = (x - 11) + 'px';
  });
}
function syncBar(){
  const set = (k, v, txt) => { const i = document.querySelector(`[data-er="${k}"]`); if (i) i.value = v; const s = $('er_' + k); if (s) s.textContent = txt; };
  set('zoom', Math.round(LAY.zoom * 100), Math.round(LAY.zoom * 100) + '%');
  set('top', LAY.top, LAY.top + 'px'); set('bottom', LAY.bottom, LAY.bottom + 'px');
  set('left', LAY.left, LAY.left + 'px'); set('right', LAY.right, LAY.right + 'px');
}
function enterEdit(pw){
  EDIT = {pw}; LAY0 = JSON.parse(JSON.stringify(LAY));
  const nv = $('newVer'); if (nv) nv.hidden = true;
  closeOv();
  document.body.classList.add('editing');
  document.querySelectorAll('[data-blk]').forEach(el => {
    if (el.querySelector(':scope > .rz')) return;
    const hd = document.createElement('span'); hd.className = 'rz'; hd.dataset.rz = el.dataset.blk; hd.innerHTML = '<b></b>'; el.appendChild(hd);
    if (MOVABLE.includes(el.dataset.blk)){
      const mv = document.createElement('span'); mv.className = 'mv'; mv.dataset.mv = el.dataset.blk; mv.textContent = '✥ 옮기기'; el.appendChild(mv);
    }
  });
  [0, 1].forEach(i => { const d = document.createElement('div'); d.className = 'colh'; d.dataset.ch = i; $('grid').appendChild(d); });
  const bar = document.createElement('div'); bar.id = 'editBar';
  bar.innerHTML = `<b>화면 배치 조절</b>
    <label>전체 크기 <input type="range" min="60" max="140" step="1" data-er="zoom"><span id="er_zoom"></span></label>
    <label>위 여백 <input type="range" min="0" max="200" step="2" data-er="top"><span id="er_top"></span></label>
    <label>아래 여백 <input type="range" min="0" max="240" step="2" data-er="bottom"><span id="er_bottom"></span></label>
    <label>왼쪽 여백 <input type="range" min="0" max="240" step="2" data-er="left"><span id="er_left"></span></label>
    <label>오른쪽 여백 <input type="range" min="0" max="240" step="2" data-er="right"><span id="er_right"></span></label>
    <button data-ed="barpos" id="barPos">막대 아래로 ▼</button><button data-ed="reset">처음 크기로</button><button data-ed="cancel">취소</button><button class="pri" data-ed="save">저장</button>
    <p>칸 왼쪽 위 [✥ 옮기기]를 눌러 원하는 자리로 끌면 칸의 위치가 바뀝니다(다른 줄로도 옮길 수 있어요). 칸마다 오른쪽 아래 노란 손잡이를 끌면 그 칸만 커지거나 작아집니다. 칸 사이 노란 세로 막대를 끌면 너비가 바뀝니다. TV 가장자리가 잘려 오른쪽 아래의 [건의사항]이나 제작자 이름이 안 보이면 '오른쪽 여백'과 '아래 여백'을 늘려 주세요.</p>`;
  document.body.appendChild(bar);
  applyLayout(); syncBar();
  toast('화면 배치 조절 중이에요. 다 끝나면 [저장]을 눌러 주세요.');
}
function exitEdit(){
  EDIT = null; DRAG = null;
  document.body.classList.remove('editing');
  document.querySelectorAll('.rz,.mv,.colh,#editBar').forEach(x => x.remove());
  document.querySelectorAll('.moving').forEach(x => x.classList.remove('moving'));
  applyLayout();
}
function editAction(k){
  if (k === 'barpos'){ const bar = $('editBar'), low = bar.classList.toggle('low'); $('barPos').textContent = low ? '막대 위로 ▲' : '막대 아래로 ▼'; return; }
  if (k === 'reset'){ LAY = layoutFrom({}); applyLayout(); syncBar(); return; }
  if (k === 'cancel'){ LAY = layoutFrom(LAY0); exitEdit(); return; }
  if (k === 'save'){
    const sent = LAY.order.map(c => c.join()).join('|'), moved = sent !== LDEF_ORDER.map(c => c.join()).join('|');
    call('apiBoardSaveLayout', EDIT.pw, LAY).then(r => {
      LAY = layoutFrom(r.layout); if (D) D.layout = r.layout;
      exitEdit();
      /* 서버(교실.gs)가 예전 파일이면 칸 위치(order)를 버리고 저장합니다. 그때는 분명히 알려 줍니다. */
      if (moved && !(r.layout && r.layout.order)) toast('크기는 저장했지만 칸 위치는 저장되지 않았어요. Apps Script의 교실.gs를 새 파일로 바꾸고 [새 버전]으로 배포해 주세요.', true);
      else toast('화면 배치를 저장했어요. 다른 화면에도 1분 안에 반영됩니다.');
    }).catch(e => toast(e.message, true));
  }
}
document.addEventListener('input', ev => {
  const k = ev.target.dataset && ev.target.dataset.er;
  if (!k || !EDIT) return;
  LAY[k] = k === 'zoom' ? Number(ev.target.value) / 100 : Number(ev.target.value);
  applyLayout(); syncBar();
});
document.addEventListener('pointerdown', ev => {
  if (!EDIT) return;
  const rz = ev.target.closest && ev.target.closest('.rz'), ch = ev.target.closest && ev.target.closest('.colh');
  const mv = ev.target.closest && ev.target.closest('.mv');
  if (mv){
    ev.preventDefault();
    DRAG = {kind: 'mv', id: mv.dataset.mv};
    const el = mv.parentNode; if (el) el.classList.add('moving');
    try { mv.setPointerCapture(ev.pointerId); } catch (e) {}
    return;
  }
  if (rz){
    ev.preventDefault();
    DRAG = {kind: 'rz', id: rz.dataset.rz, x: ev.clientX, y: ev.clientY, z0: LAY.blk[rz.dataset.rz] || 1};
    try { rz.setPointerCapture(ev.pointerId); } catch (e) {}
  } else if (ch){
    ev.preventDefault();
    DRAG = {kind: 'col', i: Number(ch.dataset.ch), x: ev.clientX,
      w: [...$('grid').querySelectorAll(':scope > .col')].map(c => c.getBoundingClientRect().width), f: LAY.cols.slice()};
    try { ch.setPointerCapture(ev.pointerId); } catch (e) {}
  }
});
document.addEventListener('pointermove', ev => {
  if (!DRAG) return;
  if (DRAG.kind === 'mv'){ moveTo(DRAG.id, ev.clientX, ev.clientY); return; }
  if (DRAG.kind === 'rz'){
    const d = ((ev.clientX - DRAG.x) + (ev.clientY - DRAG.y)) / 500;
    LAY.blk[DRAG.id] = Math.round(Math.max(.5, Math.min(2, DRAG.z0 * (1 + d))) * 100) / 100;
  } else {
    const i = DRAG.i, dx = ev.clientX - DRAG.x, w = DRAG.w.slice(), tot = w.reduce((a, b) => a + b, 0), min = tot * .16;
    let a = w[i] + dx, b = w[i + 1] - dx;
    if (a < min){ b -= min - a; a = min; }
    if (b < min){ a -= min - b; b = min; }
    w[i] = a; w[i + 1] = b;
    const sf = DRAG.f.reduce((x, y) => x + y, 0);
    LAY.cols = w.map(x => Math.round(x / tot * sf * 100) / 100);
  }
  applyLayout();
});
document.addEventListener('pointerup', () => {
  if (DRAG && DRAG.kind === 'mv') document.querySelectorAll('.moving').forEach(x => x.classList.remove('moving'));
  DRAG = null;
});
/* 끌고 있는 칸을 손가락(마우스) 아래 줄 · 자리로 옮깁니다. 줄마다 칸이 하나는 남아 있어야 해요. */
function moveTo(id, x, y){
  const g = $('grid'); if (!g) return;
  const cols = [...g.querySelectorAll(':scope > .col')]; if (cols.length !== 3) return;
  let ci = 0, best = Infinity;
  cols.forEach((c, i) => { const r = c.getBoundingClientRect(); const d = x < r.left ? r.left - x : (x > r.right ? x - r.right : 0); if (d < best){ best = d; ci = i; } });
  const others = LAY.order[ci].filter(k => k !== id);
  let idx = 0;
  others.forEach((k, j) => { const el = g.querySelector(`[data-blk="${k}"]`); if (!el) return; const r = el.getBoundingClientRect(); if (y > r.top + r.height / 2) idx = j + 1; });
  const from = LAY.order.findIndex(c => c.includes(id));
  if (from !== ci && LAY.order[from].length <= 1) return;
  const next = LAY.order.map(c => c.filter(k => k !== id));
  next[ci].splice(idx, 0, id);
  if (next.map(c => c.join()).join('|') === LAY.order.map(c => c.join()).join('|')) return;
  LAY.order = next; applyLayout();
}
window.addEventListener('resize', () => { if (EDIT) placeColHandles(); });

load();
setInterval(() => paintTime(false), 1000);
setInterval(() => {
  if (loading && Date.now() - loadStart > 90000) loading = false;   /* 응답이 끊겼다면 다시 시도할 수 있게 */
  if (!document.hidden && !loading && Date.now() - lastTry > (lastFail ? 15000 : (BOOT.phone ? 90000 : 55000))) load();
}, 5000);
(function waitInfo(){
  const t0 = Date.now();
  let retried = false;
  const iv = setInterval(() => {
    if (D){ clearInterval(iv); return; }
    const sec = Math.round((Date.now() - t0) / 1000);
    if (sec >= 30 && !retried){ retried = true; loading = false; load(); }
    const l = document.querySelector('#app .loading');
    if (!l || sec < 6) return;
    l.innerHTML = '<div style="text-align:center;line-height:1.8">교실 화면을 준비하는 중… <span style="color:var(--chalk3)">' + sec + '초</span><br>' +
      '<span style="font-size:1.1rem;color:var(--chalk3)">서버 응답을 기다리고 있어요.' + (retried ? ' 한 번 더 요청했어요.' : '') +
      '<br>1분이 넘으면 새로고침(F5) 해 주세요. · 화면 버전 ' + (BOOT.ver || '?') + '</span></div>';
  }, 1000);
})();
/* 긴급 호출은 자주 확인합니다 (가벼운 요청) */
setInterval(pollFlash, 15000);
window.BOARD_MARK_END = 1;
