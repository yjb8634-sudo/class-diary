<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#22392E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="1-2 다이어리">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>강릉제일고 1-2 학급 다이어리</title>
<style>
html,body{margin:0;height:100%;background:#22392E;color:#F4F1E8;font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
.dl{position:fixed;inset:0;display:grid;place-items:center}
.ring{width:34px;height:34px;border-radius:50%;border:3px solid rgba(244,241,232,.18);border-top-color:#FFE27A;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.dl-err{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center;line-height:1.7;font-size:16px}
.dl-err button{font:inherit;color:#F4F1E8;background:transparent;border:1.5px dashed rgba(244,241,232,.6);border-radius:8px;padding:10px 18px;min-height:44px}
</style>
<script src="config.js"></script>
<script src="gas.js"></script>
</head>
<body>
<div class="dl" aria-label="불러오는 중"><div class="ring"></div></div>
<script>
(function () {
  var sa = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
  if (!location.search && sa && window.top === window) { location.replace('app.html'); return; }
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
  window.__diaryRoute();
})();
</script>
</body>
</html>
