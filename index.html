<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>강릉제일고 1-2 학급 다이어리</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="1-2 다이어리">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#18241F">
<style>
html,body{margin:0;height:100%;background:#18241F;font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-tap-highlight-color:transparent}
.app{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
#splash{position:fixed;inset:0;z-index:50;background:#1E3029;display:grid;place-items:center;transition:opacity .5s ease;overflow:hidden}
#splash.hide{opacity:0;pointer-events:none}
#splash::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 32% 26%,rgba(255,255,255,.07),transparent 62%),repeating-linear-gradient(103deg,rgba(255,255,255,.022) 0 3px,transparent 3px 9px),repeating-linear-gradient(17deg,rgba(255,255,255,.018) 0 2px,transparent 2px 11px)}
#splash .frame{position:absolute;inset:14px;border:7px solid #7A5230;border-radius:7px;box-shadow:inset 0 0 0 3px #5C3B20,inset 0 0 44px rgba(0,0,0,.4),0 0 0 2px #4A2F1A}
#splash .tray{position:absolute;left:14px;right:14px;bottom:14px;height:13px;background:#6B4626;border-top:2px solid #8A6038;border-radius:0 0 5px 5px}
#splash .tray i{position:absolute;top:-5px;width:34px;height:8px;border-radius:4px;background:#F3F1E7;box-shadow:0 1px 0 rgba(0,0,0,.25);animation:roll 1.5s cubic-bezier(.4,0,.2,1) .15s both}
@keyframes roll{from{left:76%;transform:rotate(0)}to{left:18%;transform:rotate(-26deg)}}
#splash .in{position:relative;text-align:center;padding:0 26px;filter:url(#chalk)}
#splash .w{display:block;color:#F6F4EA;font-weight:800;line-height:1.26;white-space:nowrap;clip-path:inset(0 100% -14% 0);animation:write .62s steps(18) forwards}
#splash .w1{font-size:clamp(34px,10.5vw,52px);letter-spacing:-1px;animation-delay:.3s}
#splash .w2{font-size:clamp(30px,9vw,46px);letter-spacing:-1px;animation-delay:.92s}
@keyframes write{to{clip-path:inset(0 -6% -14% 0)}}
#splash .ul{display:block;height:4px;width:min(74vw,290px);margin:14px auto 0;background:#CFE3D6;border-radius:3px;transform-origin:left;transform:scaleX(0);opacity:0;animation:ul .5s ease 1.5s forwards}
@keyframes ul{from{opacity:1}to{transform:scaleX(1);opacity:1}}
#splash .sub{margin-top:13px;color:#BFD6C7;font-size:13.5px;letter-spacing:4px;opacity:0;animation:fade .5s ease 1.75s forwards}
#splash .dust{position:absolute;width:4px;height:4px;border-radius:50%;background:#EFEDE2;opacity:0;animation:dust 1.4s ease-out forwards}
@keyframes dust{0%{opacity:.8;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--dx),24px) scale(.3)}}
@keyframes fade{to{opacity:1}}
@media (prefers-reduced-motion:reduce){#splash .w{animation:none;clip-path:none}#splash .ul{animation:none;transform:none}#splash .sub{animation:none;opacity:1}#splash .dust,#splash .tray i{display:none}}
.frames{flex:1;position:relative;background:#fff}
.frames iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
.frames iframe[hidden]{display:none}
.load{position:absolute;inset:0;display:grid;place-items:center;color:#6B7280;font-size:14px;background:#fff}
.load[hidden]{display:none}
.tabs{display:flex;background:#18241F;padding-bottom:env(safe-area-inset-bottom);border-top:1px solid rgba(255,255,255,.08)}
.tabs button{flex:1;border:0;background:none;color:#9AA59E;font:inherit;font-size:11.5px;font-weight:700;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
.tabs button svg{width:23px;height:23px}
.tabs button.on{color:#F4D35E}
.msg{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#F3F1E7;color:#18241F;padding:9px 15px;border-radius:10px;font-size:13px;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.msg.show{opacity:1}
.off{position:fixed;top:env(safe-area-inset-top);left:0;right:0;background:#F2A7A0;color:#3A0F0B;text-align:center;font-size:13px;font-weight:700;padding:7px;z-index:5}
.off[hidden]{display:none}
</style>
</head>
<body>
<div class="app"><div class="frames" id="frames"><div class="load" id="load">불러오는 중…</div></div>
<nav class="tabs" id="tabs"><button data-id="21" aria-label="21일"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c1 3 4 4.5 4 8.5a4 4 0 0 1-8 0c0-1.6.7-2.8 1.6-3.7.2 1.4 1 2.2 1.9 2.2C11 8 10.5 5.5 12 3z"/><path d="M8.5 15.5A3.5 3.5 0 0 0 12 20a3.5 3.5 0 0 0 3.5-4.5"/></svg><span>21일</span></button><button data-id="pbl" aria-label="문제해결"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg><span>문제해결</span></button><button data-id="counsel" aria-label="상담"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.4A8 8 0 1 1 21 12z"/></svg><span>상담</span></button><button data-id="board" aria-label="클래스보드"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg><span>클래스보드</span></button></nav></div>
<div class="off" id="off" hidden>인터넷 연결을 확인해 주세요</div><div class="msg" id="msg"></div>
<div id="splash"><div class="frame"></div><div class="tray"><i></i></div>
<svg width="0" height="0" aria-hidden="true" style="position:absolute"><filter id="chalk">
<feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" seed="7" result="n"/>
<feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G"/>
<feComponentTransfer><feFuncA type="discrete" tableValues="0 .5 .78 .93 1"/></feComponentTransfer>
</filter></svg>
<div class="in"><span class="w w1">1-2</span><span class="w w2">학급 다이어리</span><span class="ul"></span><div class="sub">강릉제일고</div></div></div>
<script>
var TABS=[{"id":"21","url":"https://script.google.com/macros/s/AKfycbyaOTg5Q_U6DwLEX7pO0McTV8aYR7jdYjb1P3K0JeloCEY1f-F4W0caHGN8HV8PQrno/exec?app=1&go=21"},{"id":"pbl","url":"https://script.google.com/macros/s/AKfycbyaOTg5Q_U6DwLEX7pO0McTV8aYR7jdYjb1P3K0JeloCEY1f-F4W0caHGN8HV8PQrno/exec?app=1&go=pbl"},{"id":"counsel","url":"https://script.google.com/macros/s/AKfycbyaOTg5Q_U6DwLEX7pO0McTV8aYR7jdYjb1P3K0JeloCEY1f-F4W0caHGN8HV8PQrno/exec?p=counsel&app=1"},{"id":"board","url":"https://script.google.com/macros/s/AKfycbyaOTg5Q_U6DwLEX7pO0McTV8aYR7jdYjb1P3K0JeloCEY1f-F4W0caHGN8HV8PQrno/exec?p=board&t=vc73c0a29edd&app=1"}];
var cur=null,frames={},lastTap=0;
function $(id){return document.getElementById(id);}
function say(t){var m=$("msg");m.textContent=t;m.className="msg show";clearTimeout(say.t);say.t=setTimeout(function(){m.className="msg";},1600);}
function show(id,reload){
  var t=TABS.filter(function(x){return x.id===id;})[0]||TABS[0];id=t.id;
  var f=frames[id];
  if(!f||reload){
    if(f)f.remove();
    f=document.createElement("iframe");f.title=id;f.allow="fullscreen; clipboard-write";
    $("load").hidden=false;f.onload=function(){if(cur===id)$("load").hidden=true;};
    f.src=t.url;$("frames").appendChild(f);frames[id]=f;
  }else{$("load").hidden=true;}
  Object.keys(frames).forEach(function(k){frames[k].hidden=(k!==id);});
  cur=id;document.querySelectorAll("#tabs button").forEach(function(b){b.className=b.dataset.id===id?"on":"";});
  try{localStorage.setItem("diary_tab",id);}catch(e){}
}
document.querySelectorAll("#tabs button").forEach(function(b){b.onclick=function(){
  var id=b.dataset.id,now=Date.now();
  if(id===cur){if(now-lastTap<1500){show(id,true);say("새로 불러왔어요");lastTap=0;}else{lastTap=now;say("한 번 더 누르면 새로고침");}return;}
  lastTap=0;show(id);
};});
function net(){$("off").hidden=navigator.onLine!==false;}
addEventListener("online",net);addEventListener("offline",net);net();
var first=null;try{first=localStorage.getItem("diary_tab");}catch(e){}
show(first||TABS[0].id);
var sp=$("splash");
if(sp){
  if(!matchMedia("(prefers-reduced-motion:reduce)").matches){
    for(var i=0;i<9;i++){var p=document.createElement("i");p.className="dust";
      p.style.left=(16+Math.random()*68)+"%";p.style.top=(44+Math.random()*16)+"%";
      p.style.setProperty("--dx",(Math.random()*16-8)+"px");p.style.animationDelay=(.5+Math.random()*.9)+"s";
      sp.appendChild(p);}
  }
  var done=false,go=function(){if(done)return;done=true;sp.className="hide";setTimeout(function(){sp.remove();},600);};
  setTimeout(go,2000);
  sp.addEventListener("click",go);
}
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(function(){});}
</script>
</body>
</html>
