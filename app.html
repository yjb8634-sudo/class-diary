<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>강릉제일고 학급 다이어리</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="제일고 다이어리">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#22392E">
<style>
@font-face{font-family:"Bunpil";font-style:normal;font-weight:100 900;font-display:swap;src:url(fonts/Bunpil-R.woff2) format("woff2"),url(fonts/Bunpil-R.woff) format("woff")}
html body *{font-weight:400!important}
#splash .iw{font-weight:700!important}
html,body{margin:0;height:100%;background:#22392E;color:#16181D;font-family:"Bunpil","Pretendard",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-tap-highlight-color:transparent}
.app{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
.frames{flex:1;position:relative;background:#22392E}
.frames iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#22392E}
.frames iframe[hidden]{display:none}
.load{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:rgba(244,241,232,.75);font-size:13.5px;font-weight:600;background:#22392E;z-index:2}
.load[hidden]{display:none}
.ring{width:34px;height:34px;border-radius:50%;border:3px solid rgba(244,241,232,.18);border-top-color:#FFE27A;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tabs{display:flex;background:#22392E;padding:4px 2px env(safe-area-inset-bottom);border-top:5px solid #7A5A3A}
.tabs button{flex:1;border:0;background:none;color:rgba(244,241,232,.55);font:inherit;font-size:11.5px;font-weight:400;letter-spacing:0;white-space:nowrap;min-width:0;padding:7px 1px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;position:relative}
.tabs button svg{width:22px;height:22px}
.tabs button.on{color:#F4F1E8}
.tabs button.on::before{content:"";position:absolute;top:-4px;left:50%;width:18px;height:3px;margin-left:-9px;border-radius:0 0 3px 3px;background:#FFE27A}
.msg{position:fixed;left:50%;bottom:calc(78px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#16181D;color:#fff;padding:9px 15px;border-radius:10px;font-size:13px;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;z-index:9}
.msg.show{opacity:1}
.off{position:fixed;top:env(safe-area-inset-top);left:0;right:0;background:#FDE8E4;color:#8A2A16;text-align:center;font-size:13px;font-weight:700;padding:7px;z-index:5}
.off[hidden]{display:none}
#splash{position:fixed;inset:0;z-index:50;background:#22392E;display:grid;place-items:center;overflow:hidden}
#splash.go{animation:sbg .7s ease .35s forwards;pointer-events:none}
#splash .iw{font-size:clamp(26px,7.4vw,44px);font-weight:800;letter-spacing:-.045em;white-space:nowrap;color:#F4F1E8;animation:rise .8s cubic-bezier(.2,.8,.2,1) both}
#splash.go .iw{animation:zoom 1s cubic-bezier(.7,0,.84,0) forwards}
#splash .icp{position:absolute;left:0;right:0;bottom:calc(30px + env(safe-area-inset-bottom));padding:0 20px;text-align:center;display:flex;flex-direction:column;gap:4px;font-size:11px;line-height:1.55;color:rgba(244,241,232,.6);opacity:0;animation:icin .6s ease .45s forwards}
#splash .icp b{font-size:12px;color:rgba(244,241,232,.85);font-weight:700}
#splash.go .icp{animation:icout .35s ease forwards}
@keyframes icin{to{opacity:1}}
@keyframes icout{from{opacity:1}to{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
@keyframes zoom{from{transform:none;opacity:1}to{transform:scale(16);opacity:0}}
@keyframes sbg{to{background:rgba(34,57,46,0)}}
@media (prefers-reduced-motion:reduce){#splash .iw,#splash.go .iw{animation:none}#splash.go{animation:sbg .3s forwards}.ring{animation-duration:2.4s}}
</style>
</head>
<body>
<div class="app"><div class="frames" id="frames"><div class="load" id="load"><div class="ring"></div>불러오는 중</div></div>
<nav class="tabs" id="tabs"></nav></div>
<div class="off" id="off" hidden>인터넷 연결을 확인해 주세요</div><div class="msg" id="msg"></div>
<div id="splash"><div class="iw">강릉제일고</div><div class="icp"><b>제작 · 강릉제일고 교사 유준배</b><span>© 2026 강릉제일고 교사 유준배. All rights reserved.</span><span>이 프로그램의 화면 · 구성 · 소스 코드를 저작권자의 허락 없이 복제 · 배포 · 전송 · 수정 · 판매할 수 없습니다.</span></div></div>
<script src="config.js"></script>
<script src="gas.js"></script>
<script>
var ICON={
home:'<path d="M3.5 11 12 4l8.5 7"/><path d="M5.5 9.5V20h13V9.5"/><path d="M10 20v-5h4v5"/>',
fire:'<path d="M12 3c1 3 4 4.5 4 8.5a4 4 0 0 1-8 0c0-1.6.7-2.8 1.6-3.7.2 1.4 1 2.2 1.9 2.2C11 8 10.5 5.5 12 3z"/><path d="M8.5 15.5A3.5 3.5 0 0 0 12 20a3.5 3.5 0 0 0 3.5-4.5"/>',
bulb:'<path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/>',
chat:'<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.4A8 8 0 1 1 21 12z"/>',
board:'<rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/>',
pen:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
meet:'<circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M15 14.5c3 0 6 1.8 6 5"/>'
};
var DEFAULT_TABS=[{"id":"home","label":"처음","icon":"home","url":"./?tab=home"},{"id":"board","label":"클래스보드","icon":"board","url":"./?p=board&t=vc73c0a29edd&app=1"},{"id":"21","label":"21일","icon":"fire","url":"./?go=21&app=1"},{"id":"pbl","label":"문제해결","icon":"bulb","url":"./?go=pbl&app=1"},{"id":"essay","label":"소감문","icon":"pen","url":"./?p=act&tab=essay&app=1"},{"id":"meet","label":"학급회의","icon":"meet","url":"./?p=act&tab=meet&app=1"},{"id":"counsel","label":"상담","icon":"chat","url":"./?p=counsel&app=1"}];
var TABS=null;try{TABS=JSON.parse(localStorage.getItem("diary_tabs")||"null");}catch(e){}
if(!TABS||!TABS.length)TABS=DEFAULT_TABS;
var cur=null,frames={},lastTap=0,APP0=Date.now();
function hasTab(id){return TABS.some(function(t){return t.id===id;});}
/* [처음] 탭의 메뉴를 누르면 해당 탭으로 */
window.__appShow=function(id){if(!hasTab(id))return false;show(id);return true;};
function $(id){return document.getElementById(id);}
function say(t){var m=$("msg");m.textContent=t;m.className="msg show";clearTimeout(say.t);say.t=setTimeout(function(){m.className="msg";},1600);}
function e2(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];});}
function drawTabs(){
  $("tabs").innerHTML=TABS.map(function(t){return '<button data-id="'+e2(t.id)+'" aria-label="'+e2(t.label)+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(ICON[t.icon]||"")+'</svg><span>'+e2(t.label)+'</span></button>';}).join("");
  document.querySelectorAll("#tabs button").forEach(function(b){b.className=b.dataset.id===cur?"on":"";b.onclick=function(){
    var id=b.dataset.id,now=Date.now();
    if(id===cur){if(now-lastTap<1500){show(id,true);say("새로 불러왔어요");lastTap=0;}else{lastTap=now;say("한 번 더 누르면 새로고침");}return;}
    lastTap=0;show(id);
  };});
}
function show(id,reload){
  var t=TABS.filter(function(x){return x.id===id;})[0]||TABS[0];id=t.id;
  var f=frames[id];
  if(!f||reload){
    if(f)f.remove();
    f=document.createElement("iframe");f.title=id;f.allow="fullscreen; clipboard-write";
    $("load").hidden=false;f.onload=function(){if(cur===id)$("load").hidden=true;};
    f.src=t.url;$("frames").appendChild(f);frames[id]=f;
  }else{$("load").hidden=true;}
  Object.keys(frames).forEach(function(k){frames[k].hidden=(k!==id);});
  cur=id;document.querySelectorAll("#tabs button").forEach(function(b){b.className=b.dataset.id===id?"on":"";});
  try{localStorage.setItem("diary_tab",id);}catch(e){}
}
function net(){$("off").hidden=navigator.onLine!==false;}
addEventListener("online",net);addEventListener("offline",net);net();
var started=false;
function start(){
  started=true;drawTabs();
  /* 앱을 열면 늘 [처음] 화면부터 */
  var first=hasTab("home")?"home":null;
  if(!first){try{first=localStorage.getItem("diary_tab");}catch(e){}if(!hasTab(first))first=null;}
  show(first||TABS[0].id);
}
if(TABS.length)start();
/* 탭 목록(클래스보드 주소 등)이 바뀌었는지 서버에 물어 다음부터 반영 */
if(window.__diaryApi)__diaryApi("apiAppInfo",[]).then(function(r){
  if(!r||!r.tabs||!r.tabs.length)return;
  var s=JSON.stringify(r.tabs);try{localStorage.setItem("diary_tabs",s);}catch(e){}
  if(!started){TABS=r.tabs;start();return;}
  if(s!==JSON.stringify(TABS)){var keep=cur;TABS=r.tabs;Object.keys(frames).forEach(function(k){frames[k].remove();});frames={};drawTabs();show(hasTab("home")&&Date.now()-APP0<10000?"home":(hasTab(keep)?keep:TABS[0].id));}
},function(e){if(!started)$("load").innerHTML="연결하지 못했어요. 인터넷을 확인한 뒤 다시 열어 주세요.";});
var sp=$("splash"),t0=Date.now();
if(sp){
  var done=false,go=function(){if(done)return;done=true;sp.className="go";setTimeout(function(){sp.remove();},1100);};
  var f0=frames[cur];if(f0)f0.addEventListener("load",function(){setTimeout(go,Math.max(0,2200-(Date.now()-t0)));});
  setTimeout(go,5000);sp.addEventListener("click",go);
}
/* 첫 탭이 뜬 뒤, 다른 탭 화면을 뒤에서 미리 받아 둠 (하루 한 번) */
var warmed=false;function warm(){if(warmed||!window.__diaryWarm)return;warmed=true;setTimeout(function(){__diaryWarm(TABS.filter(function(t){return t.id!==cur;}).map(function(t){return t.url;}));},2500);}
(function(){var f=frames[cur];if(f)f.addEventListener("load",warm);setTimeout(warm,8000);})();
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(function(){});}
</script>
</body>
</html>
