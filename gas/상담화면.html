<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<base target="_top">
<style>

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0}
button,input,textarea,select{font:inherit;color:inherit}
h1,h2,h3,p,figure{margin:0}
ul{margin:0;padding:0;list-style:none}

:root{
  --bg:#F1F4F2;
  --surface:var(--t-surface-2);
  --surface-2:#E9EEEB;
  --ink:var(--t-ink);
  --ink-2:var(--t-ink-2);
  --ink-3:var(--t-ink-3);
  --line:#D7E0DC;
  --line-2:#C3CFCA;
  --teal:var(--t-yellow);
  --teal-ink:var(--t-yellow);
  --teal-soft:rgba(255,233,39,.14);
  --amber:#FFC24A;
  --amber-soft:rgba(255,194,74,.14);
  --danger:#FF6B6B;
  --danger-soft:rgba(215,30,30,.18);
  --shadow:0 1px 2px rgba(16,40,36,.05),0 10px 26px -16px rgba(16,40,36,.28);
  --font-display:'Hahmlet','Nanum Myeongjo',Georgia,serif;
  --font-body:'IBM Plex Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0C1312;
    --surface:#141F1D;
    --surface-2:#1C2926;
    --ink:#E6EEEB;
    --ink-2:#A7B6B2;
    --ink-3:#7A8A86;
    --line:#25322E;
    --line-2:#324340;
    --teal:#63C3B2;
    --teal-ink:#8FD6C8;
    --teal-soft:#123330;
    --amber:#DFA265;
    --amber-soft:#33261A;
    --danger:#E08C8C;
    --danger-soft:#3A2020;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 26px -16px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --bg:#0C1312;
  --surface:#141F1D;
  --surface-2:#1C2926;
  --ink:#E6EEEB;
  --ink-2:#A7B6B2;
  --ink-3:#7A8A86;
  --line:#25322E;
  --line-2:#324340;
  --teal:#63C3B2;
  --teal-ink:#8FD6C8;
  --teal-soft:#123330;
  --amber:#DFA265;
  --amber-soft:#33261A;
  --danger:#E08C8C;
  --danger-soft:#3A2020;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 26px -16px rgba(0,0,0,.7);
}

body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:15px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1060px;margin:0 auto;padding:28px 18px 80px}

/* header */
.masthead{display:flex;flex-direction:column;gap:10px;padding-bottom:20px}
.eyebrow{
  font-family:var(--font-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--teal-ink);font-weight:500;
}
.masthead h1{
  font-family:var(--font-display);font-weight:700;
  font-size:clamp(27px,5.4vw,40px);line-height:1.2;letter-spacing:-.01em;text-wrap:balance;
}
.lead{color:var(--ink-2);max-width:58ch;font-size:14.5px}
.head-row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start;justify-content:space-between}

.stats{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.stat{
  background:var(--surface);border:1px solid var(--line);border-radius:10px;
  padding:8px 12px;display:flex;flex-direction:column;min-width:88px;
}
.stat b{font-family:var(--font-mono);font-size:19px;font-weight:500;line-height:1.2;font-variant-numeric:tabular-nums}
.stat span{font-size:11.5px;color:var(--ink-3);letter-spacing:.02em}

/* buttons */
.btn{
  border:1px solid var(--line-2);background:var(--surface);color:var(--ink);
  border-radius:9px;padding:8px 13px;font-size:13.5px;font-weight:500;cursor:pointer;
  transition:background .14s ease,border-color .14s ease,transform .1s ease;
}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:var(--t-surface-2);font-weight:600}
:root[data-theme="dark"] .btn.primary{color:#08201D}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{color:#08201D}}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2);padding:6px 8px}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.danger{border-color:var(--danger);color:var(--danger);background:transparent}
.btn.danger:hover{background:var(--danger-soft)}
.btn.sm{padding:5px 9px;font-size:12.5px;border-radius:8px}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}

/* banner */
.banner{
  display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;
  background:var(--amber-soft);border:1px solid color-mix(in srgb,var(--amber) 35%,transparent);
  border-radius:12px;padding:12px 14px;margin-bottom:18px;font-size:13.5px;color:var(--ink)
}
.banner .bt{font-weight:600}

/* tabs */
.tabbar{
  position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
  margin:0 -18px 18px;padding:10px 18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap
}
.tabs{display:flex;gap:4px;background:var(--surface-2);padding:3px;border-radius:10px}
.tab{
  border:0;background:transparent;color:var(--ink-2);padding:6px 14px;border-radius:8px;
  font-size:13.5px;font-weight:500;cursor:pointer;font-variant-numeric:tabular-nums
}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
.tabbar .spacer{flex:1}

/* grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:12px}
.day{
  background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 13px 13px;
  display:flex;flex-direction:column;gap:9px;box-shadow:var(--shadow)
}
.day.is-past{opacity:.5}
.day.is-off{background:var(--surface-2);box-shadow:none}
.day-h{display:flex;align-items:baseline;gap:7px}
.dnum{font-family:var(--font-mono);font-size:21px;font-weight:500;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.dmon{font-family:var(--font-mono);font-size:12px;color:var(--ink-3)}
.dow{
  font-size:11.5px;color:var(--ink-2);background:var(--surface-2);border-radius:6px;padding:1px 6px;font-weight:500
}
.day.is-off .dow{background:var(--bg)}
.day-h .flagbox{margin-left:auto;text-align:right}
.day-h .flag{font-size:11.5px;color:var(--ink-3)}
.day-h .flag.today{color:var(--teal-ink);font-weight:600}
.day-h .flag.off{color:var(--amber);font-weight:500}
.daytog{margin-left:8px;padding:3px 8px;font-size:11.5px;border-radius:7px;color:var(--ink-2);flex:none}

.slots{display:flex;flex-direction:column;gap:6px}
.slot{
  width:100%;text-align:left;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;
  border-radius:10px;padding:9px 11px;font-size:13.5px;
}
.dot{width:7px;height:7px;border-radius:50%;flex:none}
.slot .nm{display:flex;flex-direction:column;gap:1px;min-width:0}
.slot .k{font-size:12.5px;font-weight:600;letter-spacing:.01em}
.slot .t{font-family:var(--font-mono);font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.slot .act{font-size:12.5px;color:var(--ink-2);white-space:nowrap}

.slot.open{background:transparent;border:1px dashed var(--line-2);cursor:pointer}
.slot.open:hover{background:var(--surface-2);border-color:var(--teal)}
.slot.open .act{color:var(--teal-ink);font-weight:600}
.slot.taken{border:1px solid transparent;background:var(--surface-2)}
.slot.taken.lunch{background:var(--amber-soft)}
.slot.taken.after{background:var(--teal-soft)}
.slot.taken .act{color:var(--ink);font-weight:600;display:flex;gap:6px;align-items:baseline}
.slot.taken .sid{font-family:var(--font-mono);font-size:11.5px;color:var(--ink-2);font-weight:400}
.slot.editable{cursor:pointer}
.slot.editable:hover{filter:brightness(.97)}
.slot.closed{border:1px solid var(--line);background:transparent;color:var(--ink-3)}
.slot.closed .k,.slot.closed .act{color:var(--ink-3);font-weight:500}
.dot.lunch{background:var(--amber)}
.dot.after{background:var(--teal)}
.k.lunch{color:var(--amber)}
.k.after{color:var(--teal-ink)}
.slot.open .k.lunch,.slot.open .k.after{color:var(--ink)}

.memo-chip{font-size:11.5px;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:4px 8px;line-height:1.4}

.emptynote{grid-column:1/-1;color:var(--ink-3);font-size:13.5px;padding:26px 4px;text-align:center}

/* admin */
.adminbar{
  border:1px solid var(--teal);background:var(--teal-soft);border-radius:14px;padding:14px;margin-bottom:16px;
  display:flex;flex-direction:column;gap:12px
}
.adminbar h2{font-family:var(--font-display);font-size:16px;font-weight:700}
.arow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.arow label{font-size:12.5px;color:var(--ink-2)}
.field{
  border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:7px 9px;font-size:13.5px;
  font-family:inherit;min-width:0
}
.field:focus{outline:2px solid var(--teal);outline-offset:1px;border-color:var(--teal)}
table.list{width:100%;border-collapse:collapse;font-size:13px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table.list th,table.list td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
table.list th{font-size:11.5px;color:var(--ink-3);font-weight:500;letter-spacing:.04em;text-transform:uppercase}
table.list td.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
table.list tr:last-child td{border-bottom:0}
table.list td.memo{white-space:normal;min-width:180px;color:var(--ink-2)}

/* modal */
dialog{
  border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:16px;
  padding:0;width:min(420px,calc(100vw - 28px));box-shadow:0 24px 60px -20px rgba(0,0,0,.45)
}
dialog::backdrop{background:rgba(10,20,18,.45);backdrop-filter:blur(2px)}
.dlg-in{padding:18px 18px 16px;display:flex;flex-direction:column;gap:13px}
.dlg-h{display:flex;flex-direction:column;gap:3px}
.dlg-h .when{font-family:var(--font-display);font-size:19px;font-weight:700}
.dlg-h .sub{font-size:12.5px;color:var(--ink-2)}
.f{display:flex;flex-direction:column;gap:5px}
.f label{font-size:12px;color:var(--ink-2);font-weight:500}
.f .field{width:100%}
.f textarea{resize:vertical;min-height:64px;line-height:1.5}
.hint{font-size:11.5px;color:var(--ink-3)}
.err{font-size:12.5px;color:var(--danger);min-height:0}
.dlg-a{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.dlg-a .left{margin-right:auto}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* toast + saving */
#toast{
  position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(12px);
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13.5px;
  opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease;z-index:40;max-width:min(92vw,420px);
  text-align:center;line-height:1.45
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.bad{background:var(--danger);color:var(--t-surface-2)}
#saving{
  position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 72%,transparent);backdrop-filter:blur(3px);
  display:none;align-items:center;justify-content:center;z-index:50;font-size:14px;color:var(--ink-2)
}
#saving.on{display:flex}
.spin{width:15px;height:15px;border:2px solid var(--line-2);border-top-color:var(--teal);border-radius:50%;
  display:inline-block;margin-right:9px;vertical-align:-2px;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}

footer.foot{margin-top:32px;padding-top:16px;border-top:1px solid var(--line);color:var(--ink-3);font-size:12.5px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
footer.foot .spacer{flex:1}

@media print{
  .tabbar,.btn,.banner,#toast,#saving,dialog{display:none !important}
  body{background:var(--t-surface-2)}
  .day{break-inside:avoid;box-shadow:none}
}

/* 이 프로그램에서만 쓰는 것 */
.titlebox{display:flex;flex-direction:column;gap:8px}
.masthead h1{font-family:var(--font-display);font-weight:700}
.only{color:var(--teal-ink);font-weight:500}
.qrbox{
  background:var(--t-surface-2);border:1px solid var(--line);border-radius:12px;padding:14px;
  display:flex;align-items:center;justify-content:center
}
.qrbox svg{width:100%;max-width:250px;height:auto;display:block}
.qrurl{
  font-family:var(--font-mono);font-size:11.5px;color:var(--ink-2);word-break:break-all;
  background:var(--surface-2);border-radius:8px;padding:8px 10px;line-height:1.5
}
.emptynote .spin{margin-right:8px}
@media print{
  .qrbox{border:0}
  .qrurl{background:none}
}

/* 드래그로 일정 옮기기 */
.slot.taken.editable{cursor:grab}
.slot.taken.editable:active{cursor:grabbing}
.slot.taken.editable.dragging{opacity:.45}
.slot.open.dragover-ok{background:var(--teal-soft);border-color:var(--teal);border-style:solid}
.slot.dragover-no{outline:2px dashed var(--line-2);outline-offset:-2px}

.movebox{border-top:1px dashed var(--line);padding-top:12px;margin-top:2px;gap:8px}
.movebox > .two{margin-bottom:2px}

/* 시간대별 휴무 버튼 */
.daytogs{display:flex;gap:6px;margin-top:-3px}
.daytogs .daytog{flex:1;margin-left:0;text-align:center;white-space:nowrap}
.daytog[data-off="1"]{background:var(--amber-soft);border-color:var(--amber);color:var(--amber)}

/* 상담일지 */
.stat.warn{border-color:var(--amber);background:var(--amber-soft)}
.warn-ink{color:var(--amber)}
.tabdot{
  display:inline-block;margin-left:6px;min-width:18px;padding:0 5px;border-radius:9px;
  background:var(--amber);color:var(--surface);font-family:var(--font-mono);
  font-size:11px;line-height:18px;text-align:center;font-weight:500
}

.logwrap{display:flex;flex-direction:column;gap:14px}
.logbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.logbar .spacer{flex:1}
.loglist{display:flex;flex-direction:column;gap:10px}

.log-card{
  background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--line-2);
  border-radius:12px;padding:13px 15px;display:flex;flex-direction:column;gap:7px;box-shadow:var(--shadow)
}
.log-card.todo{border-left-color:var(--amber)}
.log-card.done{border-left-color:var(--teal)}
.log-card.soon{opacity:.82}

.log-h{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.log-h .spacer{flex:1}
.log-when{font-family:var(--font-display);font-weight:700;font-size:15.5px}
.log-when i{font-style:normal;color:var(--ink-3);font-weight:500;font-size:13px}
.log-slot{display:inline-flex;align-items:center;gap:6px;color:var(--ink-2);font-size:12.5px}
.log-who{font-size:15px;font-weight:600;display:flex;gap:8px;align-items:baseline}
.log-who .sid{font-family:var(--font-mono);font-size:12.5px;color:var(--ink-3);font-weight:400}
.log-line{display:flex;gap:10px;font-size:13.5px;line-height:1.55;align-items:baseline}
.log-line b{flex:none;width:104px;font-size:11.5px;color:var(--ink-3);font-weight:500;letter-spacing:.02em;white-space:nowrap}
.log-line span{white-space:pre-wrap}
.log-line.say span{color:var(--ink-2)}
.log-at{font-family:var(--font-mono);font-size:11px;color:var(--ink-3)}
.log-a{display:flex;gap:8px;flex-wrap:wrap;padding-top:3px}

.badge{
  font-size:11.5px;padding:2px 9px;border-radius:999px;
  border:1px solid var(--line-2);color:var(--ink-2);background:var(--surface-2)
}
.badge.ok{background:var(--teal-soft);border-color:var(--teal);color:var(--teal-ink)}
.badge.no{background:var(--danger-soft);border-color:var(--danger);color:var(--danger)}
.badge.todo{background:var(--amber-soft);border-color:var(--amber);color:var(--amber);font-weight:600}

.chip-ok,.chip-todo{margin-left:6px;font-size:10.5px;padding:1px 6px;border-radius:999px;white-space:nowrap}
.chip-ok{background:var(--teal-soft);color:var(--teal-ink)}
.chip-todo{background:var(--amber-soft);color:var(--amber)}

.saybox{
  background:var(--surface-2);border-radius:10px;padding:10px 12px;
  font-size:13.5px;line-height:1.6;color:var(--ink-2);white-space:pre-wrap
}
.saybox b{display:block;font-size:11px;color:var(--ink-3);font-weight:500;letter-spacing:.04em;margin-bottom:3px}

.seg{display:flex;gap:6px}
.seg label{position:relative;cursor:pointer}
.seg input{position:absolute;opacity:0;width:0;height:0}
.seg span{
  display:inline-block;padding:7px 16px;border:1px solid var(--line-2);
  border-radius:9px;background:var(--surface);font-size:13.5px
}
.seg input:checked + span{background:var(--teal);border-color:var(--teal);color:var(--surface);font-weight:600}
.seg input:focus-visible + span{outline:2px solid var(--teal);outline-offset:2px}

.field.tall{min-height:118px;resize:vertical;line-height:1.6}

@media (max-width:520px){
  .log-line{flex-direction:column;gap:1px}
  .log-line b{width:auto}
}
@media print{
  .logbar,.log-a{display:none}
  .log-card{break-inside:avoid;box-shadow:none}
}

/* 예약자 명단 (인쇄용) */
#printarea{display:none}
.rosterprev{
  border:1px solid var(--line);border-radius:12px;padding:14px 15px;background:var(--surface);
  max-height:44vh;overflow:auto
}
.roster-h{margin-bottom:12px}
.roster-h h2{font-family:var(--font-display);font-size:21px;font-weight:700;letter-spacing:-.01em}
.roster-sub{font-size:12.5px;color:var(--ink-2);margin-top:3px}
.roster-empty{color:var(--ink-3);padding:22px 4px;text-align:center;font-size:14px}
.rtable{width:100%;border-collapse:collapse}
.rtable th{
  font-size:11px;color:var(--ink-3);font-weight:500;letter-spacing:.05em;text-align:left;
  padding:5px 8px;border-bottom:1px solid var(--line-2)
}
.rtable td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.rtable tr:last-child td{border-bottom:0}
.rdate{font-family:var(--font-display);font-weight:700;font-size:17px;white-space:nowrap}
.rdate i{font-style:normal;font-weight:500;font-size:12.5px;color:var(--ink-3);margin-left:6px}
.rtime{white-space:nowrap;font-size:12.5px;color:var(--ink-2)}
.rtime b{font-weight:600;color:var(--ink);margin-right:6px}
.rsid{
  font-family:var(--font-mono);font-size:17px;font-weight:500;
  font-variant-numeric:tabular-nums;white-space:nowrap
}
.rname{font-size:19px;font-weight:700;white-space:nowrap}
.rmemo{font-size:13px;color:var(--ink-2);line-height:1.5}
.roster-foot{margin-top:10px;font-size:11.5px;color:var(--ink-3)}
.f label.chk{display:flex;align-items:center;gap:7px;font-weight:500;color:var(--ink)}

@media print{
  /* 명단만 인쇄할 때 */
  body.roster-print .wrap{display:none !important}
  body.roster-print #printarea{display:block !important}
  #printarea{color:#000}
  #printarea .roster-h h2{font-size:26px}
  #printarea .roster-sub{font-size:14px}
  #printarea .rtable th{font-size:12.5px}
  #printarea .rtable td{padding:12px 10px}
  #printarea .rtable tr{break-inside:avoid}
  #printarea .rdate{font-size:22px}
  #printarea .rdate i{font-size:15px}
  #printarea .rtime{font-size:15px}
  #printarea .rsid{font-size:22px}
  #printarea .rname{font-size:25px}

  }
  html += '<div class="spacer"></div>'
    + '<button class="btn sm" data-act="refresh">새로고침</button>'
    + (isLog ? '' : '<button class="btn sm" data-act="togglepast">' + (ui.showPast ? '지난 날짜 접기' : '지난 날짜 보기') + '</button>')
    + '<button class="btn sm' + (ui.admin ? ' primary' : '') + '" data-act="admin">'
    + (ui.admin ? '관리자 모드 켜짐' : '관리자') + '</button>'
    + '</nav>';

  if (ui.admin) html += adminPanel();

  if (isLog){
    html += logView();
  } else {
    html += '<div class="grid">';
    var days = daysOf(ui.month), today = todayStr(), shown = 0;
    days.forEach(function(d){
      var past = d < today;
      var has = D.taken[bkey(d,'lunch')] || D.taken[bkey(d,'after')];
      if (past && !ui.showPast && !(ui.admin && has)) return;
      shown++;
      html += dayCard(d, past, today);
    });
    if (!shown) html += '<div class="emptynote">이 달에는 표시할 날짜가 없어요. 다른 달을 눌러 보세요.</div>';
    html += '</div>';

    html += '<footer class="foot"><span>' + esc(D.slots.lunch.label) + ' ' + esc(D.slots.lunch.time)
      + ' · ' + esc(D.slots.after.label) + ' ' + esc(D.slots.after.time) + '</span>'
      + '<span class="spacer"></span>'
      + '<span>한 번 신청하면 본인이 지울 수 없어요. 바꾸고 싶으면 선생님께 말해 주세요.</span>'
      + (D.home && !APP_MODE ? '<a href="' + esc(D.home) + '" style="color:var(--teal-ink)">다른 활동 고르기</a>' : '')
      + '</footer>';
  }

  html += '</div>' + modalHtml();
  root.innerHTML = html;

  if (ui.modal){
    var dlg = document.getElementById('dlg');
    if (dlg){
      dlg.showModal();
      var first = ui.modal.type === 'log' ? dlg.querySelector('#g-res')
        : (ui.modal.type === 'roster' ? null : dlg.querySelector('input,textarea'));
      if (first) setTimeout(function(){ first.focus(); }, 30);
    }
  }
}

function dayCard(d, past, today){
  var loff = slotOff(d, 'lunch'), aoff = slotOff(d, 'after');
  var fullOff = (loff && aoff) ? loff : null;   /* 둘 다 막혔을 때만 날짜 전체를 '휴무'로 표시 */
  var dd = +d.slice(8,10);
  var cls = 'day' + (past ? ' is-past' : '') + (fullOff ? ' is-off' : '');
  var flag = '';
  if (d === today) flag = '<span class="flag today">오늘</span>';
  else if (fullOff) flag = '<span class="flag off">' + esc(fullOff) + '</span>';

  var h = '<article class="' + cls + '">'
    + '<div class="day-h"><span class="dnum">' + dd + '</span><span class="dmon">일</span>'
    + '<span class="dow">' + DOW[dowOf(d)] + '</span><span class="flagbox">' + flag + '</span>'
    + '</div>'
    + (ui.admin ? dayOffButtons(d, loff, aoff) : '')
    + '<div class="slots">';
  h += slotEl(d, 'lunch', past, loff);
  h += slotEl(d, 'after', past, aoff);
  h += '</div>';

  if (ui.admin){
    KEYS.forEach(function(k){
      var t = ui.memos[bkey(d,k)];
      var row = 찾기({ date:d, slot:k });
      var 있음 = row && row.id;
      if (!t && !있음) return;
      var 표시 = '';
      if (있음 && row.status) 표시 = '<span class="chip-ok">' + esc(row.status) + '</span>';
      else if (있음 && d <= today) 표시 = '<span class="chip-todo">기록 필요</span>';
      h += '<div class="memo-chip"><b>' + esc(D.slots[k].label) + '</b>'
        + (t ? ' · ' + esc(t) : '') + 표시 + '</div>';
    });
  }
  return h + '</article>';
}

function dayOffButtons(d, loff, aoff){
  return '<div class="daytogs">'
    + '<button class="btn sm ghost daytog" data-act="toggleslot" data-date="' + d + '" data-slot="lunch" data-off="' + (loff ? 1 : 0) + '">'
      + (loff ? '점심 열기' : '점심 막기') + '</button>'
    + '<button class="btn sm ghost daytog" data-act="toggleslot" data-date="' + d + '" data-slot="after" data-off="' + (aoff ? 1 : 0) + '">'
      + (aoff ? '방과후 열기' : '방과후 막기') + '</button>'
  + '</div>';
}

function slotEl(d, k, past, off){
  var meta = D.slots[k];
  var b = D.taken[bkey(d,k)];
  var head = '<span class="dot ' + k + '"></span><span class="nm">'
    + '<span class="k ' + k + '">' + esc(meta.label) + '</span>'
    + '<span class="t">' + esc(meta.time) + '</span></span>';

  if (b){
    var who = b.name
      ? (b.sid ? '<span class="sid">' + esc(b.sid) + '</span>' : '') + esc(b.name)
      : '신청 완료';
    if (ui.admin){
      return '<button class="slot taken ' + k + ' editable" draggable="true" data-act="edit" data-date="' + d + '" data-slot="' + k + '" title="꾹 눌러서 다른 자리로 끌어다 놓을 수 있어요">'
        + head + '<span class="act">' + who + '</span></button>';
    }
    return '<div class="slot taken ' + k + '">' + head + '<span class="act">' + who + '</span></div>';
  }
  if (off) return '<div class="slot closed" title="' + esc(off) + '">' + head + '<span class="act">휴무</span></div>';
  if (past) return '<div class="slot closed">' + head + '<span class="act">지난 날짜</span></div>';
  return '<button class="slot open" data-act="book" data-date="' + d + '" data-slot="' + k + '">'
    + head + '<span class="act">신청하기</span></button>';
}

function adminPanel(){
  var todo = 기록할것().length;
  var 요약 = ui.rows.length
    ? '신청 ' + ui.rows.length + '건'
      + (todo ? ' · <b class="warn-ink">기록할 상담 ' + todo + '건</b> — 위 <b>상담일지</b> 탭에서 정리할 수 있어요.'
              : ' · 상담일지를 모두 정리했어요.')
    : '아직 신청이 없어요.';

  return '<section class="adminbar">'
    + '<h2>관리자 도구</h2>'
    + '<div class="arow">'
      + '<button class="btn sm" data-act="qr">QR 코드</button>'
      + '<button class="btn sm" data-act="settings">기본 설정</button>'
      + '<button class="btn sm" data-act="rangeoff">기간 휴무 지정</button>'
      + '<button class="btn sm" data-act="roster">예약자 명단 인쇄</button>'
      + '<button class="btn sm" data-act="xlsx">엑셀로 내려받기</button>'
      + '<button class="btn sm ghost" data-act="csv">CSV</button>'
      + '<button class="btn sm" data-act="print">인쇄</button>'
      + (D.home ? '<a class="btn sm" style="text-decoration:none" href="' + esc(D.home) + '?p=teacher">담임 기록실</a>' : '')
      + '<button class="btn sm" data-act="logout">관리자 모드 끄기</button>'
    + '</div>'
    + '<div class="hint">' + 요약 + '</div>'
  + '</section>';
}

/* ---------- 상담일지 ---------- */
function 기록할것(){
  var today = todayStr();
  return ui.rows.filter(function(r){ return !r.status && r.date <= today; });
}
function 행찾기(id){
  for (var i = 0; i < ui.rows.length; i++) if (ui.rows[i].id === id) return ui.rows[i];
  return null;
}

function logView(){
  var today = todayStr();
  var all = ui.rows.slice().sort(function(a,b){          /* 최근 상담이 위로 */
    return a.date === b.date ? (slotRank(b.slot) - slotRank(a.slot)) : (a.date < b.date ? 1 : -1);
  });
  var todo = all.filter(function(r){ return !r.status && r.date <= today; });
  var show = ui.logFilter === 'all' ? all : todo;

  var h = '<section class="logwrap">'
    + '<div class="logbar">'
      + '<div class="tabs">'
        + '<button class="tab" data-act="logfilter" data-f="todo" aria-selected="' + (ui.logFilter === 'todo') + '">기록할 상담 ' + todo.length + '</button>'
        + '<button class="tab" data-act="logfilter" data-f="all" aria-selected="' + (ui.logFilter === 'all') + '">전체 ' + all.length + '</button>'
      + '</div>'
      + '<div class="spacer"></div>'
      + '<span class="hint">상담을 마친 날은 여기서 바로 기록해 두면, 엑셀로 뽑을 때 학생별로 모여서 나와요.</span>'
    + '</div>';

  if (!show.length){
    h += '<div class="emptynote">' + (ui.rows.length
      ? (ui.logFilter === 'todo' ? '기록할 상담이 없어요. 모두 정리했습니다.' : '아직 신청이 없어요.')
      : '아직 신청이 없어요.') + '</div>';
  } else {
    h += '<div class="loglist">';
    show.forEach(function(r){ h += logCard(r, today); });
    h += '</div>';
  }
  return h + '</section>';
}

function logCard(r, today){
  var meta = D.slots[r.slot];
  var 앞으로 = r.date > today;
  var 기록됨 = !!r.status;
  var 뱃지 = 기록됨
    ? '<span class="badge ' + (r.status === '완료' ? 'ok' : (r.status === '불참' ? 'no' : 'cx')) + '">' + esc(r.status) + '</span>'
    : (앞으로 ? '<span class="badge soon">예정</span>' : '<span class="badge todo">기록 필요</span>');

  var h = '<article class="log-card' + (기록됨 ? ' done' : (앞으로 ? ' soon' : ' todo')) + '">'
    + '<div class="log-h">'
      + '<span class="log-when">' + (+r.date.slice(5,7)) + '월 ' + (+r.date.slice(8,10)) + '일 <i>(' + DOW[dowOf(r.date)] + ')</i></span>'
      + '<span class="log-slot"><span class="dot ' + r.slot + '"></span>' + esc(meta.label) + ' ' + esc(meta.time) + '</span>'
      + '<span class="spacer"></span>' + 뱃지
    + '</div>'
    + '<div class="log-who"><span class="sid">' + esc(r.sid) + '</span>' + esc(r.name) + '</div>';

  if (r.memo)   h += '<div class="log-line say"><b>하고 싶은 이야기</b><span>' + esc(r.memo) + '</span></div>';
  if (r.result) h += '<div class="log-line"><b>상담 내용</b><span>' + esc(r.result) + '</span></div>';
  if (r.follow) h += '<div class="log-line"><b>후속 조치</b><span>' + esc(r.follow) + '</span></div>';
  if (r.loggedAt) h += '<div class="log-at">' + esc(r.loggedAt) + " 기록" + '</div>';

  h += '<div class="log-a">'
    + '<button class="btn sm' + (기록됨 ? '' : ' primary') + '" data-act="log" data-id="' + esc(r.id) + '">'
    + (기록됨 ? '기록 고치기' : '기록하기') + '</button>'
    + '<button class="btn sm ghost" data-act="edit" data-date="' + esc(r.date) + '" data-slot="' + esc(r.slot) + '">신청 수정</button>'
  + '</div>';
  return h + '</article>';
}

/* ---------- 예약자 명단 (인쇄용) ---------- */
function 명단범위이름(){
  var t = todayStr();
  if (ui.rosterScope === 'today') return (+t.slice(5,7)) + '월 ' + (+t.slice(8,10)) + '일 (' + DOW[dowOf(t)] + ')';
  if (ui.rosterScope === 'next') return '오늘부터 앞으로';
  return (+ui.month.split('-')[1]) + '월';
}

function 명단자료(){
  var t = todayStr();
  return ui.rows.filter(function(r){
    if (ui.rosterScope === 'today') return r.date === t;
    if (ui.rosterScope === 'next') return r.date >= t;
    return r.date.slice(0,7) === ui.month;
  }).sort(function(a,b){
    return a.date === b.date ? (slotRank(a.slot) - slotRank(b.slot)) : (a.date < b.date ? -1 : 1);
  });
}

function 명단html(){
  var rows = 명단자료();
  var 이야기 = !!ui.rosterMemo;
  var h = '<div class="roster">'
    + '<div class="roster-h"><h2>상담 예약자 명단</h2>'
    + '<div class="roster-sub">' + esc(D.subtitle || '')
    + (D.teacher ? ' · ' + esc(D.teacher) : '') + ' · ' + esc(명단범위이름()) + '</div></div>';

  if (!rows.length){
    return h + '<div class="roster-empty">이 범위에는 예약된 상담이 없어요.</div></div>';
  }

  h += '<table class="rtable"><thead><tr>'
    + '<th>날짜</th><th>시간</th><th>학번</th><th>이름</th>'
    + (이야기 ? '<th>하고 싶은 이야기</th>' : '') + '</tr></thead><tbody>';
  rows.forEach(function(r){
    var meta = D.slots[r.slot];
    h += '<tr>'
      + '<td class="rdate">' + (+r.date.slice(5,7)) + '월 ' + (+r.date.slice(8,10)) + '일<i>' + DOW[dowOf(r.date)] + '</i></td>'
      + '<td class="rtime"><b>' + esc(meta.label) + '</b><span>' + esc(meta.time) + '</span></td>'
      + '<td class="rsid">' + esc(r.sid) + '</td>'
      + '<td class="rname">' + esc(r.name) + '</td>'
      + (이야기 ? '<td class="rmemo">' + esc(r.memo || '') + '</td>' : '')
      + '</tr>';
  });
  h += '</tbody></table>'
    + '<div class="roster-foot">모두 ' + rows.length + '명 · '
    + esc(D.slots.lunch.label) + ' ' + esc(D.slots.lunch.time) + ' · '
    + esc(D.slots.after.label) + ' ' + esc(D.slots.after.time) + '</div>';
  return h + '</div>';
}

function 명단인쇄(){
  var area = document.getElementById('printarea');
  if (!area) return;
  area.innerHTML = 명단html();
  document.body.classList.add('roster-print');
  setTimeout(function(){ window.print(); }, 30);
}

        + ['완료','불참','취소'].map(function(v){

          }).join('')
        + '</div></div>'
        + '<div class="f"><label for="g-res">상담 내용</label>'

    }

    var 달이름 = (+ui.month.split('-')[1]) + '월 전체';
    body = '<div class="dlg-h"><span class="when">예약자 명단</span>'

          return '<label><input type="radio" name="g-scope" data-act="rscope" data-v="' + o[0] + '"'

        }).join('')
      + '</div></div>'

function 새로고침(조용히){
  if (!ui.admin && !GME) return Promise.resolve();
  var p = ui.admin ? call('adminData', [ui.pw]) : call('getData', [GME.no, GME.pin]);
  return p.then(function(r){

function 신청보내기(){
  var m = ui.modal;
  var sid = document.getElementById('f-sid').value.trim();
  var name = document.getElementById('f-name').value.trim();
  var memo = document.getElementById('f-memo').value.trim();
  if (!/^[0-9]{3,6}$/.test(sid)) return showErr('학번을 숫자로 적어 주세요. (예: 10327)');
  if (name.length < 2) return showErr('이름을 두 글자 이상 적어 주세요.');
  var pin = (!ui.admin && GME) ? GME.pin : '';   /* 학급 로그인 표 */
  var pinEl = null;

  busy(true);
  var payload = { date:m.date, slot:m.slot, sid:sid, name:name, memo:memo, pin:pin };
  var p = (m.type === 'edit')
    ? call('adminEdit', [ui.pw, { act:'edit', id:찾기(m).id, sid:sid, name:name, memo:memo }])
    : (ui.admin
        ? call('adminEdit', [ui.pw, Object.assign({ act:'add' }, payload)])
        : call('book', [payload]));

  p.then(function(r){
    busy(false);
    if (!r || r.ok === false){
      var why = r && r.reason;
      if (why === 'taken'){ closeModal(); 새로고침(true); }
      if (why === 'pin' && pinEl) pinEl.value = '';
      return showErr((why === 'pin' && r.msg) ? r.msg : (이유말[why] || '저장하지 못했어요. 잠시 뒤 다시 해 주세요.'));
    }
    적용(r);
    closeModal();
    toast(m.type === 'edit' ? '수정했어요.' : '신청이 저장됐어요. 그날 만나요!');
  }).catch(function(){
    busy(false);
    showErr('연결이 끊겼어요. 잠시 뒤 다시 눌러 주세요.');
  });
}

function 찾기(m){
  for (var i = 0; i < ui.rows.length; i++)
    if (ui.rows[i].date === m.date && ui.rows[i].slot === m.slot) return ui.rows[i];
  return { id: '' };
}
function 적용(r){
  if (r.data){ D = r.data; ui.memos = r.memos || {}; ui.rows = r.rows || []; if (r.viewKey != null) ui.viewKey = r.viewKey; }
  else D = r;
  render();
}
function 관리자일(payload, 말){
  busy(true);
  return call('adminEdit', [ui.pw, payload]).then(function(r){
    busy(false);
    if (!r || !r.ok){ toast(이유말[r && r.reason] || '바꾸지 못했어요.', true); return; }
    적용(r);
    if (말) toast(말);
  }).catch(function(){ busy(false); toast('연결이 끊겼어요.', true); });
}

function 지우기(){

function 이동하기(sd, sslot, td, tslot){

/* ---------- 엑셀로 내려받기 ---------- */
function 엑셀받기(){
  if (!ui.admin) return;
  busy(true);
  call('adminXlsx', [ui.pw]).then(function(r){
    busy(false);
    if (!r || !r.ok){
      toast('엑셀을 만들지 못했어요. CSV로 내려받을게요.', true);
      return 내려받기();
    }
    var bin = atob(r.b64);
    var arr = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    var blob = new Blob([arr], { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    var u = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = u; a.download = r.name || '상담기록.xlsx';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(u); }, 5000);
    toast('엑셀 파일을 내려받았어요.');
  }).catch(function(){
    busy(false);
    toast('엑셀을 만들지 못했어요. CSV로 내려받을게요.', true);
    내려받기();
  });
}

function 내려받기(){
  var rows = [['날짜','요일','구분','시간','학번','이름','하고 싶은 이야기','상담 내용','후속 조치','상태','신청한 때','기록한 때']];
  ui.rows.slice().sort(function(a,b){
    return a.date === b.date ? (slotRank(a.slot) - slotRank(b.slot)) : (a.date < b.date ? -1 : 1);
  }).forEach(function(r){
    rows.push([r.date, DOW[dowOf(r.date)], D.slots[r.slot].label, D.slots[r.slot].time,
      r.sid, r.name, r.memo || '', r.result || '', r.follow || '', r.status || '미기록',
      r.at || '', r.loggedAt || '']);
  });
  var csv = '﻿' + rows.map(function(r){
    return r.map(function(c){ return '"' + String(c).replace(/"/g,'""') + '"'; }).join(',');
  }).join('\r\n');
  var a = document.createElement('a');
  a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
  a.download = '상담기록.csv';
  document.body.appendChild(a); a.click(); a.remove();
  toast('파일을 내려받았어요.');
}

/* ---------- 이벤트 ---------- */
document.addEventListener('click', function(ev){
  if (!ev.target || !ev.target.closest) return;
  var t = ev.target.closest('[data-act],[data-month]');
  if (!t) return;
  var act = t.getAttribute('data-act');

  if (t.hasAttribute('data-month')){
    ui.month = t.getAttribute('data-month');
    ui.view = 'cal';
    SS.s('sd_month', ui.month);
    return render();
  }
  if (act === 'viewlog'){ ui.view = 'log'; return render(); }
  if (act === 'logfilter'){
    ui.logFilter = t.getAttribute('data-f') === 'all' ? 'all' : 'todo';
    SS.s('sd_logf', ui.logFilter);
    return render();
  }
  if (act === 'log') return openModal({ type:'log', id:t.getAttribute('data-id') });
  if (act === 'savelog') return 일지저장(t.getAttribute('data-id'));
  if (act === 'clearlog') return 일지지우기(t.getAttribute('data-id'));
  if (act === 'xlsx') return 엑셀받기();
  if (act === 'roster') return openModal({ type:'roster' });
  if (act === 'rscope'){
    ui.rosterScope = t.getAttribute('data-v');
    return render();
  }
  if (act === 'rmemo'){
    ui.rosterMemo = !ui.rosterMemo;
    return render();
  }
  if (act === 'rosterprint') return 명단인쇄();
  if (act === 'togglepast'){
    ui.showPast = !ui.showPast;
    SS.s('sd_past', ui.showPast ? '1' : '0');
    return render();
  }
  if (act === 'refresh'){ toast('불러오는 중이에요…'); return 새로고침(); }
  if (act === 'admin') return ui.admin ? openModal({type:'settings'}) : openModal({type:'pin'});
  if (act === 'logout'){
    ui.admin = false; ui.pw = ''; ui.memos = {}; ui.rows = []; ui.view = 'cal';
    SS.r('sd_pw'); if (window.AdmTok) AdmTok.clear();
    return 새로고침(true);
  }
  if (act === 'book') return openModal({type:'book', date:t.getAttribute('data-date'), slot:t.getAttribute('data-slot')});
  if (act === 'edit') return openModal({type:'edit', date:t.getAttribute('data-date'), slot:t.getAttribute('data-slot')});
  if (act === 'close') return closeModal();
  if (act === 'submit') return 신청보내기();
  if (act === 'del') return 지우기();
  if (act === 'pinok') return 로그인();
  if (act === 'settings') return openModal({type:'settings'});
  if (act === 'savesettings') return 설정저장();
  if (act === 'rangeoff') return openModal({type:'rangeoff'});
  if (act === 'rangeclose') return 기간휴무(false);
  if (act === 'rangeopen') return 기간휴무(true);
  if (act === 'toggleslot') return 슬롯휴무토글(t.getAttribute('data-date'), t.getAttribute('data-slot'), t.getAttribute('data-off') === '1');
  if (act === 'qr') return openModal({type:'qr'});
  if (act === 'copyurl'){
    try {
      navigator.clipboard.writeText(D.url);
      toast('주소를 복사했어요.');
    } catch (e) { toast('직접 복사해 주세요.', true); }
    return;
  }
  if (act === 'csv') return 내려받기();
  if (act === 'print') return window.print();
  if (act === 'movebtn') return 이동버튼();
  if (act === 'copykey') return 키복사();
  if (act === 'regenkey') return 키재발급();
});

/* ---------- 드래그로 일정 옮기기 (관리자) ---------- */
document.addEventListener('dragstart', function(ev){
  var t = ev.target && ev.target.closest && ev.target.closest('.slot.taken.editable');
  if (!t){ return; }
  ui.drag = { date: t.getAttribute('data-date'), slot: t.getAttribute('data-slot') };
  try {
    ev.dataTransfer.effectAllowed = 'move';
    ev.dataTransfer.setData('text/plain', JSON.stringify(ui.drag));
  } catch (e) {}
  setTimeout(function(){ t.classList.add('dragging'); }, 0);
});
document.addEventListener('dragend', function(ev){
  var t = ev.target && ev.target.closest && ev.target.closest('.slot.taken.editable');
  if (t) t.classList.remove('dragging');
  document.querySelectorAll('.dragover-ok,.dragover-no').forEach(function(el){
    el.classList.remove('dragover-ok','dragover-no');
  });
  ui.drag = null;
});
document.addEventListener('dragover', function(ev){
  if (!ui.drag) return;
  var t = ev.target && ev.target.closest && ev.target.closest('.slot');
  if (!t) return;
  var open = t.classList.contains('open');
  if (open) ev.preventDefault();
  try { ev.dataTransfer.dropEffect = open ? 'move' : 'none'; } catch (e) {}
  t.classList.toggle('dragover-ok', open);
  t.classList.toggle('dragover-no', !open);
});
document.addEventListener('dragleave', function(ev){
  var t = ev.target && ev.target.closest && ev.target.closest('.slot');
  if (t) t.classList.remove('dragover-ok','dragover-no');
});
document.addEventListener('drop', function(ev){
  if (!ui.drag) return;
  var t = ev.target && ev.target.closest && ev.target.closest('.slot');
  if (!t) return;
  ev.preventDefault();
  document.querySelectorAll('.dragover-ok,.dragover-no').forEach(function(el){
    el.classList.remove('dragover-ok','dragover-no');
  });
  var src = ui.drag; ui.drag = null;
  if (!t.classList.contains('open')){
    toast('이미 예약된 자리예요. 빈 자리로만 옮길 수 있어요.', true);
    return;
  }
  이동하기(src.date, src.slot, t.getAttribute('data-date'), t.getAttribute('data-slot'));
});

document.addEventListener('keydown', function(ev){
  if (!ui.modal) return;
  if (ev.key === 'Enter' && ui.modal.type === 'pin'){ ev.preventDefault(); 로그인(); }
  else if (ev.key === 'Enter' && (ui.modal.type === 'book' || ui.modal.type === 'edit')
      && ev.target && ev.target.tagName === 'INPUT'){ ev.preventDefault(); 신청보내기(); }
  else if (ui.modal.type === 'log' && ev.key === 'Enter'
      && (ev.metaKey || ev.ctrlKey || (ev.target && ev.target.id === 'g-fu'))){
    ev.preventDefault(); 일지저장(ui.modal.id);
  }
});
document.addEventListener('cancel', function(ev){
  if (ev.target && ev.target.id === 'dlg'){ ev.preventDefault(); closeModal(); }
});

/* ---------- 시작 ---------- */
(function boot(){
  var t = document.createElement('div'); t.id = 'toast'; document.body.appendChild(t);
  var s = document.createElement('div'); s.id = 'saving';
  s.innerHTML = '<div><span class="spin"></span>저장하는 중이에요…</div>';
  document.body.appendChild(s);
  var pa = document.createElement('div'); pa.id = 'printarea'; document.body.appendChild(pa);
  window.addEventListener('afterprint', function(){ document.body.classList.remove('roster-print'); });
  render();

  if (ui.pw){
    call('adminData', [ui.pw]).then(function(r){
      if (r && r.ok){ ui.admin = true; D = r.data; ui.memos = r.memos; ui.rows = r.rows; ui.viewKey = r.viewKey || ''; render(); }
      else { ui.pw = ''; SS.r('sd_pw'); 학생로그인(); }
    }).catch(function(){ 학생로그인(); });
  } else {
    학생로그인();
  }

  setInterval(function(){
    if (ui.modal || ui.busy || document.hidden) return;
    새로고침(true);
  }, 60000);
  document.addEventListener('visibilitychange', function(){
    if (!document.hidden && !ui.modal && !ui.busy) 새로고침(true);
  });
})();

})();
</script>
