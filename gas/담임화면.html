<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base target="_top">
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
h1,h2,h3,h4,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:root{
  --paper:#F4F4F1; --sheet:var(--t-surface-2); --ink:var(--t-ink); --ink2:var(--t-ink-2); --ink3:var(--t-ink-3);
  --rule:#E3E3DE; --rule2:var(--t-line-2); --hover:#F0F0EC;
  --accent:var(--t-yellow); --accent-s:rgba(255,233,39,.12);
  --pos:#2E6B4E; --pos-s:#E6F0EA; --neg:#A4432B; --neg-s:#F6E7E2;
  --a-자율:#3B5B86; --a-진로:#8A6326; --a-행특:#6E3F63; --a-기타:#7A7F87;
  --margin:#E7B9AE;
  --serif:'Noto Serif KR','Nanum Myeongjo',serif;
  --sans:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14.5px;line-height:1.6;
  -webkit-font-smoothing:antialiased;letter-spacing:-.005em}

/* 틀 */
.app{display:grid;grid-template-columns:212px minmax(0,1fr);min-height:100vh}
.side{background:var(--sheet);border-right:1px solid var(--rule);position:sticky;top:0;height:100vh;
  display:flex;flex-direction:column;padding:22px 0 16px}
.brand{padding:0 22px 18px;border-bottom:1px solid var(--rule)}
.brand .cls{font-family:var(--serif);font-size:19px;font-weight:700;letter-spacing:-.02em}
.brand .day{font-size:12.5px;color:var(--ink3);margin-top:2px}
.nav{display:flex;flex-direction:column;padding:12px 0;flex:1;overflow:auto}
.nav button{all:unset;cursor:pointer;padding:8px 22px;font-size:14px;color:var(--ink2);border-left:2px solid transparent;
  display:flex;justify-content:space-between;align-items:center}
.nav button:hover{background:var(--hover);color:var(--ink)}
.nav button[aria-current="page"]{color:var(--ink);font-weight:700;border-left-color:var(--ink);background:var(--hover)}
.nav .sep{height:1px;background:var(--rule);margin:10px 22px}
.nav .n{font-size:11.5px;color:var(--ink3);font-weight:400}
.side .foot{padding:12px 22px 0;border-top:1px solid var(--rule);display:flex;flex-direction:column;gap:4px;font-size:12.5px}
.side .foot a,.side .foot button{all:unset;cursor:pointer;color:var(--ink3)}
.side .foot a:hover,.side .foot button:hover{color:var(--ink)}

main{padding:64px 40px 80px;max-width:1160px;width:100%}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.head h1{font-size:22px;font-weight:700;letter-spacing:-.02em}
.head p{color:var(--ink3);font-size:13px;margin-top:3px}
h2{font-size:15px;font-weight:700;letter-spacing:-.01em}
.lbl{font-size:11.5px;color:var(--ink3);font-weight:600;letter-spacing:.02em}
.muted{color:var(--ink3)} .small{font-size:12.5px}
.box{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:18px 20px;margin-bottom:14px}
.box > h2{margin-bottom:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.sb{justify-content:space-between}
.row.end{justify-content:flex-end}
.grow{flex:1}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;align-items:start}
.bsub{display:flex;gap:8px;margin:4px 0 16px;flex-wrap:wrap;position:sticky;top:0;z-index:5;background:var(--paper,var(--sheet));padding:6px 0}
.bsub button{all:unset;cursor:pointer;flex:1;min-width:150px;padding:10px 14px;border:1px solid var(--rule2);border-radius:8px;background:var(--sheet);display:flex;flex-direction:column;gap:2px}
.bsub button b{font-size:15px}.bsub button span{font-size:11.5px;color:var(--ink3,var(--ink2))}
.bsub button[aria-selected="true"]{border-color:var(--ink);box-shadow:inset 0 -3px 0 var(--ink)}
.bsub button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
details.past{margin-top:12px;border:1px dashed var(--rule2);border-radius:6px;padding:8px 10px}
details.past>summary{cursor:pointer;font-size:13px;list-style-position:inside}
details.past[open]>summary{margin-bottom:6px}
details.past .log{opacity:.8}
.hr{height:1px;background:var(--rule);margin:14px 0}

/* 조작 */
.btn{border:1px solid var(--rule2);background:var(--sheet);border-radius:5px;height:32px;padding:0 12px;cursor:pointer;
  font-size:13.5px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;color:var(--ink)}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--ink);border-color:var(--ink);color:var(--t-surface-2)}
.btn.pri:hover{background:#343942}
.btn.sm{height:26px;padding:0 9px;font-size:12.5px}
.btn.txt{border-color:transparent;background:none;color:var(--ink2);padding:0 6px}
.btn.txt:hover{color:var(--ink);background:var(--hover)}
.btn.neg{color:var(--neg)}
.btn:disabled{opacity:.4;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.in,select.in,textarea.in{border:1px solid var(--rule2);border-radius:5px;padding:6px 9px;background:var(--sheet);min-width:0}
textarea.in{width:100%;resize:vertical;line-height:1.65}
.in:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-s)}
.seg{display:inline-flex;border:1px solid var(--rule2);border-radius:5px;overflow:hidden;background:var(--sheet)}
.seg button{all:unset;cursor:pointer;padding:4px 11px;font-size:12.5px;color:var(--ink2);border-right:1px solid var(--rule)}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--hover)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--t-surface-2)}

/* 표시 */
.area{font-size:12px;color:var(--ink2);white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.area::before{content:'';width:7px;height:7px;border-radius:2px;background:var(--a-기타)}
.area[data-a="자율"]::before{background:var(--a-자율)}
.area[data-a="진로"]::before{background:var(--a-진로)}
.area[data-a="행특"]::before{background:var(--a-행특)}
.tg{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:3px;background:var(--hover);color:var(--ink2);white-space:nowrap}
.tg.pos{background:var(--pos-s);color:var(--pos)}
.tg.neg{background:var(--neg-s);color:var(--neg)}
.tagpick{display:flex;flex-wrap:wrap;gap:4px}
.tagpick button{all:unset;cursor:pointer;font-size:12px;padding:2px 8px;border-radius:3px;border:1px solid var(--rule);color:var(--ink3)}
.tagpick button:hover{border-color:var(--rule2);color:var(--ink2)}
.tagpick button.on.pos{background:var(--pos-s);border-color:var(--pos);color:var(--pos)}
.tagpick button.on.neg{background:var(--neg-s);border-color:var(--neg);color:var(--neg)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:13px;padding:2px 8px;border:1px solid var(--rule2);border-radius:4px;background:var(--sheet)}
.chip b{font-weight:500;color:var(--ink3);font-size:11.5px}
.chip button{all:unset;cursor:pointer;color:var(--ink3);font-size:14px;line-height:1;padding-left:2px}
.chip.link{cursor:pointer}
.chip.link:hover{border-color:var(--ink2)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.empty{color:var(--ink3);padding:22px 0;text-align:center;font-size:13.5px}
.loading{color:var(--ink3);padding:80px 0;text-align:center}

/* 기록 입력: 공책 */
.note{position:relative}
.note textarea{width:100%;min-height:224px;border:1px solid var(--rule2);border-radius:5px;resize:vertical;
  padding:4px 16px 4px 58px;line-height:32px;font-size:15px;
  background:
    linear-gradient(90deg,transparent 43px,var(--margin) 43px,var(--margin) 44px,transparent 44px),
    repeating-linear-gradient(to bottom,var(--sheet) 0,var(--sheet) 31px,var(--rule) 31px,var(--rule) 32px);
  background-attachment:local}
.note textarea:focus{outline:none;border-color:var(--accent)}
.saved{font-size:12px;color:var(--ink3)}

.entry{border-top:1px solid var(--rule);padding:14px 0}
.entry:first-of-type{border-top:0;padding-top:4px}
.entry .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.entry textarea{margin-bottom:8px}

/* 달력 */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;font-size:12px}
.cal .h{color:var(--ink3);text-align:center;padding:2px 0}
.cal button{all:unset;cursor:pointer;aspect-ratio:1;border-radius:3px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:var(--ink2);position:relative}
.cal button:hover{background:var(--hover)}
.cal button.o{color:var(--rule2)}
.cal button.t{font-weight:700;color:var(--ink)}
.cal button.sel{background:var(--ink);color:var(--t-surface-2)}
.cal button i{width:4px;height:4px;border-radius:50%;background:var(--accent);margin-top:2px}
.cal button.sel i{background:var(--t-surface-2)}
.cal button.many i{width:6px;height:6px}

/* 학생 명단 레일 */
.split{display:grid;grid-template-columns:220px minmax(0,1fr);gap:14px;align-items:start}
.rail{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;position:sticky;top:16px;max-height:calc(100vh - 32px);display:flex;flex-direction:column}
.rail .q{padding:10px;border-bottom:1px solid var(--rule)}
.rail .q input{width:100%}
.rail .list{overflow:auto}
.rail button.rs{all:unset;cursor:pointer;display:grid;grid-template-columns:24px 1fr auto;gap:6px;align-items:center;width:100%;
  box-sizing:border-box;padding:7px 12px;border-bottom:1px solid var(--rule);font-size:13.5px}
.rail button.rs:hover{background:var(--hover)}
.rail button.rs[aria-current="true"]{background:var(--ink);color:var(--t-surface-2)}
.rail button.rs[aria-current="true"] .n,.rail button.rs[aria-current="true"] .c{color:#B9BEC6}
.rail .n{color:var(--ink3);font-size:12px;text-align:right}
.rail .c{color:var(--ink3);font-size:11.5px}
.sq{display:inline-flex;gap:2px}
.sq i{width:8px;height:8px;border-radius:2px;border:1px solid var(--rule2)}
.sq i.on[data-a="자율"]{background:var(--a-자율);border-color:var(--a-자율)}
.sq i.on[data-a="진로"]{background:var(--a-진로);border-color:var(--a-진로)}
.sq i.on[data-a="행특"]{background:var(--a-행특);border-color:var(--a-행특)}

.who{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.who .nm{font-family:var(--serif);font-size:26px;font-weight:700;letter-spacing:-.02em}
.who .meta{color:var(--ink3);font-size:13px}

/* 일지 */
.log{list-style:none;padding:0;margin:0}
.log .mon{font-size:12px;color:var(--ink3);font-weight:600;padding:16px 0 6px;border-bottom:1px solid var(--rule)}
.log li.it{display:grid;grid-template-columns:70px 1fr;gap:14px;padding:12px 0;border-bottom:1px solid var(--rule)}
.log .d{font-family:var(--serif);font-size:15px;font-weight:500;color:var(--ink2);line-height:1.3}
.log .d small{display:block;font-family:var(--sans);font-size:11.5px;color:var(--ink3)}
.log .m{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:3px}
.log .src{font-size:12px;color:var(--ink3)}
.log .t{white-space:pre-wrap;font-size:14px}
.log .ttl{font-weight:600;font-size:13.5px}
.log .with{font-size:12px;color:var(--ink3)}
.log .ed{margin-left:auto;opacity:0}
.log li.it:hover .ed{opacity:1}
.log a{color:var(--accent)}
mark{background:#FBEFB5;color:inherit;padding:0 1px}

/* 생기부 */
.src-list{list-style:none;padding:0;margin:0}
.src-list li{display:grid;grid-template-columns:20px 1fr;gap:8px;padding:10px 0;border-top:1px solid var(--rule)}
.src-list li.off .t,.src-list li.off .ttl{color:var(--ink3)}
.src-list input{margin-top:4px}
.src-list .t{white-space:pre-wrap;font-size:13.5px;color:var(--ink2)}
.src-list .m{font-size:12px;color:var(--ink3)}
.ruler{margin-top:10px}
.ruler .bar{position:relative;height:8px;background:var(--hover);border-radius:2px;overflow:hidden}
.ruler .fill{position:absolute;inset:0 auto 0 0;width:0;background:var(--ink);transition:width .12s}
.ruler .nums{display:flex;justify-content:space-between;font-size:12.5px;margin-top:5px;color:var(--ink2)}
.ruler .nums b{font-size:15px;color:var(--ink)}
.ruler.over .fill{background:var(--neg)}
.ruler.over .nums b{color:var(--neg)}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th,table.t td{padding:7px 9px;border-bottom:1px solid var(--rule);text-align:left;vertical-align:top}
table.t th{font-weight:600;color:var(--ink3);font-size:12px;background:var(--t-surface-3);white-space:nowrap}
table.t td.c{cursor:pointer}
table.t td.c:hover{background:var(--hover)}
table.t .over{color:var(--neg)}
.wx{overflow-x:auto}

/* 교우관계 */
#graph{width:100%;height:auto;display:block;background:var(--sheet);border:1px solid var(--rule);border-radius:6px;touch-action:none}
#graph text{font-family:var(--sans);font-size:12.5px;fill:var(--ink);pointer-events:none;paint-order:stroke;stroke:var(--t-surface-2);stroke-width:3px}
#graph circle{cursor:grab;stroke:var(--t-surface-2);stroke-width:2}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2)}
.legend i{display:inline-block;width:20px;height:3px;vertical-align:middle;margin-right:6px}

/* 파일 */
.drop{border:1px dashed var(--rule2);border-radius:6px;padding:26px;text-align:center;color:var(--ink3);cursor:pointer;background:var(--t-surface-3)}
.drop:hover,.drop.on{border-color:var(--ink2);color:var(--ink2)}
.sheets{display:flex;flex-direction:column;border:1px solid var(--rule);border-radius:5px;overflow:hidden}
.sheets button{all:unset;cursor:pointer;padding:7px 10px;font-size:13px;border-bottom:1px solid var(--rule);display:flex;justify-content:space-between;gap:8px}
.sheets button:last-child{border-bottom:0}
.sheets button:hover{background:var(--hover)}
.sheets button[aria-current="true"]{background:var(--ink);color:var(--t-surface-2)}
table.map{border-collapse:collapse;font-size:12.5px;min-width:100%}
table.map th,table.map td{border:1px solid var(--rule);padding:4px 6px;max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
table.map th{background:var(--t-surface-3)}
table.map select{font-size:12px;padding:2px 4px}
table.map tr.hd td{background:var(--t-surface-2)8E0}
tr.warn td{background:#FDF3EE}

/* 모달 · 알림 · 인쇄 */
dialog{border:1px solid var(--rule2);border-radius:8px;padding:0;width:min(640px,calc(100vw - 28px));background:var(--sheet);color:var(--ink)}
dialog::backdrop{background:rgba(20,22,26,.35)}
.dlg{padding:20px 22px;display:flex;flex-direction:column;gap:12px}
.dlg .x{margin-left:auto}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--t-surface-2);padding:9px 15px;border-radius:5px;
  font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .18s;z-index:60;max-width:92vw;text-align:center}
#toast.show{opacity:1} #toast.bad{background:var(--neg)}
#login{max-width:340px;margin:14vh auto;background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:28px}
#login h1{font-family:var(--serif);font-size:22px;margin-bottom:4px}
#printSheet{display:none}
.pvwrap{position:relative;width:100%;aspect-ratio:16/9;border:1px solid var(--rule2);border-radius:6px;overflow:hidden;background:#18241F;margin-top:10px}
.pvwrap iframe{position:absolute;left:0;top:0;width:1920px;height:1080px;border:0;transform-origin:0 0}
.ps{max-width:720px;margin:0 auto;font-size:14px;line-height:1.8}
.ps h1{font-family:var(--serif);font-size:22px;margin-bottom:4px}
.ps .sub{color:var(--ink3);font-size:12.5px;margin-bottom:18px}
.ps .it{display:grid;grid-template-columns:80px 1fr;gap:12px;padding:8px 0;border-bottom:1px solid var(--rule);break-inside:avoid}
.ps .foot{margin-top:20px;font-size:12px;color:var(--ink3)}
@media print{
  body.printing .app, body.printing #toast, body.printing dialog{display:none !important}
  body.printing #printSheet{display:block !important}
  body{background:var(--t-surface-2)}
}

/* 알림 종 */
#bellRoot{position:fixed;top:14px;right:18px;z-index:60}
#bellRoot[hidden]{display:none}
.bell{all:unset;cursor:pointer;position:relative;width:42px;height:42px;border-radius:50%;background:var(--sheet);border:1px solid var(--rule2);display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.bell:hover{background:var(--hover)}
.bell:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.bell svg{width:22px;height:22px;fill:none;stroke:var(--ink);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.bell.ring svg{animation:ring 1.2s ease 2}
@keyframes ring{0%,100%{transform:rotate(0)}15%{transform:rotate(14deg)}30%{transform:rotate(-12deg)}45%{transform:rotate(8deg)}60%{transform:rotate(-5deg)}75%{transform:rotate(2deg)}}
.bell .bdg{position:absolute;top:-4px;right:-5px;min-width:20px;height:20px;padding:0 5px;box-sizing:border-box;border-radius:10px;background:#D93025;color:#fff;font-size:11.5px;font-weight:800;display:grid;place-items:center;border:2px solid var(--sheet);font-family:var(--sans)}
.bpan{position:absolute;top:50px;right:0;width:min(430px,calc(100vw - 24px));max-height:min(72vh,640px);overflow:auto;background:var(--sheet);border:1px solid var(--rule2);border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.22);padding:12px 14px 14px}
.bpan .bh{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.bpan .bh b{font-size:16px;flex:1}
.bpan .bsec{font-size:11.5px;font-weight:700;color:var(--ink3);margin:12px 0 6px;letter-spacing:.02em}
.bpan .bi{border:1px solid var(--rule);border-radius:8px;padding:9px 11px;margin-bottom:7px;background:var(--paper)}
.bpan .bi.pend{border-left:4px solid #D93025}
.bpan .bi.fresh{border-left:4px solid var(--accent)}
.bpan .bi .bt{font-size:13.5px;font-weight:700;line-height:1.45}
.bpan .bi .bc{display:inline-block;font-size:11px;font-weight:700;color:var(--ink2);border:1px solid var(--rule2);border-radius:4px;padding:0 6px;margin-right:6px;vertical-align:1px}
.bpan .bi .bd{font-size:12.5px;color:var(--ink2);white-space:pre-wrap;margin-top:4px;max-height:5.4em;overflow:hidden}
.bpan .bi .bd.all{max-height:none}
.bpan .bi .ba{display:flex;gap:6px;margin-top:6px;justify-content:flex-end;align-items:center}
.bpan .bi .ba .muted{font-size:11.5px;margin-right:auto}
.bpan .bempty{font-size:13px;color:var(--ink3);padding:6px 2px}

@media (max-width:900px){
  #bellRoot{top:8px;right:10px}
  .app{grid-template-columns:minmax(0,1fr)}   /* 1fr만 쓰면 메뉴 줄 폭만큼 칸이 넓어져 가로로 넘쳤습니다 */
  .side,main{min-width:0}
  .side{position:static;height:auto;padding:12px 0 0}
  .brand{padding:0 14px 10px}
  .nav{flex-direction:row;overflow-x:auto;padding:0}
  .nav button{border-left:0;border-bottom:2px solid transparent;padding:8px 12px;white-space:nowrap}
  .nav button[aria-current="page"]{border-bottom-color:var(--ink)}
  .nav .sep{display:none}
  .side .foot{display:none}
  main{padding:18px 14px 60px}
  .cols,.split{grid-template-columns:1fr}
  .rail{position:static;max-height:260px}
  .log li.it{grid-template-columns:1fr;gap:2px}
}
</style>
<?!= include_('테마') ?>
</head>
<body>
<div id="app"><div class="loading">불러오는 중…</div></div>
<div id="printSheet"></div>
<div id="toast" role="status"></div>
<dialog id="dlg"></dialog>
<input type="file" id="fileIn" hidden>
<script>
var FILE_VER = '2026-11-01a';
/* 담임 로그인 표: 다른 탭(상담 신청판 · 21일 · 문제해결 담임 탭)에서도 비밀번호를 다시 묻지 않게 함께 씁니다.

let KEYS = [], AMBIG = [];
const isH = ch => !!ch && /[가-힣]/.test(ch);
const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
const PART = '(?:이)?(?:이랑|하고|에게|한테|께서|까지|부터|처럼|보다|는|은|가|을|를|랑|와|과|도|의|께|만|나|야|아)?';
const norm = s => String(s || '').normalize('NFC').replace(/[\u200B-\u200D\uFEFF]/g, '')
  .replace(/\(.*?\)|\[.*?\]/g, '').replace(/[★☆*※]/g, '').replace(/\s/g, '');

function buildIndex(){
  const given = {};
  S.D.students.forEach(s => {
    const full = norm(s.name), g = full.length >= 3 ? full.slice(1) : '';
    if (g.length >= 2) (given[g] = given[g] || []).push(s.no);
  });
  AMBIG = Object.keys(given).filter(g => given[g].length > 1);
  KEYS = [];
  S.D.students.forEach(s => {
    const full = norm(s.name), g = full.length >= 3 ? full.slice(1) : '';
    KEYS.push({k: full, no: s.no});
    if (g.length >= 2 && given[g].length === 1) KEYS.push({k: g, no: s.no});
    (s.aliases || []).forEach(a => { a = norm(a); if (a) KEYS.push({k: a, no: s.no}); });
  });
  KEYS.sort((a, b) => b.k.length - a.k.length);
}
const keysOf = no => KEYS.filter(k => k.no === no).map(k => k.k);
function scanNames(text, cb){
  let out = text;
  KEYS.forEach(k => {
    const re = new RegExp(escRe(k.k) + PART, 'g');
    let m, res = '', last = 0;
    while ((m = re.exec(out))){
      if (isH(out[m.index - 1]) || isH(out[m.index + m[0].length])) continue;
      res += out.slice(last, m.index) + cb(k) + m[0].slice(k.k.length);
      last = m.index + m[0].length;
    }
    out = res + out.slice(last);
  });
  return out;
}
function detect(t){
  const f = [];
  scanNames(t, k => { if (!f.includes(k.no)) f.push(k.no); return '＿'.repeat(k.k.length); });
  return f;
}
function anon(text, target){
  const P = {가:'', 는:'은', 를:'을', 와:'과', 도:'도', 의:'의', 하고:'하고', 에게:'에게', 한테:'한테', 만:'만'};
  return scanNames(text, k => k.no === target ? '학생' : '다른 학생')
    .replace(/학생이(하고|에게|한테|가|는|를|와|도|의|만)(?![가-힣])/g, (m, p) => '학생' + (P[p] || '이'));
}
function classify(text){
  const sents = text.replace(/\r/g, '').split(/\n+/)
    .flatMap(l => l.replace(/([.!?])\s+/g, '$1\u0001').split('\u0001')).map(s => s.trim()).filter(Boolean);
  const out = []; let prev = [];
  sents.forEach(s => {
    let nos = detect(s);
    if (!nos.length) nos = prev.slice();
    nos = nos.slice().sort((a, b) => a - b);
    const last = out[out.length - 1];
    if (last && last.nos.join() === nos.join()) last.text += ' ' + s;
    else out.push({text: s, nos});
    prev = nos;
  });
  return out.map(e => ({...e, area: guessArea(e.text), tags: guessTags(e.text)}));
}
function neisBytes(s){
  let b = 0;
  for (const ch of String(s || '').replace(/\r\n/g, '\n')) b += ch === '\n' ? 2 : (ch.charCodeAt(0) < 128 ? 1 : 3);

}

function forParent(text, no){
  const s = stu(no), full = norm(s.name), given = full.length >= 3 ? full.slice(1) : full;
  const P = {가:'가', 는:'는', 를:'를', 랑:'랑', 와:'와', 도:'도', 의:'의', 하고:'하고', 에게:'에게', 한테:'한테', 만:'만'};
  return scanNames(text, k => k.no === no ? (k.k === full ? full : given) : '친구')
    .replace(/친구이(하고|에게|한테|가|는|를|랑|와|도|의|만)(?![가-힣])/g, (m, p) => '친구' + P[p]);
}
function parentSheet(no){
  const s = stu(no);
  const list = items(no).filter(i => i.src === '관찰' && toneOf(i.tags) !== 'neg').slice().reverse();
  const cut = items(no).filter(i => i.src === '관찰').length - list.length;
  printSheet(`<div class="ps"><h1>${esc(s.name)} 학생의 학교생활</h1>

}

/* AI 프롬프트 (학생별) */
function studentPrompt(no, kind, range, lim){
  let list = kind === '행특' ? items(no).filter(i => i.src === '관찰' || i.area === '행특') : items(no);
  if (range) list = list.filter(i => daysAgo(i.date) <= range);
  list = list.slice().reverse();
  if (!list.length) return '';
  const src = list.map((it, i) => {
    const tg = (it.tags || []).map(k => '#' + tagOf(k).l).join(' ');
    const body = anon((it.title && it.src !== '관찰' ? it.title + ' — ' : '') + it.text, no).replace(/\n+/g, ' / ');
    return `${i + 1}) [${it.date || '날짜 없음'} · ${it.src}]${tg ? ' ' + tg : ''} ${body}`;
  }).join('\n');
  if (kind === '학생') return `고등학교 담임교사가 학생 개별 상담을 준비하고 있어. 아래는 한 학생('학생'으로 표기)의 학교생활 기록이야.
1. 먼저 인정하고 칭찬해 줄 점 2가지 (근거가 된 기록과 함께)
2. 함께 이야기해 볼 주제 2가지와 그 근거
3. 학생이 스스로 말하게 이끄는 열린 질문 5가지
기록에 없는 내용은 추측하지 말 것.

[기록]
${src}`;
  if (kind === '학부모') return `고등학교 담임교사가 학부모 상담을 준비하고 있어. 아래는 한 학생('학생'으로 표기)의 학교생활 기록이야.
1. 학교에서 보이는 강점 3가지 (근거가 된 기록과 함께)
2. 가정과 함께 살펴볼 점 (사실 위주, 낙인찍는 표현 없이)
3. 상담 때 학부모께 여쭤볼 질문 3가지
기록에 없는 내용은 추측하지 말 것.

[기록]
${src}`;
  return `너는 고등학교 담임교사의 학교생활기록부 작성을 돕고 있어. 아래는 한 학생('학생'으로 표기)의 관찰 기록이야.
이 기록만으로 「행동특성 및 종합의견」 문장을 써 줘.
${RULES(lim)}
- 인성·태도·관계에서 드러난 특징을 구체적 행동과 함께 쓰고, 부정적인 내용은 변화와 성장의 가능성과 함께 순화할 것

[기록]
${src}`;
}
const RULES = lim => `[작성 조건]
- 기록에 있는 사실만 쓰고, 없는 활동이나 결과를 지어내지 말 것
- '~함', '~임', '~보임'처럼 명사형으로 끝나는 문장으로 쓸 것
- 학생 이름, 학교명, 특정 대학·기관·상호명, 교외 대회·수상, 공인어학시험, 부모의 직업·사회경제적 지위 등 기재요령에서 금지하는 내용은 넣지 말 것
- 구체적인 행동 → 거기서 드러난 태도·역량·변화의 순서로 쓸 것
- 공백 포함 ${lim}바이트 이내 (나이스 기준 한글 1자 3바이트, 약 ${Math.floor(lim / 3)}자)
- 줄바꿈 없이 한 문단, 결과 문장만 출력`;

function openPromptDlg(){
  const d = $('dlg');

    <div class="row"><span class="lbl">용도</span><div class="seg">${[['학생','학생 상담'],['학부모','학부모 상담'],['행특','행동특성 초안']].map(([v, l]) =>
      `<button data-act="pdkind" data-v="${v}" aria-pressed="${st.kind === v}">${l}</button>`).join('')}</div></div>
    <div class="row"><span class="lbl">기록 범위</span><div class="seg">${[[30,'최근 30일'],[90,'최근 90일'],[0,'전체']].map(([v, l]) =>
      `<button data-act="pdrange" data-v="${v}" aria-pressed="${st.range === v}">${l}</button>`).join('')}</div>
      ${st.kind === '행특' ? `<span class="lbl" style="margin-left:10px">분량</span><div class="seg">${[900, 1500].map(v =>
        `<button data-act="pdlim" data-v="${v}" aria-pressed="${st.lim === v}">${v.toLocaleString()}바이트</button>`).join('')}</div>` : ''}</div>
    ${out ? `<textarea class="in" id="pdOut" rows="12" readonly>${esc(out)}</textarea>
      <p class="small muted">이름은 '학생', 다른 학생은 '다른 학생'으로 바뀌어 있습니다.</p>
      <div class="row end"><button class="btn" data-act="pdsave">텍스트로 저장</button><button class="btn pri" data-act="pdcopy">복사</button></div>`
      : '<p class="empty">이 범위에는 기록이 없습니다.</p>'}</div>`;
  if (!d.open) d.showModal();
}

<script>
/* ---------- 교우관계도 ---------- */
function vGraph(){
  const R = S.rel;
  return `<div class="head"><div><h1>교우관계도</h1><p>한 기록에 함께 적힌 학생이 선으로 이어집니다. 선이 굵을수록 자주 함께 적혔고, 색은 기록에 붙은 태그를 따릅니다.</p></div>
    <button class="btn" data-act="relayout">다시 배치</button></div>
  <section class="box">
    <div class="row" style="margin-bottom:12px">
      <div class="seg" role="group" aria-label="기간">${[[30,'한 달'],[90,'세 달'],[180,'여섯 달'],[0,'전체']].map(([v, l]) =>
        `<button data-act="relperiod" data-v="${v}" aria-pressed="${R.period === v}">${l}</button>`).join('')}</div>
      <div class="seg" role="group" aria-label="선 종류">${[['all','모두'],['pos','긍정만'],['neg','주의만']].map(([v, l]) =>
        `<button data-act="relkind" data-v="${v}" aria-pressed="${R.kind === v}">${l}</button>`).join('')}</div>
      <label class="small row" style="gap:5px"><input type="checkbox" data-act="relteam" ${R.team ? 'checked' : ''}> 문제해결 모둠도 잇기</label>
      <span class="grow"></span>
      <div class="legend"><span><i style="background:var(--pos)"></i>긍정</span><span><i style="background:var(--neg)"></i>주의</span>
        <span><i style="background:var(--rule2)"></i>태그 없음</span></div></div>
    <svg id="graph" viewBox="0 0 900 580" role="img" aria-label="교우관계도"></svg>
    <p class="small muted" style="margin-top:8px">점을 끌면 이어진 학생이 따라오고, 누르면 그 학생의 관계만 보입니다. 점 크기는 함께 적힌 횟수입니다.</p>
  </section>
  <section class="box"><h2>혼자인 학생</h2><div id="alone"></div>
    <p class="small muted" style="margin-top:8px">관계가 없다는 뜻이 아니라, 이 기간에 교사의 기록에 친구와 함께 담긴 적이 없다는 뜻입니다.</p></section>`;
}
function relData(){
  const R = S.rel, E = {};
  const within = d => !R.period || daysAgo(d) <= R.period;
  const add = (a, b, t) => {
    const k = Math.min(a, b) + '-' + Math.max(a, b);
    const e = E[k] || (E[k] = {a: Math.min(a, b), b: Math.max(a, b), pos: 0, neg: 0, mid: 0, team: false});
    if (t === 'team') e.team = true; else e[t || 'mid']++;
  };
  obsGroups().forEach(g => {
    if (g.nos.length < 2 || !within(g.date)) return;
    const t = toneOf(g.tags) || 'mid';
    for (let i = 0; i < g.nos.length; i++) for (let j = i + 1; j < g.nos.length; j++) add(g.nos[i], g.nos[j], t);
  });
  if (R.team){
    const seen = new Set();
    Object.keys(S.D.sources).forEach(no => items(no).forEach(it => {
      if (!it.team) return;
      const tid = it.id.split(':')[1];
      if (seen.has(tid)) return; seen.add(tid);
      for (let i = 0; i < it.team.length; i++) for (let j = i + 1; j < it.team.length; j++) add(it.team[i], it.team[j], 'team');
    }));
  }
  let edges = Object.values(E).map(e => ({...e, n: e.pos + e.neg + e.mid}));
  if (R.kind !== 'all') edges = edges.filter(e => e[R.kind] > 0);
  return edges;
}
function drawGraph(){
  const svg = $('graph'); if (!svg) return;
  const R = S.rel, W = 900, H = 580, nodes = S.D.students.map(s => s.no), edges = relData();
  const deg = {}; nodes.forEach(n => deg[n] = 0);
  edges.forEach(e => { deg[e.a] += e.n || 1; deg[e.b] += e.n || 1; });
  const sig = [R.period, R.kind, R.team, edges.length].join();
  if (!R.pos || R.sig !== sig){
    const P = {};
    nodes.forEach((n, i) => { const t = i / nodes.length * Math.PI * 2; P[n] = {x: W / 2 + Math.cos(t) * 230, y: H / 2 + Math.sin(t) * 210}; });
    const k = Math.sqrt(W * H / Math.max(nodes.length, 1)) * .55;
    for (let it = 0; it < 360; it++){
      const F = {}; nodes.forEach(n => F[n] = {x: 0, y: 0});
      for (let i = 0; i < nodes.length; i++) for (let j = i + 1; j < nodes.length; j++){
        const a = P[nodes[i]], b = P[nodes[j]];
        let dx = a.x - b.x, dy = a.y - b.y; const d = Math.hypot(dx, dy) || .01, f = k * k / d;
        dx /= d; dy /= d; F[nodes[i]].x += dx * f; F[nodes[i]].y += dy * f; F[nodes[j]].x -= dx * f; F[nodes[j]].y -= dy * f;
      }
      edges.forEach(e => {
        const a = P[e.a], b = P[e.b];
        let dx = a.x - b.x, dy = a.y - b.y; const d = Math.hypot(dx, dy) || .01, f = d * d / k * Math.min(3, .6 + (e.n || 1) * .4);
        dx /= d; dy /= d; F[e.a].x -= dx * f; F[e.a].y -= dy * f; F[e.b].x += dx * f; F[e.b].y += dy * f;
      });
      const temp = 30 * (1 - it / 360) + 1;
      nodes.forEach(n => {
        const p = P[n], f = F[n];
        f.x += (W / 2 - p.x) * .9; f.y += (H / 2 - p.y) * .9;
        const m = Math.hypot(f.x, f.y) || 1;
        p.x = Math.max(30, Math.min(W - 30, p.x + f.x / m * Math.min(m, temp)));
        p.y = Math.max(26, Math.min(H - 20, p.y + f.y / m * Math.min(m, temp)));
      });
    }
    R.pos = P; R.sig = sig;
  }
  R.edges = edges; R.deg = deg;
  paintGraph();
  const alone = nodes.filter(n => !edges.some(e => (e.a === n || e.b === n) && e.n));
  $('alone').innerHTML = alone.length ? `<div class="chips">${alone.map(n => `<span class="chip link" data-act="gostu" data-no="${n}"><b>${n}</b>${esc(nameOf(n))}</span>`).join('')}</div>`
    : '<p class="empty">모든 학생이 한 번 이상 친구와 함께 기록되었습니다.</p>';
}
function paintGraph(){
  const svg = $('graph'), R = S.rel, P = R.pos, F = R.focus, edges = R.edges, deg = R.deg;
  const near = new Set([F]);
  if (F) edges.forEach(e => { if (e.a === F) near.add(e.b); if (e.b === F) near.add(e.a); });
  const col = e => !e.n ? 'var(--ink3)' : (e.neg > e.pos ? 'var(--neg)' : (e.pos > 0 ? 'var(--pos)' : 'var(--rule2)'));
  const rad = n => 6 + Math.min(12, Math.sqrt(deg[n]) * 3);
  svg.innerHTML = edges.map(e => `<line data-e="${e.a}-${e.b}" x1="${P[e.a].x}" y1="${P[e.a].y}" x2="${P[e.b].x}" y2="${P[e.b].y}"
      stroke="${col(e)}" stroke-width="${e.n ? Math.min(9, 1.4 + e.n * 1.2) : 1.4}" ${e.n ? '' : 'stroke-dasharray="4 4"'}
      opacity="${F && e.a !== F && e.b !== F ? .07 : .85}"><title>${esc(nameOf(e.a))} · ${esc(nameOf(e.b))} — 긍정 ${e.pos} · 주의 ${e.neg} · 기타 ${e.mid}${e.team ? ' · 같은 모둠' : ''}</title></line>`).join('')
    + S.D.students.map(s => s.no).map(n => `<g data-n="${n}" opacity="${F && !near.has(n) ? .22 : 1}">
      <circle cx="${P[n].x}" cy="${P[n].y}" r="${rad(n)}" fill="${n === F ? 'var(--ink)' : (deg[n] ? 'var(--accent)' : 'var(--rule2)')}" data-no="${n}"></circle>
      <text x="${P[n].x}" y="${P[n].y - rad(n) - 5}" text-anchor="middle">${esc(nameOf(n))}</text></g>`).join('');
}
let drag = null;
document.addEventListener('pointerdown', ev => {
  const c = ev.target.closest && ev.target.closest('#graph circle');
  if (!c) return;
  const svg = $('graph'), pt = svg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY;
  const p = pt.matrixTransform(svg.getScreenCTM().inverse());
  drag = {no: Number(c.dataset.no), moved: false, last: p};
  c.setPointerCapture(ev.pointerId);
});
document.addEventListener('pointermove', ev => {
  if (!drag) return;
  const svg = $('graph'), pt = svg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY;
  const p = pt.matrixTransform(svg.getScreenCTM().inverse());
  const dx = p.x - drag.last.x, dy = p.y - drag.last.y;
  if (Math.abs(dx) + Math.abs(dy) < .5) return;
  drag.moved = true; drag.last = p;
  const P = S.rel.pos;
  P[drag.no] = {x: p.x, y: p.y};
  S.rel.edges.forEach(e => {
    const o = e.a === drag.no ? e.b : (e.b === drag.no ? e.a : 0);
    if (o){ const f = Math.min(.45, .12 + (e.n || 1) * .06); P[o].x += dx * f; P[o].y += dy * f; }
  });
  paintGraph();
});
document.addEventListener('pointerup', () => {
  if (!drag) return;
  const d = drag; drag = null;
  if (!d.moved){ S.rel.focus = S.rel.focus === d.no ? 0 : d.no; paintGraph(); }
});

/* ---------- 표 파일 읽기 (자율·진로 / 예전 기록) ---------- */
/* 엑셀 도구(약 0.9MB)는 엑셀 · CSV 파일을 불러올 때만 받습니다. 예전에는 화면을 열 때마다 받았습니다. */
var XLSX_P = null;
function ensureXlsx(){
  if (window.XLSX) return Promise.resolve();
  if (XLSX_P) return XLSX_P;
  XLSX_P = new Promise(function(ok, no){
    var s = document.createElement('script');
    s.src = 'https:' + '/' + '/cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';   /* 슬래시 두 개를 붙여 쓰면 구글이 주석으로 잘라 냅니다 */
    s.onload = ok;
    s.onerror = function(){ XLSX_P = null; no(new Error('엑셀 읽기 도구를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.')); };
    document.head.appendChild(s);
  });
  return XLSX_P;
}
async function readTable(file){
  await ensureXlsx();
  const buf = await file.arrayBuffer();
  let wb;
  if (/\.csv$/i.test(file.name)){
    let text;
    try { text = new TextDecoder('utf-8', {fatal: true}).decode(buf); } catch (e){ text = new TextDecoder('euc-kr').decode(buf); }
    wb = XLSX.read(text.replace(/^\uFEFF/, ''), {type: 'string'});
  } else if (/\.xlsx$/i.test(file.name)){
    wb = XLSX.read(buf, {type: 'array', cellDates: true});
  } else throw new Error('.xlsx 또는 .csv 파일만 올릴 수 있습니다. 한셀·한글·옛 엑셀 파일은 [다른 이름으로 저장 → Excel 통합 문서(*.xlsx)]로 바꿔 주세요.');
  return wb.SheetNames.map(n => ({
    name: n,
    rows: XLSX.utils.sheet_to_json(wb.Sheets[n], {header: 1, defval: '', raw: false, dateNF: 'yyyy-mm-dd'})
      .map(r => r.map(c => String(c == null ? '' : c).normalize('NFC').replace(/[\u200B-\u200D\uFEFF]/g, '').trim()))
      .filter(r => r.some(c => c))
  })).filter(s => s.rows.length);
}
const FIELDS = {
  act: [['', '—'], ['grade','학년'], ['klass','반'], ['no','번호'], ['sid','학번'], ['name','이름'], ['area','영역'], ['title','활동명'], ['text','내용'], ['date','날짜'], ['target','대상']],
  rec: [['', '—'], ['date','날짜'], ['name','이름'], ['text','내용'], ['tag','태그']]
};
const FIELD_RE = {
  grade: /^학년$|학년$/, klass: /^반$|학급|^반\s/, no: /^번호$|^번$/, sid: /학번/, name: /이름|성명|명단|참가|학생명|대상자/,
  area: /영역|구분/, title: /활동명|행사|프로그램|주제|활동\s?이름/, text: /내용|특기|문구|기록|활동\s?내용|세부/, date: /날짜|일자|일시|기간/,
  target: /^대상$|참여\s?대상|대상\s?학년/, tag: /태그|분류/
};
function guessHeader(rows, mode){
  let best = 0, bestScore = -1;
  rows.slice(0, 10).forEach((r, i) => {
    const sc = r.filter(c => FIELDS[mode].some(([k]) => k && FIELD_RE[k] && FIELD_RE[k].test(c))).length;
    if (sc > bestScore){ best = i; bestScore = sc; }
  });
  return best;
}
function guessCols(head, mode){
  const cols = {}, used = new Set();
  head.forEach((c, i) => {
    for (const [k] of FIELDS[mode]){
      if (!k || used.has(k) || !FIELD_RE[k] || !FIELD_RE[k].test(c)) continue;
      if (k === 'name' && /학년|반$/.test(c)) continue;
      cols[i] = k; used.add(k); break;
    }
  });
  return cols;
}
const sheetArea = name => /진로/.test(name) ? '진로' : (/자율|자치/.test(name) ? '자율' : '');
function openImport(mode, file){
  readTable(file).then(sheets => {
    if (!sheets.length) return toast('파일에 내용이 없습니다.', true);
    S.imp = {mode, file: file.name, sheets, cur: 0, whole: false, grade: S.D.cfg.학년, klass: S.D.cfg.반, preview: null};
    setSheet(0);
    S.view = mode === 'act' ? 'activity' : 'data'; render();
  }).catch(fail);
}
function setSheet(i){
  const I = S.imp, sh = I.sheets[i];
  I.cur = i; I.hdr = guessHeader(sh.rows, I.mode); I.cols = guessCols(sh.rows[I.hdr] || [], I.mode);
  I.area = sheetArea(sh.name); I.preview = null;
}
function vImporter(){
  const I = S.imp, sh = I.sheets[I.cur], F = FIELDS[I.mode];
  const width = Math.max(...sh.rows.slice(0, 30).map(r => r.length));
  const show = sh.rows.slice(0, Math.max(I.hdr + 6, 8));
  return `<section class="box">
    <div class="row sb"><h2>${esc(I.file)}</h2><button class="btn txt sm" data-act="impclose">닫기</button></div>

function rosterIndex(){
  const m = {};
  S.D.students.forEach(s => {
    m[norm(s.name)] = s.no;
    (s.aliases || []).forEach(a => m[norm(a)] = s.no);
  });
  return m;
}
const splitCell = v => String(v || '').split(/[,，、·ㆍ\/;\n]+/).map(x => x.trim()).filter(Boolean);
function parseSid(v){
  const d = String(v || '').replace(/\D/g, '');
  const m = String(v || '').match(/(\d+)\D+(\d+)\D+(\d+)/);
  if (m) return {g: +m[1], c: +m[2], n: +m[3]};
  if (d.length === 5) return {g: +d[0], c: +d.slice(1, 3), n: +d.slice(3)};
  if (d.length === 4) return {g: +d[0], c: +d[1], n: +d.slice(2)};
  return null;
}
function normDate(v){
  v = String(v || '').trim();
  let m = v.match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);
  if (m) return `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}`;
  m = v.match(/^(\d{1,2})[\/.](\d{1,2})[\/.](\d{2,4})/);
  if (m){ const y = m[3].length === 2 ? '20' + m[3] : m[3]; return `${y}-${m[1].padStart(2, '0')}-${m[2].padStart(2, '0')}`; }
  m = v.match(/^(\d{1,2})[\/.월\s]+(\d{1,2})/);
  if (m) return `${S.D.today.slice(0, 4)}-${m[1].padStart(2, '0')}-${m[2].padStart(2, '0')}`;
  return '';
}
function actRowsOf(sheetIdx, opts){
  const I = S.imp, sh = I.sheets[sheetIdx];
  const hdr = opts ? guessHeader(sh.rows, 'act') : I.hdr;
  const cols = opts ? guessCols(sh.rows[hdr] || [], 'act') : I.cols;
  const areaDefault = opts ? sheetArea(sh.name) : I.area;
  const pick = (r, k) => { const c = Object.keys(cols).find(c => cols[c] === k); return c == null ? '' : (r[c] || ''); };
  const has = k => Object.values(cols).includes(k);
  const G = +I.grade, C = +I.klass, idx = rosterIndex(), all = S.D.students.map(s => s.no);
  const out = [], skip = {other: 0, notfound: 0, area: 0, empty: 0};
  const classCols = has('grade') || has('klass') || has('sid');
  if (!areaDefault && !has('area')) return {out, skip, noArea: true};
  sh.rows.slice(hdr + 1).forEach(r => {
    let area = areaDefault;
    if (has('area')){ const v = pick(r, 'area'); area = /진로/.test(v) ? '진로' : (/자율|자치/.test(v) ? '자율' : (v ? '' : areaDefault)); }
    if (!area){ skip.area++; return; }
    const title = pick(r, 'title'), body = pick(r, 'text');
    const text = title && body ? `${title}: ${body}` : (body || title);
    if (!text){ skip.empty++; return; }
    const date = normDate(pick(r, 'date'));
    const g = has('grade') ? parseInt(pick(r, 'grade')) : NaN, c = has('klass') ? parseInt(pick(r, 'klass')) : NaN;
    if ((!isNaN(g) && g !== G) || (!isNaN(c) && c !== C)){ skip.other++; return; }
    let names = splitCell(pick(r, 'name')).flatMap(t => idx[norm(t)] ? [t] : (/\s/.test(t) ? t.split(/\s+/) : [t]));
    const nums = splitCell(pick(r, 'no')), sids = splitCell(pick(r, 'sid'));
    const found = [];
    const push = (no, flag) => { if (no && !found.some(x => x.no === no)) found.push({no, flag}); };
    if (names.length){
      names.forEach((nm, i) => {
        let no = idx[norm(nm)];
        const sid = sids.length === names.length ? parseSid(sids[i]) : (sids.length === 1 && names.length === 1 ? parseSid(sids[0]) : null);
        if (sid && (sid.g !== G || sid.c !== C)){ skip.other++; return; }
        const num = nums.length === names.length ? parseInt(nums[i]) : NaN;
        if (!no){ skip.notfound++; return; }
        let flag = '';
        if (!isNaN(num) && num !== no) flag = '번호가 명단과 다름';
        else if (!classCols && !sid) flag = '이름으로만 찾음';
        push(no, flag);
      });
    } else if (sids.length){
      sids.forEach(v => { const s = parseSid(v); if (!s || s.g !== G || s.c !== C){ skip.other++; return; } push(all.includes(s.n) ? s.n : 0, ''); });
    } else if (I.whole && has('target')){
      const t = pick(r, 'target');
      const m = t.match(/(\d)\s*학년(?:\s*(\d+)\s*반)?/);
      const ok = !/신청|희망|\d+\s*명/.test(t) && (/전교생|전체\s*학생|전학년/.test(t) || (m && +m[1] === G && (!m[2] || +m[2] === C)));
      if (ok) all.forEach(no => push(no, '반 전체'));
      else skip.notfound++;
    } else skip.notfound++;
    found.forEach(f => out.push({no: f.no, area, title, text, date, flag: f.flag, on: true, source: `${I.file} · ${sh.name}`}));
  });
  const seen = new Set();
  return {out: out.filter(x => { const k = x.no + '|' + x.area + '|' + x.text; if (seen.has(k)) return false; seen.add(k); return true; }), skip};
}
function recRowsOf(){
  const I = S.imp, sh = I.sheets[I.cur], cols = I.cols;
  const pick = (r, k) => { const c = Object.keys(cols).find(c => cols[c] === k); return c == null ? '' : (r[c] || ''); };
  const has = k => Object.values(cols).includes(k);
  const idx = rosterIndex(), out = [], skip = {notfound: 0, empty: 0};
  const labelToKey = Object.fromEntries(TAGS.map(t => [t.l, t.k]));
  sh.rows.slice(I.hdr + 1).forEach(r => {
    const text = pick(r, 'text');
    if (!text){ skip.empty++; return; }
    const date = normDate(pick(r, 'date')) || S.D.today;
    const tagsIn = splitCell(pick(r, 'tag')).map(t => labelToKey[t] || (TAGMAP[t] ? t : '')).filter(Boolean);
    if (has('name') && pick(r, 'name')){
      const nos = [...new Set(splitCell(pick(r, 'name')).map(n => idx[norm(n)]).filter(Boolean))];
      if (!nos.length){ skip.notfound++; return; }
      out.push({date, text, nos, area: guessArea(text), tags: tagsIn.length ? tagsIn : guessTags(text), on: true});
    } else {
      const parts = classify(text);
      if (!parts.some(p => p.nos.length)){ skip.notfound++; return; }
      parts.filter(p => p.nos.length).forEach(p => out.push({date, text: p.text, nos: p.nos, area: p.area, tags: tagsIn.length ? tagsIn : p.tags, on: true}));
    }
  });
  return {out, skip};
}

async function impSave(){
  const I = S.imp, list = I.preview.out.filter(x => x.on);

    let saved = 0, skipped = 0;
    for (let i = 0; i < list.length; i += 250){
      const chunk = list.slice(i, i + 250);
      const r = I.mode === 'act'
        ? await call('apiHubImportActivities', S.pw, chunk.map(x => ({no: x.no, area: x.area, title: x.title, text: x.text, date: x.date, source: x.source})))
        : await call('apiHubSaveObs', S.pw, chunk.map(x => ({date: x.date, text: x.text, nos: x.nos, area: x.area, tags: x.tags})));
      saved += r.saved; skipped += r.skipped || 0;

    toast(`${saved}건 저장했습니다.` + (skipped ? ` 이미 있던 ${skipped}건은 건너뛰었습니다.` : ''));

}

async function xlsx(btn){

function csvOut(){

async function fileChosen(file, mode){

document.addEventListener('click', ev => {
  const t = ev.target.closest && ev.target.closest('[data-act],[data-view]');
  if (!t) return;
  if (t.dataset.view){ S.view = t.dataset.view; SS.s('hub_view', S.view); S.editId = ''; if (S.view === 'board') S.B = null; if (S.view === 'essay' || S.view === 'meet') S.A = null; if (S.view === 'roster') S.Gt = null; render(); window.scrollTo(0, 0); return; }
  const act = t.dataset.act, i = Number(t.dataset.i), no = Number(t.dataset.no);
  switch (act){
    case 'login': S.pw = $('pw').value; if (S.pw) load(); return;
    case 'logout': hubLogout(); return;
    case 'reload': toast('다시 불러오는 중…'); load(true); return;
    case 'goview': S.view = t.dataset.v; render(); return;
    case 'clearText': if (confirm('입력창을 비울까요?')){ $('recText').value = ''; store.set('draft', ''); $('savedMark').textContent = ''; } return;
    case 'classify': {
      const txt = $('recText').value; S.recDate = $('recDate').value;
      if (!txt.trim()) return toast('먼저 있었던 일을 적어 주세요.', true);
      S.draft = classify(txt); render(); return;
    }
    case 'putname': { const ta = $('recText'); ta.value += (ta.value && !/\s$/.test(ta.value) ? ' ' : '') + norm(nameOf(no)) + ' '; store.set('draft', ta.value); ta.focus(); return; }
    case 'dropwho': S.draft[i].nos = S.draft[i].nos.filter(n => n !== no); render(); return;
    case 'darea': S.draft[i].area = t.dataset.v; render(); return;
    case 'dtag': { const tg = S.draft[i].tags; const k = t.dataset.v; S.draft[i].tags = tg.includes(k) ? tg.filter(x => x !== k) : tg.concat(k); render(); return; }
    case 'dropentry': S.draft.splice(i, 1); render(); return;
    case 'cleardraft': S.draft = []; render(); return;
    case 'savedraft': saveDraft(); return;
    case 'calmon': { const [y, m] = S.calMon.split('-').map(Number); const d = new Date(y, m - 1 + Number(t.dataset.v), 1);
      S.calMon = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`; render(); return; }

    case 'parent': parentSheet(S.sel); return;
    case 'printlog': { const s = stu(S.sel); printSheet(`<div class="ps"><h1>${esc(s.name)} 관찰 기록</h1><div class="sub">${s.no}번 · ${md(S.D.today)} 기준 · 교사용</div>

      if (ask && !confirm(ask)) return;

document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.id === 'fileIn') return fileChosen(t.files[0], t.dataset.mode);
  if (t.dataset.act === 'stale'){ S.staleDays = Number(t.value); store.set('stale', t.value); render(); return; }

  if (t.dataset.act === 'toggleitem'){ const key = fk(S.sel, S.docArea), ex = S.excl[key] || (S.excl[key] = {}); ex[t.dataset.id] = !ex[t.dataset.id];
    t.closest('li').classList.toggle('off', !t.checked); S.docPrompt = ''; return; }
  if (t.dataset.act === 'relteam'){ S.rel.team = t.checked; render(); return; }
  if (t.dataset.imp){
    const I = S.imp, k = t.dataset.imp;
    if (k === 'hdr'){ I.hdr = Math.max(0, Number(t.value) - 1); I.cols = guessCols(I.sheets[I.cur].rows[I.hdr] || [], I.mode); }
    else if (k === 'col'){ const c = t.dataset.c; if (t.value) I.cols[c] = t.value; else delete I.cols[c]; }
    else if (k === 'whole') I.whole = t.checked;
    else I[k] = t.value;
    I.preview = null; render();
  }
});
let qT;
document.addEventListener('input', ev => {

  if (t.dataset.act === 'dtext') S.draft[Number(t.dataset.i)].text = t.value;
  if (t.dataset.act === 'finaltext'){ S.finals[fk(S.sel, S.docArea)] = t.value; updateRuler(); }
  if (t.id === 'railQ'){ S.railQ = t.value; clearTimeout(qT); qT = setTimeout(() => { render(); const r = $('railQ'); r.focus(); r.setSelectionRange(r.value.length, r.value.length); }, 250); }
  if (t.id === 'searchQ'){ S.q = t.value; clearTimeout(qT); qT = setTimeout(() => { render(); const r = $('searchQ'); r.focus(); r.setSelectionRange(r.value.length, r.value.length); }, 350); }

document.addEventListener('keydown', ev => {

['dragover', 'dragleave', 'drop'].forEach(type => document.addEventListener(type, ev => {

}));

if (S.pw) load(); else vLogin();

const driveView = f => 'https:' + '/' + '/drive.google.com/file/d/' + encodeURIComponent(f.id) + '/view';
function readPick(id){
  const el = $(id), f = el && el.files && el.files[0];
  if (!f) return Promise.resolve(null);
  if (f.size > 15 * 1024 * 1024) return Promise.reject(new Error('첨부 파일은 15MB 이하로 올려 주세요.'));
  toast('파일을 올리는 중…');
  return new Promise((ok, no) => {
    const r = new FileReader();
    r.onload = () => ok({name: f.name, mime: f.type || 'application/octet-stream', data: String(r.result).split(',')[1]});
    r.onerror = () => no(new Error('파일을 읽지 못했습니다.'));
    r.readAsDataURL(f);
  });
}
/* 여러 파일 고르기: 한 파일씩 읽어 목록으로 돌려줍니다 (파일 하나는 15MB 이하, 공지 하나에 12개까지) */
function readPicks(id){
  const el = $(id), fs = el && el.files ? Array.from(el.files) : [];
  if (fs.length > 12) return Promise.reject(new Error('첨부는 한 번에 12개까지 올릴 수 있어요.'));
  const big = fs.find(f => f.size > 15 * 1024 * 1024);
  if (big) return Promise.reject(new Error(big.name + ' 파일이 15MB보다 커요. 15MB 이하로 올려 주세요.'));
  return Promise.all(fs.map(f => new Promise((ok, no) => {
    const r = new FileReader();
    r.onload = () => ok({name: f.name, mime: f.type || 'application/octet-stream', data: String(r.result).split(',')[1]});
    r.onerror = () => no(new Error('파일을 읽지 못했습니다.'));
    r.readAsDataURL(f);
  })));
}

document.addEventListener('click', ev => {

  if (!t) return;
  const a = t.dataset.bact, id = t.dataset.id;
  if (a !== 'bdparse') btCollect();
  if (typeof nfCollect === 'function') nfCollect();
  const apply = p => p.then(b => { S.B = b; render(); }).catch(fail);
  if (a === 'bsub'){ S.bsub = t.dataset.v; try { sessionStorage.setItem('hub_bsub', S.bsub); } catch (e) {} render(); window.scrollTo(0, 0); return; }
  switch (a){
    case 'copyurl': copyText(S.B.url); return;
    case 'copyphone': copyText(S.B.phoneUrl || ''); return;
    case 'wx': {
      const v = t.dataset.v, nm = v === 'place' ? ($('wxName').value || '').trim() : '';
      if (v === 'place' && !nm) return toast('지역 이름을 적어 주세요.', true);
      t.disabled = true;
      call('apiBoardWeather', S.pw, v, nm).then(b => { S.B = b; toast(v === 'place' ? '날씨 지역을 ' + b.weatherCfg.place + '(으)로 바꿨어요.' : (v === 'off' ? '날씨를 껐어요.' : '날씨를 켰어요.')); render(); })
        .catch(e => { t.disabled = false; fail(e); });
      return;
    }
    case 'ntgt': nfCollect(); S.nf.target = t.dataset.v; render(); return;
    case 'npick': { nfCollect(); const no = Number(t.dataset.no), P = S.nf.picks; S.nf.picks = P.includes(no) ? P.filter(x => x !== no) : P.concat(no); render(); return; }
    case 'nadd2': {
      nfCollect();
      const F = S.nf;
      if (!F.title.trim()) return toast('제목을 적어 주세요.', true);
      if (F.target !== '전체' && !F.picks.length) return toast('대상 학생을 골라 주세요.', true);
      t.disabled = true;
      readPick('nfF').then(file => call('apiNote', S.pw, 'add', {kind: F.kind, title: F.title, text: F.text, due: F.due,
          target: F.target === '전체' ? '전체' : F.picks, track: F.track, cal: F.target === '전체' && F.cal, file}))
        .then(b => { S.B = b; S.nf = {kind: F.kind, target: '전체', picks: [], track: true, cal: true};
          toast(b.noteWarn ? '올렸어요. ' + b.noteWarn : '알림장에 올렸어요.', !!b.noteWarn); render(); })
        .catch(e => { t.disabled = false; fail(e); });
      return;
    }
    case 'nopen': S.nOpen = S.nOpen === id ? '' : id; render(); return;
    case 'nsub': apply(call('apiNote', S.pw, 'sub', {id, no: Number(t.dataset.no)})); return;
    case 'nsuball': apply(call('apiNote', S.pw, 'suball', {id})); return;
    case 'nsubnone': if (confirm('이 알림의 제출 체크를 모두 지울까요?')) apply(call('apiNote', S.pw, 'subnone', {id})); return;
    case 'nclose': apply(call('apiNote', S.pw, 'close', {id})); return;
    case 'nreopen': apply(call('apiNote', S.pw, 'open', {id})); return;
    case 'ndel2': if (confirm('이 알림장과 제출 기록을 지울까요? 캘린더 일정도 함께 지워집니다.')) apply(call('apiNote', S.pw, 'del', {id})); return;
    case 'ned': { nfCollect(); const it = (S.B.notes.items || []).find(x => x.id === id); if (it){ S.nEd = {id, title: it.title, text: it.text, due: it.due}; render(); } return; }
    case 'nedx': S.nEd = null; render(); return;
    case 'neds': {
      nfCollect(); const e2 = S.nEd; if (!e2) return;
      if (!e2.title.trim()) return toast('제목을 적어 주세요.', true);
      call('apiNote', S.pw, 'edit', {id: e2.id, title: e2.title, text: e2.text, due: e2.due})
        .then(b => { S.B = b; S.nEd = null; toast(b.noteWarn ? '고쳤어요. ' + b.noteWarn : '고쳤어요.', !!b.noteWarn); render(); }).catch(fail);
      return;
    }
    case 'ncal': {
      t.disabled = true; toast('캘린더를 준비하는 중…');
      call('apiNoteCalendar', S.pw, t.dataset.v).then(b => { S.B = b; toast(t.dataset.v === 'off' ? '캘린더 연동을 껐어요.' : '학급 캘린더를 연결했어요.'); render(); })
        .catch(e => { t.disabled = false; fail(e); });
      return;
    }
    case 'ncopy': { const L = ((S.B.notes || {}).cal || {}).links || {}; copyText(L[t.dataset.v] || ''); return; }
    case 'flwho': S.flWho = t.dataset.v; S.flText = ($('flText2') || {}).value || S.flText; render(); return;
    case 'fltext': S.flText = t.dataset.v; S.flWho = ($('flWho2') || {}).value || S.flWho; render(); return;
    case 'flsend': {
      const who = $('flWho2').value.trim(), text = $('flText2').value.trim();
      if (!who && !text) return toast('부를 사람이나 할 말을 적어 주세요.', true);
      S.flWho = who; S.flText = text; S.flMin = Number($('flMin').value); S.flUrg = $('flUrg').checked;
      t.disabled = true;
      call('apiBoardFlashSend', S.pw, {who, text, min: S.flMin, level: S.flUrg ? '긴급' : '알림'})
        .then(b => { S.B = b; S.flWho = ''; S.flText = ''; toast('교실 화면에 띄웠습니다.'); render(); })
        .catch(e => { t.disabled = false; fail(e); });
      return;
    }
    case 'flstop': call('apiBoardFlashStop', S.pw).then(b => { S.B = b; toast('내렸습니다.'); render(); }).catch(fail); return;
    case 'regenview': if (confirm('학생용 보기 주소를 새로 만들까요? 예전 주소와 이미 올린 학생 앱은 더 이상 클래스보드를 열지 못합니다.'))
      call('apiBoardRegenViewKey', S.pw).then(b => { S.B = b; toast('새 주소를 만들었습니다. 학생 앱 zip도 다시 받아 올려 주세요.'); render(); }).catch(fail); return;
    case 'appurl': boardSave({appUrl: ($('appUrlIn') || {}).value || ''}, '학생 앱 주소를 저장했습니다. 교실 TV는 새 주소로 다시 열어 주세요.', true); return;
    case 'pj': boardSave({phoneJoin: t.checked}, t.checked ? '휴대폰에서도 참여할 수 있게 했습니다.' : '휴대폰에서는 보기만 됩니다.', true); return;
    case 'appzip': {
      t.disabled = true; toast('앱 파일을 만드는 중…');
      call('apiBoardAppZip', S.pw).then(r => {
        t.disabled = false;
        const bin = atob(r.data), u8 = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);

    case 'nlv': S.nLevel = Number(t.dataset.v); render(); return;

      call('apiBoardLinks', S.pw, 'add', {title, url}).then(b => { S.B = b; toast('버튼을 만들었습니다. 교실 화면에는 1분 안에 나옵니다.'); render(); })

        .catch(e => { t.disabled = false; fail(e); });

      if (n){ S.nEdit = {id, text: n.text, start: n.start || '', end: n.end || ''}; render(); }

    }
    case 'ncancel': S.nEdit = null; render(); return;
    case 'nsave': {
      const e = S.nEdit;
      if (!e) return;

        .then(b => { S.B = b; S.nEdit = null; toast('알림을 고쳤습니다. 교실 화면에는 1분 안에 반영됩니다.'); render(); })

    case 'sunfile': if (confirm('첨부를 뺄까요? 드라이브의 파일은 그대로 남습니다.')) apply(call('apiBoardSurvey', S.pw, 'unfile', {id})); return;
    case 'nattach': case 'sattach': { const f = $('bAttachIn'); f.value = ''; f.dataset.target = (a === 'nattach' ? 'n:' : 's:') + id; f.click(); return; }
    case 'sgread': apply(call('apiBoardSuggestOp', S.pw, 'read', id)); return;
    case 'sgdel': if (confirm('이 건의를 지울까요?')) apply(call('apiBoardSuggestOp', S.pw, 'del', id)); return;
    case 'bdparse': {
      const idx = {};
      S.B.students.forEach(s => idx[norm(s.name)] = s.no);
      let filled = 0; const miss = [];
      $('bdPaste').value.split('\n').map(x => x.trim()).filter(Boolean).forEach(line => {
        let m = line.match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/), mo, dd;
        if (m){ mo = +m[2]; dd = +m[3]; line = line.replace(m[0], ' '); }
        else { m = line.match(/(\d{1,2})\s*[./\-월]\s*(\d{1,2})\s*일?\s*$/); if (m){ mo = +m[1]; dd = +m[2]; line = line.slice(0, m.index); } }
        if (!mo){ miss.push(line); return; }
        const nm = Object.keys(idx).find(k => k && norm(line).includes(k));
        const num = line.match(/^\s*(\d{1,2})\b/);
        const no = nm ? idx[nm] : (num ? Number(num[1]) : 0);
        const im = document.querySelector(`[data-bdm="${no}"]`), id2 = document.querySelector(`[data-bdd2="${no}"]`);

      });
      btCollect();
      toast(`${filled}명을 표에 채웠습니다.` + (miss.length ? ` 못 찾은 줄 ${miss.length}개` : '') + ' 확인 후 [생일 저장]을 누르세요.', !!miss.length);
      return;
    }
    case 'bdsave': {
      const map = {}, bad = [];
      document.querySelectorAll('[data-bdm]').forEach(el => {
        const no = el.dataset.bdm, d = document.querySelector(`[data-bdd2="${no}"]`).value.trim(), mo = el.value.trim();
        if (!mo && !d){ map[no] = ''; return; }
        if (!(+mo >= 1 && +mo <= 12 && +d >= 1 && +d <= 31)){ bad.push(no); return; }
        map[no] = `${+mo}-${+d}`;
      });
      if (bad.length) return toast(`${bad.join(', ')}번의 날짜를 확인해 주세요.`, true);
      call('apiBoardBirthdays', S.pw, map).then(b => { S.B = b; S.bdDraft = null; toast('생일을 저장했습니다.'); render(); }).catch(fail);
      return;
    }
    case 'ndel': if (confirm('이 알림을 지울까요?')){ if (S.nEdit && S.nEdit.id === id) S.nEdit = null; apply(call('apiBoardNotice', S.pw, 'del', {id})); } return;
    case 'skind': S.sKind = t.dataset.v; render(); return;
    case 'sadd': {
      const kind = S.sKind || '선택';
      const q = $('bsQ').value.trim();
      const options = kind === '선택' ? $('bsO').value.split('\n').map(x => x.replace(/\t+/g, ' · ').trim()).filter(Boolean) : [];
      if (options.length > 80) return toast('보기는 80개까지 넣을 수 있어요.', true);
      if (!q) return toast('질문을 적어 주세요.', true);
      if (kind === '선택' && options.length < 2) return toast('보기를 두 줄 이상 적어 주세요.', true);
      const opt = {q, kind, options, desc: $('bsD').value.trim(), multi: !!($('bsMulti') && $('bsMulti').checked),
        anon: !!($('bsAnon') && $('bsAnon').checked), etc: !!($('bsEtc') && $('bsEtc').checked), pub: $('bsPub').checked, showMissing: $('bsMiss').checked};
      t.disabled = true;
      readPick('bsFile').then(file => call('apiBoardSurvey', S.pw, 'add', Object.assign(opt, {file})))
        .then(b => { S.B = b; S.sDraft = null; toast(kind === '체크' ? '체크를 시작했습니다.' : '조사를 시작했습니다.'); render(); })
        .catch(e => { t.disabled = false; fail(e); });
      return;
    }
    case 'sclose': apply(call('apiBoardSurvey', S.pw, 'close', {id})); return;
    case 'sopen': apply(call('apiBoardSurvey', S.pw, 'open', {id})); return;
    case 'spub': apply(call('apiBoardSurvey', S.pw, 'pub', {id})); return;
    case 'smiss': apply(call('apiBoardSurvey', S.pw, 'missing', {id})); return;
    case 'sdel': if (confirm('이 조사와 응답을 모두 지울까요?')) apply(call('apiBoardSurvey', S.pw, 'del', {id})); return;
    case 'scsv': {
      const s = S.B.surveys.find(x => x.id === id);
      const rows = [['번호', '이름', '선택', '응답 시각']].concat((s.responses || []).sort((a, b) => a.no - b.no).map(r => [r.no, r.name, r.choices.join(' / '), r.at]))
        .concat(s.missing.map(m => [m.no, m.name, '(미응답)', '']));
      download(`조사_${s.q.slice(0, 20)}_${S.D.today}.csv`, '\uFEFF' + rows.map(r => r.map(c => '"' + String(c).replace(/"/g, '""') + '"').join(',')).join('\r\n'), 'text/csv;charset=utf-8');
      return;
    }
    case 'scsv2': {
      /* 보기(과목)마다 고른 학생 번호를 한 줄로 모읍니다 */
      const s = S.B.surveys.find(x => x.id === id);
      const sp = o => { const k = o.indexOf(' · '); return k > 0 ? [o.slice(0, k), o.slice(k + 3)] : ['', o]; };
      const ei = s.etc ? s.options.length - 1 : -1;
      const rows = [['대학(앞부분)', '보기(과목명)', '인원', '번호', '이름', '직접 쓴 내용']].concat(s.options.map((o, i) => {
        const L = (s.byOption && s.byOption[i]) || [];
        return sp(o).concat([L.length, L.map(x => x.split('.')[0]).join(', '), L.map(x => x.slice(x.indexOf('.') + 1).trim()).join(', '),
          i === ei ? (s.etcList || []).map(e => (e.no ? e.no + '번 ' : '') + e.text).join(' / ') : '']);
      }));
      download(`조사_보기별_${s.q.slice(0, 20)}_${S.D.today}.csv`, '\uFEFF' + rows.map(r => r.map(c => '"' + String(c).replace(/"/g, '""') + '"').join(',')).join('\r\n'), 'text/csv;charset=utf-8');
      return;
    }
    case 'saveset': btCollect(); boardSave({counselMode: S.bt.counselMode, counselOn: S.bt.counselOn, suggestOn: S.bt.suggestOn, ddays: S.bt.ddays}, '화면 설정을 저장했습니다.', true); return;
    case 'nkey': btCollect(); boardSave({neisKey: S.bt.neisKey}, '인증키를 저장했습니다.', true); return;
    case 'pvreload': { const f = $('pvFrame'); if (f) f.src = f.src; return; }
    case 'qsample': { const ta = $('bqText'), have = ta.value.split('\n').map(x => x.trim()); const add = QUOTE_SAMPLE.filter(x => !have.includes(x));
      ta.value = [ta.value.trim()].concat(add).filter(Boolean).join('\n'); btCollect(); render(); return; }
    case 'qsave': btCollect(); boardSave({quote: {on: S.bt.quote.on, mode: S.bt.quote.mode, list: parseQuotes(S.bt.quote.text)}}, '맨 윗줄 문구를 저장했습니다.', true); return;
    case 'nfill': {
      btCollect(); t.disabled = true;
      call('apiBoardNeisWeek', S.pw).then(r => {
        t.disabled = false;
        if (!r.cells){
          S.fillMsg = `<span style="color:var(--neg)">나이스에 ${esc(r.from)} ~ ${esc(r.to)} ${esc(r.grade)}학년 ${esc(r.klass)}반 시간표가 없습니다.</span>
            ${r.err ? '<br>' + esc(r.err) : (r.msg ? '<br>나이스 응답: ' + esc(r.msg) + ' (' + esc(r.code) + ')' : '')}
            <br><span class="muted">학교가 나이스에 시간표를 올리지 않았거나, [명단 · 설정]의 학년·반이 실제와 다를 수 있습니다. 안 되면 직접 입력을 쓰세요.</span>`;
          render(); return;
        }
        const B = S.bt, before = B.periods.length;
        while (B.periods.length < r.periods) B.periods.push({n: String(B.periods.length + 1), s: '', e: ''});
        for (let d = 1; d <= 5; d++) B.timetable[d] = (r.grid[d] || []).slice();
        S.fillMsg = `${esc(r.from)} ~ ${esc(r.to)} 시간표 <b>${r.cells}칸</b>을 채웠습니다.` +
          (B.periods.length > before ? ` <span style="color:var(--neg)">${B.periods.length > before + 1 ? (before + 1) + '~' : ''}${B.periods.length}교시가 새로 생겼으니 시각을 넣어 주세요.</span>` : '') +
          ' 확인한 뒤 아래 [시간표 저장]을 눌러 주세요.';
        render();
      }).catch(e => { t.disabled = false; fail(e); });
      return;
    }
    case 'sch':
      $('bSchList').innerHTML = '<p class="small muted" style="margin-top:6px">찾는 중…</p>';
      call('apiNeisSchool', S.pw, $('bSch').value).then(r => {
        $('bSchList').innerHTML = r.list.length ? `<table class="t small" style="margin-top:6px">${r.list.map((x, i) => `<tr><td><b>${esc(x.name)}</b><div class="muted">${esc(x.office)} · ${esc(x.addr)}</div></td>
          <td style="text-align:right"><button class="btn sm" data-bact="schpick" data-i="${i}">선택</button></td></tr>`).join('')}</table>`
          : `<p class="small" style="color:var(--neg);margin-top:6px">${esc(r.err || '찾는 학교가 없습니다. 정식 이름으로 다시 찾아 보세요.')}</p>`;
        S.schList = r.list;
      }).catch(fail);
      return;
    case 'schpick': { const x = S.schList[Number(t.dataset.i)]; btCollect(); boardSave({school: {atpt: x.atpt, code: x.code, name: x.name}}, x.name + '(으)로 정했습니다.', true); return; }
    case 'ntest':
      $('bTest').innerHTML = '<span class="muted">불러오는 중…</span>';
      call('apiNeisTest', S.pw).then(r => {
        const ml = (r.meal.meals || []).map(m => `<b>${esc(m.kind)}</b> ${esc(m.dishes.join(', '))}`).join('<br>') || `<span class="muted">${esc(r.meal.err || '오늘 급식 정보 없음')}</span>`;
        const mn = (r.mealNext.meals || []).map(m => `<b>${esc(m.kind)}</b> ${esc(m.dishes.join(', '))}`).join('<br>') || '<span class="muted">없음</span>';
        const T2 = r.timetable, subs = T2.subjects || [];
        const ask = `${esc(String(r.ttDate).replace(/(\d{4})(\d\d)(\d\d)/, '$1-$2-$3'))} · ${esc(r.grade)}학년 ${esc(r.klass)}반`;
        let tt;
        if (T2.err) tt = `<span style="color:var(--neg)">${esc(T2.err)}</span>`;
        else if (subs.some(Boolean)) tt = subs.map((s, i) => `${i + 1}.${esc(s || '-')}`).join(' ');
        else tt = `<span style="color:var(--neg)">나이스가 시간표를 주지 않았습니다.</span> <span class="muted">(${esc(T2.msg || T2.code || '응답 없음')})</span><br>
          <span class="muted">학교가 나이스에 시간표를 올리지 않았거나 학년·반이 다를 수 있어요. 안 되면 직접 입력을 쓰세요.</span>`;
        const SC = r.schedule || {events: []};
        const sch = SC.err ? `<span style="color:var(--neg)">${esc(SC.err)}</span>`
          : (SC.events.length ? SC.events.slice(0, 6).map(e => `${esc(e.start.slice(5))}${e.end !== e.start ? '~' + esc(e.end.slice(5)) : ''} ${esc(e.title)}`).join(' · ')
            : '<span class="muted">앞으로 30일 안의 학사일정이 없습니다.</span>');
        $('bTest').innerHTML = `<div style="line-height:1.7"><span class="lbl">나이스 학사일정 (30일)</span><br>${sch}<br><span class="lbl">오늘 급식</span><br>${ml}<br><span class="lbl">다음 급식 (${esc(r.mealNext.date)})</span><br>${mn}
          <br><span class="lbl">나이스 시간표 · ${ask} · ${r.hasKey ? '인증키 있음' : '인증키 없음'}</span><br>${tt}${T2.partial ? '<br><span style="color:var(--neg)">인증키가 없어 5교시까지만 받았습니다.</span>' : ''}</div>`;
      }).catch(fail);
      return;
    case 'src': btCollect(); S.bt.source = t.dataset.v; boardSave({source: t.dataset.v}, t.dataset.v === 'NEIS' ? '이제 교실 TV가 나이스 시간표를 씁니다.' : '이제 교실 TV가 직접 적은 시간표를 씁니다.', true); return;
    case 'padd': {
      btCollect();
      const last = S.bt.periods[S.bt.periods.length - 1];
      S.bt.periods.push({n: String(S.bt.periods.length + 1), s: last ? last.e : '', e: ''});
      render(); return;
    }
    case 'pdel': btCollect(); S.bt.periods.splice(Number(t.dataset.i), 1);
      Object.keys(S.bt.timetable).forEach(d => S.bt.timetable[d].splice(Number(t.dataset.i), 1));
      Object.keys(S.bt.teachers).forEach(d => S.bt.teachers[d].splice(Number(t.dataset.i), 1)); render(); return;
    case 'spadd': btCollect(); S.bt.specials.push({name: '', s: '', e: ''}); render(); return;
    case 'spdel': btCollect(); S.bt.specials.splice(Number(t.dataset.i), 1); render(); return;
    case 'tchfill': {
      const map = {};
      $('bTch').value.split('\n').map(x => x.trim()).filter(Boolean).forEach(l => {
        const m = l.match(/^(.+?)\s+(\S{1,3})$/); if (m) map[m[1].replace(/\s/g, '')] = m[2];
      });
      let n = 0;
      document.querySelectorAll('[data-btc]').forEach(el => {
        if (el.value.trim()) return;
        const sj = document.querySelector(`[data-btt="${el.dataset.btc}"]`).value.replace(/\s/g, '');
        if (sj && map[sj]){ el.value = map[sj]; n++; }
      });
      btCollect();
      toast(n ? `${n}칸을 채웠습니다. 확인하고 [시간표 저장]을 누르세요.` : '채울 칸이 없습니다. 과목 칸이 비어 있으면 먼저 [나이스에서 이번 주 시간표를 표로 가져오기]를 눌러 주세요.', !n);
      return;
    }
    case 'evsave': boardSave({eventNeis: S.bt.eventNeis, eventDays: S.bt.eventDays}, '일정 설정을 저장했습니다.', true); return;
    case 'evadd': {
      const d = S.evDraft || {};
      if (!(d.title || '').trim()) return toast('일정 이름을 적어 주세요.', true);
      if (!d.start) return toast('시작 날짜를 골라 주세요.', true);
      call('apiBoardEvent', S.pw, 'add', d).then(b => { S.B = b; S.evDraft = null; toast('일정을 넣었습니다.'); render(); }).catch(fail);
      return;
    }
    case 'evdel': if (confirm('이 일정을 지울까요?')) apply(call('apiBoardEvent', S.pw, 'del', {id})); return;
    case 'layreset': if (confirm('TV 화면의 크기·여백·칸 너비를 처음대로 되돌릴까요?')) boardSave({layout: {}}, '화면 배치를 처음대로 되돌렸습니다.', true); return;
    case 'savett': btCollect(); S.fillMsg = ''; boardSave({source: S.bt.source, periods: S.bt.periods, lunch: S.bt.lunch, timetable: S.bt.timetable, teachers: S.bt.teachers, specials: S.bt.specials.filter(x => x.name && x.s && x.e)}, '시간표를 저장했습니다.'); return;
  }
});
</script>
</body>
</html>
