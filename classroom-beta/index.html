async function fxFile(f){
  const { db, F } = S.fb; let b64 = '';
  for (let i = 0; i < f.parts; i++){
    const d = await F.getDoc(F.doc(db, 'boards', S.key, 'formfiles', f.fid + '_' + i));
    if (!d.exists()) throw new Error('올려 둔 양식 파일을 찾지 못했어요. (TV 주소를 바꿨거나 백업을 되살렸다면) 양식으로 조사를 다시 만들어 주세요.');
    b64 += d.data().d;
  }
  return bufOf(b64);
}
async function fxEditSave(){
  const { db, F } = S.fb, B = S.B, X = S.fx; if (!X || !X.edit) return;
  const fid = X.edit, f = (B.forms || []).find(x => x.fid === fid); if (!f) return;
  const L = fxGroup(fid), qs = X.cols.filter(c => c.role === 'q' || c.role === 'mark');
  if (!qs.length) return toast('학생이 답할 칸(질문)을 하나 이상 남겨 주세요.', true);
  if (qs.some(c => !String(c.q || c.title || '').trim())) return toast('질문 문구가 빈 칸이 있어요.', true);
  const title = String(X.title || '').trim().slice(0, 60) || '학교 양식 조사', open = L.length ? !!L[0].open : true, now = new Date().toISOString();
  const ops = []; let lost = 0;
  const ids = qs.map(c => (c.sid && L.some(s => s.id === c.sid)) ? c.sid : 's' + rid(8));
  const sv = qs.map((c, k) => {
    const opts = c.role === 'mark' ? c.options.slice() : fxOpts(c.opt), choice = c.role === 'mark' || opts.length >= 2;
    const old = L.find(s => s.id === ids[k]), kind = choice ? '선택' : '글', options = choice ? opts : [];

    if (old){
      const A = S.ANS[old.id] || {};

        if (old.kind !== kind){ lost++; ops.push(['del', old.id, no]); return; }
        if (kind === '글') return;

        if (!ch.length){ lost++; ops.push(['del', old.id, no]); }

        desc: k === 0 ? String(X.desc || '').trim().slice(0, 200) : '', grp: fid, gi: k, gn: qs.length, gname: title, sub: k > 0, nx: ids[k + 1] || '', req: choice || c.req !== false });
  });

  try {
    await Promise.all(ops.map(o => o[0] === 'del' ? F.deleteDoc(F.doc(db, 'boards', S.key, 'answers', o[1] + '_' + o[2]))
      : F.setDoc(F.doc(db, 'boards', S.key, 'answers', o[1] + '_' + o[2]), { sid: o[1], no: +o[2], ch: o[3], etc: '', at: F.serverTimestamp() })));
    gone.forEach(s => delAnswers(s.id));
  } catch (e){ fail(e); }

}

function svSummary(s){
  const A = S.ANS[s.id] || {}, stu = S.B.students || [];
  const counts = s.options.map(() => 0), by = s.options.map(() => []), etcs = [];
  const nameOf = no => { const x = stu.find(t => t.no === +no); return x ? x.name : ''; };
  Object.keys(A).forEach(no => {
    (A[no].ch || []).forEach(i => { if (counts[i] != null){ counts[i]++; by[i].push(no + '. ' + nameOf(no)); } });
    if (A[no].etc) etcs.push({ no: +no, name: nameOf(no), text: A[no].etc });
  });
  const done = Object.keys(A).map(Number);
  return { counts, by, etcs: etcs.sort((a, b) => a.no - b.no), done, missing: stu.filter(t => done.indexOf(t.no) < 0) };
}

async function bkRestore(j){

  if (!j || j.app !== '교실화면 백업' || !j.board || !j.sub) throw new Error('클래스 뷰 백업 파일이 아니에요.');
  busy('되살리기 전에 지금 자료를 파일로 받아 두는 중…');
  bkDownload(await bkBuild(), `classroom-backup_before-restore_${S.B.grade}-${S.B.klass}_${kstToday()}.json`);
  busy(j.kind === 'migrate' ? '학급 다이어리 기록을 옮기는 중…' : '게시판을 되살리는 중…');
  /* 학급 다이어리에서 옮겨 온 파일이면: 지금 클래스 뷰 설정(TV 주소 · PIN · 이름 등)에 옮겨 온 내용을 덮어씀 */
  const mig = j.kind === 'migrate';
  let board = bkIn(j.board);
  delete board.updatedAt;
  if (mig){ const cur = Object.assign({}, S.B); delete cur.updatedAt; board = Object.assign(cur, board); board.forms = []; board.flash = null; }
  board.owner = S.user.uid; board.viewKey = S.B.viewKey || '';
  if (!board.pinKey && S.B.pinKey) board.pinKey = S.B.pinKey;
  await F.setDoc(F.doc(db, 'boards', S.key), Object.assign(board, { updatedAt: F.serverTimestamp(), lastBackup: S.B.lastBackup || '' }));
  for (const c of (mig ? BK_SUBS.filter(x => j.sub[x]) : BK_SUBS)){
    busy((mig ? '옮기는 중… (' : '되살리는 중… (') + c + ')');
    const cur = await F.getDocs(F.collection(db, 'boards', S.key, c));
    await Promise.all(cur.docs.map(d => F.deleteDoc(d.ref)));
    const L = j.sub[c] || [];
    for (let i = 0; i < L.length; i += 50) await Promise.all(L.slice(i, i + 50).map(x => F.setDoc(F.doc(db, 'boards', S.key, c, x.id), bkIn(x.data))));
  }
  busy('');
}

let PVH = null, pvKey = '';
function placePv(){
  const slot = $('pvSlot');
  if (!slot || !S.key){ if (PVH) PVH.style.display = 'none'; return; }
  if (!PVH){ PVH = document.createElement('div'); PVH.id = 'pvHost'; PVH.innerHTML = '<iframe title="TV 화면 미리보기" loading="lazy"></iframe>'; document.body.appendChild(PVH); }
  const fr = PVH.firstChild;
  if (pvKey !== S.key){ pvKey = S.key; fr.src = new URL('tv.html?k=' + S.key + '&pv=1', location.href).href; }
  const r = slot.getBoundingClientRect();
  Object.assign(PVH.style, { display: 'block', left: (r.left + scrollX) + 'px', top: (r.top + scrollY) + 'px', width: r.width + 'px', height: r.height + 'px' });
  fr.style.transform = 'scale(' + (r.width / 1600) + ')';
}

const parseQuotes = text => String(text || '').split('\n').map(l => l.trim()).filter(Boolean).map(l => {
  const m = l.match(/^(.*\S)\s+(?:—|–|--|-|\|)\s+(\S[^—–|]{0,29})$/);
  return m ? { t: m[1].trim(), by: m[2].trim() } : { t: l, by: '' };
});
function collectPeriods(){
  const B = S.B, P = (B.periods || DEFAULT_PERIODS).map(p => Object.assign({}, p)), SP = (B.specials || []).map(x => Object.assign({}, x));
  document.querySelectorAll('[data-pn]').forEach(el => { P[+el.dataset.pn].n = el.value.trim(); });
  document.querySelectorAll('[data-ps]').forEach(el => { P[+el.dataset.ps].s = el.value; });

function csvOf(s){
  const R = svSummary(s), A = S.ANS[s.id] || {}, stu = S.B.students || [];
  const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  const ei = s.etc ? s.options.length - 1 : -1;
  const lines = [[q('번호'), q('이름'), q('응답'), q('기타 내용')].join(',')];
  stu.forEach(t => {
    const a = A[t.no];
    lines.push([t.no, q(s.anon ? '' : t.name), q(a ? (s.kind === '체크' ? '체크' : a.ch.map(i => i === ei ? '기타' : s.options[i]).join(' / ')) : '안 함'), q(a ? a.etc : '')].join(','));
  });
  lines.push(''); lines.push([q('보기'), q('명')].join(','));
  s.options.forEach((o, i) => lines.push([q(o), R.counts[i]].join(',')));
  const blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = (s.q || '조사').replace(/[\\/:*?"<>|]/g, ' ').slice(0, 40) + '.csv';
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

    case 'evadd': {
      const title = $('evTitle').value.trim().slice(0, 40), st = $('evStart').value, en = $('evEnd').value || st;
      if (!title || !st) return toast('일정 이름과 날짜를 넣어 주세요.', true);
      if (en < st) return toast('끝 날짜가 시작보다 앞이에요.', true);
      if (await save({ events: (B.events || []).concat([{ id: rid(8), title, start: st, end: en }]) }, '일정을 더했어요.')){ ['evTitle', 'evStart', 'evEnd'].forEach(k => $(k).value = ''); }
      return;
    }
    case 'sevback': try { await F.updateDoc(F.doc(db, 'boards', S.key, 'sevents', id), { gone: F.deleteField() }); toast('되살렸어요. TV에 다시 나와요.'); } catch (e) { fail(e); } return;
    case 'sevdel': if (!confirm('이 일정을 지울까요?')) return;
      try { await F.deleteDoc(F.doc(db, 'boards', S.key, 'sevents', id)); toast('지웠어요.'); } catch (e) { fail(e); } return;
    case 'evdel': return save({ events: (B.events || []).filter(e => e.id !== id) }, '지웠어요.');
    case 'rekey': {
      if (!confirm('새 TV 주소를 만들까요? 예전 주소로 열어 둔 TV는 연결 숫자 화면으로 바뀌니, 숫자를 넣어 다시 연결해 주세요.')) return;
      try {
        const old = S.key, data = Object.assign({}, B); delete data.updatedAt;
        const ff = await F.getDocs(F.collection(db, 'boards', old, 'formfiles')).catch(() => null);
        stopWatch();
        const nk = await makeBoard(data);
        if (ff) for (const d of ff.docs) await F.setDoc(F.doc(db, 'boards', nk, 'formfiles', d.id), d.data()).catch(() => {});
        await F.deleteDoc(F.doc(db, 'boards', old));
        toast('새 TV 주소를 만들었어요.'); watchBoard();
      } catch (e) { fail(e); }
      return;
    }
    /* 학급 명단 */
    case 'xls': $('xlsPick').click(); return;
    case 'rpaste': S.edit = 'paste'; render(); return;
    case 'rpasteok': {
      const r = rosterFromText($('rPaste').value);
      if (!r.length) return toast('번호와 이름을 찾지 못했어요. "1 김민수" 처럼 한 줄에 한 명씩 적어 주세요.', true);
      S.rost = r; S.edit = ''; render(); toast(r.length + '명을 넣었어요. 확인하고 [명단 저장]을 눌러 주세요.'); return;
    }
    case 'radd': { const R = rostRead(); const mx = R.reduce((m, s) => Math.max(m, +s.no || 0), 0); R.push({ no: mx + 1, name: '', bd: '' }); S.rost = R; render(); return; }
    case 'rdel': { const R = rostRead(); R.splice(+t.dataset.i, 1); S.rost = R; render(); return; }
    case 'rclear': if (!confirm('명단을 모두 비울까요? ([명단 저장]을 눌러야 실제로 지워져요)')) return; S.rost = []; render(); return;
    case 'rcancel': S.rost = null; render(); return;
    case 'rsave': {
      const R = rostRead().map(s => ({ no: parseInt(s.no, 10), name: cleanName(s.name), bd: s.bd ? bdOf(s.bd) : '' })).filter(s => s.name || s.no);
      const bad = R.find(s => !(s.no >= 1 && s.no <= 99) || !s.name);
      if (bad) return toast('번호(1~99)와 이름을 모두 채워 주세요.', true);
      const dup = R.find((s, i) => R.findIndex(x => x.no === s.no) !== i);
      if (dup) return toast(dup.no + '번이 두 번 있어요.', true);
      const badBd = rostRead().find(s => s.bd && !bdOf(s.bd));
      if (badBd) return toast((badBd.no || '') + '번 생일을 03-05 처럼 적어 주세요.', true);
      if (await save({ students: R.sort((a, b) => a.no - b.no) }, R.length + '명을 저장했어요.')) S.rost = null;
      return;
    }
    /* 설문 · 투표 */
    case 'svkind': S.svKind = t.dataset.v; render(); return;
    case 'svadd': {
      const kind = $('svKind').value, q = $('svQ').value.trim().slice(0, 100);
      if (!q) return toast('질문을 적어 주세요.', true);
      let options = ['체크'], multi = false, etc = false;
      if (kind === '선택'){
        options = $('svOpts').value.split('\n').map(x => x.trim()).filter(Boolean).map(x => x.slice(0, 80));
        options = options.filter((x, i) => options.indexOf(x) === i);
        etc = $('svEtc').checked; multi = $('svMulti').checked;
        if (options.length + (etc ? 1 : 0) < 2) return toast('보기를 두 개 이상 적어 주세요.', true);
        if (options.length > 150) return toast('보기는 150개까지예요.', true);
        if (etc) options.push('기타');
      }
      if ((B.surveys || []).length >= 45) return toast('조사가 너무 많아요. 지난 조사를 조금 지워 주세요.', true);
      let files = [];
      try { files = await uploadPending('survey'); } catch (e) { return fail(e); }
      const s = { id: 's' + rid(8), q, kind, options, multi, etc, anon: $('svAnon').checked, pub: $('svPub').checked, open: true, showMissing: true,
        desc: $('svDesc').value.trim().slice(0, 200), file: files[0] || null, at: new Date().toISOString() };
      if (await save({ surveys: (B.surveys || []).concat([s]) }, 'TV에 올렸어요.')){
        ['svQ', 'svDesc', 'svOpts'].forEach(k => { if ($(k)) $(k).value = ''; }); ['svMulti', 'svEtc', 'svAnon', 'svPub'].forEach(k => { if ($(k)) $(k).checked = false; });
      }
      return;
    }
    case 'svedit': S.svEdit = S.svEdit === id ? '' : id; ['seQ', 'seDesc', 'seOpts', 'seMulti', 'seEtc', 'seAnon'].forEach(k => { if ($(k)) $(k).remove(); }); render(); return;
    case 'svesave': {
      const s = (B.surveys || []).find(x => x.id === id); if (!s) return;
      const q = $('seQ').value.trim().slice(0, 100);
      if (!q) return toast('질문을 적어 주세요.', true);
      let options = s.options, multi = !!s.multi, etc = !!s.etc;
      if (s.kind !== '체크'){
        options = $('seOpts').value.split('\n').map(x => x.trim()).filter(Boolean).map(x => x.slice(0, 80)).filter(x => x !== '기타');
        options = options.filter((x, i) => options.indexOf(x) === i);
        etc = $('seEtc').checked; multi = $('seMulti').checked;
        if (options.length + (etc ? 1 : 0) < 2) return toast('보기를 두 개 이상 적어 주세요.', true);
        if (options.length > 150) return toast('보기는 150개까지예요.', true);
        if (etc) options.push('기타');
      }
      /* 응답 옮기기: 보기 글자가 같은 것만 남김 */
      const map = s.options.map(o => options.indexOf(o)), A = S.ANS[id] || {}, ops = [];
      let lost = 0;
      Object.keys(A).forEach(no => {
        let ch = []; (A[no].ch || []).forEach(i => { const j = map[i]; if (j != null && j >= 0 && ch.indexOf(j) < 0) ch.push(j); });
        if (!multi) ch = ch.slice(0, 1);
        const same = JSON.stringify(ch) === JSON.stringify(A[no].ch || []);
        const etcTxt = etc && ch.indexOf(options.length - 1) >= 0 ? (A[no].etc || '') : '';
        if (!ch.length){ lost++; ops.push(['del', no]); } else if (!same || etcTxt !== (A[no].etc || '')) ops.push(['set', no, ch, etcTxt]);
      });
      if (lost && !confirm('고치거나 지운 보기를 고른 응답 ' + lost + '개가 사라져요. 계속할까요?')) return;
      const ns = Object.assign({}, s, { q, desc: $('seDesc').value.trim().slice(0, 200), options, multi, etc, anon: $('seAnon').checked });
      if (!await save({ surveys: (B.surveys || []).map(x => x.id === id ? ns : x) }, '조사를 고쳤어요.')) return;
      try {
        await Promise.all(ops.map(o => o[0] === 'del' ? F.deleteDoc(F.doc(db, 'boards', S.key, 'answers', id + '_' + o[1]))
          : F.setDoc(F.doc(db, 'boards', S.key, 'answers', id + '_' + o[1]), { sid: id, no: +o[1], ch: o[2], etc: o[3], at: F.serverTimestamp() })));
      } catch (e) { fail(e); }
      S.svEdit = ''; render(); return;
    }
    case 'svopen': S.openSv = S.openSv === id ? '' : id; render(); return;
    case 'svtog': return save({ surveys: (B.surveys || []).map(s => s.id === id ? Object.assign({}, s, { open: !s.open }) : s) }, '바꿨어요.');
    case 'svpub': return save({ surveys: (B.surveys || []).map(s => s.id === id ? Object.assign({}, s, { pub: !s.pub }) : s) }, '바꿨어요.');
    case 'svshare': { const s = (B.surveys || []).find(x => x.id === id); if (s) svShare(s); return; }
    case 'svclr': { const sel = document.querySelector(`[data-svclr="${CSS.escape(id)}"]`); const no = sel && +sel.value; if (!no) return toast('번호를 골라 주세요.'); return ansClear(id, no); }
    case 'pinmode': {
      const on = t.dataset.v === 'on';
      if (on === (B.pinChange !== false)) return;
      if (on && !B.viewKey && !confirm('학생이 휴대폰에서 PIN을 만들려면 [TV 연결] 탭에서 학생용 주소를 만들어야 해요.\n지금 PIN 방식으로 바꿀까요? (주소는 그다음에 만들어도 돼요)')) return;
      await save({ pinChange: on }, on ? '🔒 PIN으로 안전하게: 이미 낸 답은 PIN을 넣어야 바꿀 수 있어요.' : '🙂 PIN 없이 간단하게: 이름만 누르면 답을 바꿀 수 있어요.');
      return;
    }
    case 'sndsave': { const o = sndRead(), e = sndValidate(o); if (e) return toast(e); await save({ sound: o }, '소리 설정을 저장했어요. 교실 TV에 곧 반영돼요.'); return; }
    case 'sndoff': { const o = sndCur(); o.offDay = o.offDay === kstToday() ? '' : kstToday(); await save({ sound: o }, o.offDay ? '오늘은 교실 TV 음악을 껐어요.' : '오늘 음악을 다시 켰어요.'); return; }
    case 'pinreset': return pinReset(+t.dataset.no);
    case 'pinset': return pinSetFor(+t.dataset.no);
    case 'pcinst': pcModal(); return;
    case 'fxreset': S.fx = null; render(); return;
    case 'fxpick': $('fxPick').click(); return;
    case 'fxmake': return fxMake();
    case 'fxedit': if (S.fx && S.fx.edit === id){ S.fx = null; render(); return; } return fxEditOpen(id);
    case 'fxeditx': S.fx = null; render(); return;
    case 'fxesave': return fxEditSave();
    case 'fxdl': return fxDownload(id);
    case 'fxcsv': return fxCsv(id);
    case 'fxdel': return fxDelete(id);
    case 'fxtog': { const L = fxGroup(id); if (!L.length) return; const op = !L[0].open; return save({ surveys: (B.surveys || []).map(s => s.grp === id ? Object.assign({}, s, { open: op }) : s) }, op ? '다시 열었어요.' : '마감했어요.'); }
    case 'svcsv': { const s = (B.surveys || []).find(x => x.id === id); if (s) csvOf(s); return; }
    case 'svdel': {
      if (!confirm('이 조사와 응답을 모두 지울까요?')) return;
      if (await save({ surveys: (B.surveys || []).filter(s => s.id !== id) }, '지웠어요.')) delAnswers(id);
      return;
    }
    /* 건의함 */
    case 'sgreload': S.sugg = null; render(); return;
    case 'sgdel': if (!confirm('이 건의를 지울까요?')) return;
      try { await F.deleteDoc(F.doc(db, 'boards', S.key, 'suggest', id)); S.sugg = (S.sugg || []).filter(x => x.id !== id); render(); } catch (e) { fail(e); } return;
    /* 운영자 */
    case 'opreload': return loadTeachers();
    case 'opok': try { await F.updateDoc(F.doc(db, 'teachers', t.dataset.uid), { status: 'ok' }); toast('승인했어요.'); loadTeachers(); } catch (e) { fail(e); } return;
    case 'opstop': if (!confirm('이 선생님의 사용을 멈출까요? (자료는 지우지 않아요)')) return;
      try { await F.updateDoc(F.doc(db, 'teachers', t.dataset.uid), { status: 'stop' }); toast('멈췄어요.'); loadTeachers(); } catch (e) { fail(e); } return;
    case 'opdel': if (!confirm('이 가입 신청을 거절할까요?')) return;
      try { await F.deleteDoc(F.doc(db, 'teachers', t.dataset.uid)); toast('거절했어요.'); loadTeachers(); } catch (e) { fail(e); } return;
  }
});
start();
/* 앱을 열자마자 도입 애니메이션 (그 사이에 로그인 확인 · 자료 불러오기) */
introPlay();
</script>
</body>
</html>
