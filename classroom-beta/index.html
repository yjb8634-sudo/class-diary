<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>교실 화면 관리</title>
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="교실 화면">
<!-- 학급 다이어리 공용 디자인 (칠판과 분필) · 2026-10-21a
     각 화면 맨 끝에 끼워 넣어, 화면마다 다르던 색 · 글꼴 이름을 한 가지 토큰으로 다시 묶습니다. -->
<script>var FILE_VER = '2026-10-26b'; var THEME_VER = '2026-10-21a';</script>
<style>

/* ── 글꼴: 학교안심 분필 (KERIS) ──
   글꼴 파일은 GitHub Pages(class-diary/fonts/)에서 내려받습니다. 자주 쓰는 한글 2,350자와 화면에 쓰인 글자만 담은 가벼운 woff2(약 210KB)를 먼저 쓰고,
   드문 글자(예: 똠, 뷁)는 다른 글꼴로 대신 나옵니다. 주소가 바뀌면 아래 줄만 고치세요.
   굵기가 한 가지뿐이라 모든 굵기에 같은 파일을 씁니다(억지로 굵게 만들면 분필 글씨가 뭉개져서). 제목은 크기로 구분합니다. */
@font-face{font-family:'Bunpil';font-style:normal;font-weight:100 900;font-display:swap;
  src:url('https://yjb8634-sudo.github.io/class-diary/fonts/Bunpil-R.woff2') format('woff2'),url('https://yjb8634-sudo.github.io/class-diary/fonts/Bunpil-R.woff') format('woff')}

:root{
  /* ── 색 (칠판과 분필) ──
     칠판 바탕 · 분필 글씨 · 노란 분필 강조. 색을 바꾸려면 이 묶음만 고치면 모든 화면이 함께 바뀝니다. */
  --t-surface:#22392E;               /* 칠판 */
  --t-surface-2:#29443A;             /* 카드 (칠판보다 살짝 밝게) */
  --t-surface-3:#315044;             /* 입력칸 · 눌린 곳 */
  --t-ink:#F4F1E8;                   /* 흰 분필 */
  --t-ink-2:rgba(244,241,232,.86);
  --t-ink-3:rgba(244,241,232,.64);
  --t-line:rgba(244,241,232,.18);    /* 분필 선 */
  --t-line-2:rgba(244,241,232,.34);
  --t-blue:#2F5D8A;                  /* 파란 분필 (흰 글씨가 잘 읽히는 진한 쪽) */
  --t-yellow:#FFE27A;                /* 노란 분필 */
  --t-red:#B8452F;                   /* 빨간 분필 */
  --t-red-h:#E07058;
  --t-purple:#6A4C8C;
  --t-purple-h:#8063A3;
  --t-wood:#7A5A3A;                  /* 분필받이 나무 */

  /* ── 글꼴: 모든 글자를 한 글꼴로 ── */
  --t-font:'Bunpil','Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --t-display:var(--t-font); --t-serif:var(--t-font); --t-mono:var(--t-font); --t-sans:var(--t-font);

  /* ── 간격 · 모양 · 움직임 ── */
  --t-1:18px; --t-2:33.75px; --t-3:48px; --t-4:96px;
  --t-r:6px;
  --t-shape:10px 4px 12px 6px;                 /* 손으로 그린 듯 모서리마다 조금씩 다르게 */
  --t-dur:.65s; --t-ease:cubic-bezier(.33,1,.68,1);
}

/* ════════ 화면별 색 이름 다시 묶기 ════════ */
/* 첫 화면 · 21일 · 문제 해결 */
:root{
  --bg:var(--t-surface); --card:var(--t-surface-2); --ink:var(--t-ink); --sub:var(--t-ink-3); --line:var(--t-line);
  --w1:var(--t-blue); --w1b:var(--t-blue); --w2:var(--t-purple); --w2b:var(--t-purple-h);
  --w3:var(--t-red); --w3b:var(--t-red-h); --gold:var(--t-yellow); --goldb:var(--t-yellow);
}
/* 교실 화면 */
:root{
  --card2:var(--t-surface-3); --chalk:var(--t-ink); --chalk2:var(--t-ink-2); --chalk3:var(--t-ink-3);
  --yellow:var(--t-yellow); --yellow-ink:var(--t-surface); --mint:#7FD8C4; --pink:#F2A7A0; --sky:#8FB4FF;
}
/* 상담 신청판 */
:root{
  --surface:var(--t-surface-2); --surface-2:var(--t-surface-3); --ink-2:var(--t-ink-2); --ink-3:var(--t-ink-3);
  --line-2:var(--t-line-2); --teal:var(--t-yellow); --teal-ink:var(--t-yellow); --teal-soft:rgba(255,226,122,.14);
  --amber:#FFC24A; --amber-soft:rgba(255,194,74,.14); --danger:#FF6B6B; --danger-soft:rgba(215,30,30,.18);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 32px -18px rgba(0,0,0,.7);
  --font-display:var(--t-display); --font-body:var(--t-sans);
}
/* 담임 기록실 */
:root{
  --paper:var(--t-surface); --sheet:var(--t-surface-2); --ink2:var(--t-ink-2); --ink3:var(--t-ink-3);
  --rule:var(--t-line); --rule2:var(--t-line-2); --hover:var(--t-surface-3);
  --accent:var(--t-yellow); --accent-s:rgba(255,226,122,.12);
  --pos:#7FD8C4; --pos-s:rgba(127,216,196,.14); --neg:#FF6B6B; --neg-s:rgba(215,30,30,.18);
  --a-자율:#8FB4FF; --a-진로:#FFC24A; --a-행특:#C89BE0; --a-기타:var(--t-ink-3);
  --margin:rgba(255,107,107,.5); --serif:var(--t-serif); --sans:var(--t-sans);
}

/* ════════ 바탕 ════════ */
html,body{background:var(--t-surface);color:var(--t-ink);font-family:var(--t-sans);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{letter-spacing:-.005em}
::selection{background:var(--t-yellow);color:var(--t-surface)}
/* 칠판에 남은 분필 가루 (아주 옅게) */
body{background-image:radial-gradient(60% 40% at 18% 8%,rgba(244,241,232,.05),transparent 70%),radial-gradient(50% 35% at 85% 70%,rgba(244,241,232,.035),transparent 70%)}

/* ── 제목: 컨덴스드 ── */
h1,h2,h3,.pt,.inq-h .t b{font-family:var(--t-display);font-weight:600;letter-spacing:-.01em}
h1{letter-spacing:0}
/* ── 라벨 · 메타: 모노 ── */
.lbl,.small.muted,.hint,.cap,.pk,.ist,.chip,.tg,.pill,.src,.mono,.cnt small,.who,.date .hl,.dust{
  font-family:var(--t-mono);letter-spacing:.01em}

/* ── 입력 ── */
input,select,textarea,.in,.field{
  background:var(--t-surface-3);color:var(--t-ink);border:1px solid var(--t-line);
  border-radius:var(--t-r);font-family:var(--t-sans)}
input:focus,select:focus,textarea:focus,.in:focus,.field:focus{
  outline:none;border-color:var(--t-yellow);box-shadow:0 1px 0 0 var(--t-yellow)}
input::placeholder,textarea::placeholder{color:var(--t-ink-3)}
input[type=date],input[type=file]{color-scheme:dark}
label{color:var(--t-ink-2)}

/* ── 단추 ── */
button,.btn,.act,.go,.jpill,.gt-go,.joinbtn,.homebtn,.sh-x,.gt-x{
  font-family:var(--t-sans);border-radius:var(--t-shape);
  transition:background var(--t-dur) var(--t-ease),color var(--t-dur) var(--t-ease),opacity var(--t-dur) var(--t-ease)}
.act,.go,.gt-go,.btn.pri,.btn.primary,.joinbtn{background:var(--t-blue);color:var(--t-ink);border:0;font-weight:600}
.act:hover,.go:hover,.gt-go:hover,.btn.pri:hover,.joinbtn:hover{background:var(--t-blue);opacity:.86}
.act.green{background:var(--t-blue)}
.act.newround,.act.gold{background:var(--t-yellow);color:var(--t-surface)}
.btn.neg,.neg{color:var(--t-red-h)}

/* ── 카드 · 상자: 파일 탭 모양 ── */
.card,.box,.sheetbox,.gt-box,.pick,.inq-s,.it,.rw{
  background:var(--t-surface-2);border:1.5px solid var(--t-line);
  border-radius:var(--t-shape);box-shadow:none}
.card,.box{color:var(--t-ink)}
hr,.hr,.divider{background:var(--t-line);border-color:var(--t-line)}
table,th,td{border-color:var(--t-line)!important;color:var(--t-ink)}
th{color:var(--t-ink-2);font-family:var(--t-mono);font-weight:500}
a{color:var(--t-ink)}
a:hover{color:var(--t-yellow)}

/* ── 알림 ── */
.msg.ok,.note.ok,.gt-note.ok{background:rgba(127,216,196,.14);color:#9FE6D6}
.msg.err,.note.err,.gt-note.err{background:rgba(215,30,30,.2);color:#FF9B9B}


/* ════════ 모든 글자에 한 글꼴 ════════
   화면마다 따로 적힌 글꼴 이름(Pretendard · Oswald · 명조 등)을 모두 이 글꼴로 덮습니다.
   손글씨체는 글자 사이를 조이면 겹쳐 보이므로 자간도 0으로 맞춥니다. */
html body,html body *{font-family:var(--t-font)!important;letter-spacing:0!important;font-weight:400!important}
/* 제목만 굵게: 화면 제목 · 카드 제목 · 시계 · 지금 수업 · 큰 목록 · 명언 · 시작 화면 문구 */
html body :is(b,strong,h1,h2,h3,h4,.pt,.ti .tnm,.hm,.big,.num,.quote .q,.brand b,.iw,.gt-head b,.inq-h .t b,.cpl .ttl){font-weight:700!important}

/* ════════ 화면별 손질 ════════ */
/* 탭 · 표 · 숫자 */
nav button.on{background:var(--t-yellow)!important;color:var(--t-surface)!important}
th{background:var(--t-surface-3)!important;color:var(--t-ink-2)!important}
tr:hover td{background:var(--t-surface-3)}
.num{background:none!important;-webkit-text-fill-color:var(--t-yellow);color:var(--t-yellow)!important;font-family:var(--t-display)}
.num.gold{-webkit-text-fill-color:var(--t-yellow)}
.prw .pc{background:var(--t-surface-3)}
.prw:hover{border-color:var(--t-line-2)}
.prw.done{border-color:rgba(255,226,122,.5)}
.cell{background:var(--t-surface-3)}
.homebtn,.wlink,.tlink{color:var(--t-ink-2)}
/* 첫 화면 */
.ti .tnm{background:none;-webkit-text-fill-color:currentColor;color:var(--t-ink);font-family:var(--t-display)}
.ti .tcur{color:var(--t-yellow)}
.ti .tno{font-family:var(--t-mono)}
.jpill{background:transparent;border:1.5px dashed var(--t-line-2);color:var(--t-ink)}
.jpill:hover{background:var(--t-blue);border-color:var(--t-blue)}
#intro,#splash{background:var(--t-surface)}
#intro .iw{background:none;-webkit-text-fill-color:currentColor;color:var(--t-ink);font-family:var(--t-display)}
/* 교실 화면: 칠판 톤으로 */
/* 교실 화면 아래 단추(상담 신청 · 건의사항 · 조사 참여 · 결과 보기): 파란 면을 없애고 배경과 같은 색에 테두리만 */
.board .act{background:var(--t-surface);color:var(--t-ink);border:1px solid var(--t-line-2);
  border-radius:var(--t-shape);box-shadow:none;opacity:1;
  transition:background var(--t-dur) var(--t-ease),border-color var(--t-dur) var(--t-ease)}
.board .act:hover,.board .act:focus-visible{background:var(--t-surface-3);border-color:var(--t-ink-3);opacity:1}
.board .act:active{background:var(--t-surface-3)}
.board .act .ic{background:transparent;border:1px solid var(--t-line-2);color:var(--t-ink)}

.board .card,.board .now{background:var(--t-surface-2);border-color:var(--t-line);border-radius:var(--t-shape)}
.clock .hm,.now .big{font-family:var(--t-display)}
.quote .q{font-family:var(--t-serif)}
/* 상담 · 담임: 밝은 잔재 */
.cal .slot,.seg,.seg2,.tagpick button,.tabs{background:var(--t-surface-3)}
.seg button[aria-pressed=true],.seg2 button.on{background:var(--t-yellow);color:var(--t-surface)}
.box h2,.card h2{color:var(--t-ink)}
details summary{color:var(--t-ink-2)}
/* 탐구 노트 */
.inq-s{background:var(--t-surface-2)}
.inq-s.done{background:rgba(127,216,196,.08);border-color:rgba(127,216,196,.35)}
.inq-s.open{border-color:var(--t-yellow)}
.inq-h .n{color:var(--t-yellow);font-family:var(--t-display)}
.inq-h .t small{background:var(--t-surface-3);color:var(--t-ink-3)}
.inq .chk{background:rgba(255,226,122,.08)}
.inq-from{background:var(--t-surface-3);border-color:var(--t-line)}


/* ════════ 인쇄할 때만: 흰 바탕 · 검은 글씨 ════════
   화면에서는 칠판 톤, 종이에는 잉크를 아끼는 흰 바탕으로 바꿉니다.
   모든 색이 --t-* 토큰을 거치므로 토큰만 뒤집으면 다섯 화면이 한꺼번에 바뀝니다. */
@media print{
  :root{
    --t-surface:#fff; --t-surface-2:#fff; --t-surface-3:#F3F3F0;
    --t-ink:#111; --t-ink-2:#333; --t-ink-3:#666;
    --t-line:rgba(0,0,0,.2); --t-line-2:rgba(0,0,0,.35);
    --t-blue:#111; --t-yellow:#111; --t-wood:#999; --t-red:#A4261D; --t-red-h:#A4261D; --t-purple:#444; --t-purple-h:#444;
    --mint:#1B6B4A; --pink:#A4432B; --sky:#3B5B86;
    --pos:#1B6B4A; --pos-s:#E6F0EA; --neg:#A4432B; --neg-s:#F6E7E2;
    --a-자율:#3B5B86; --a-진로:#8A6326; --a-행특:#6E3F63; --a-기타:#666;
    --accent:#111; --accent-s:#EEE; --margin:#E7B9AE;
    --amber:#8A5A00; --danger:#A4432B; --teal:#111; --teal-ink:#111; --teal-soft:#EEE;
  }
  html,body{background:#fff!important;background-image:none!important;color:#111!important;-webkit-print-color-adjust:economy;print-color-adjust:economy}
  *{box-shadow:none!important;text-shadow:none!important;animation:none!important;transition:none!important}
  /* 화면 전용 장치는 종이에 내보내지 않음 */
  #busy,#intro,#splash,.gt,#toast,.homebtn,.joinrow,.hb-top,.hb-foot .links,.cpline{display:none!important}
  /* 그라데이션 글씨는 종이에서 사라지므로 단색으로 */
  .num,.ti .tnm,#intro .iw{background:none!important;-webkit-text-fill-color:#111!important;color:#111!important}
  /* 입력 · 카드는 선만 */
  input,select,textarea,.in,.field{background:#fff!important;color:#111!important;border-color:rgba(0,0,0,.3)!important}
  .card,.box,.it,.rw,.inq-s,.pick{background:#fff!important;border-color:rgba(0,0,0,.2)!important}
  th{background:#F3F3F0!important;color:#111!important}
  a{color:#111!important;text-decoration:underline}
  /* 저작권 문구는 맨 아래에 작게 남김 */
  body::after{content:'© 2026 강릉제일고 교사 유준배 · 무단 복제 · 배포 금지';display:block;margin-top:24px;padding-top:8px;
    border-top:1px solid rgba(0,0,0,.2);font-size:10px;line-height:1.4;color:#666;text-align:center}
}

@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

<style>
/* 교실 TV 화면과 같은 칠판 색 */
:root{
  --bg:#1D2A25; --card:#233229; --card2:#2A3A32; --card3:#31443A; --line:rgba(226,222,208,.12); --line2:rgba(226,222,208,.24);
  --chalk:#E4E0D3; --chalk2:rgba(228,224,211,.82); --chalk3:rgba(228,224,211,.58);
  --yellow:#E6CD7E; --yellow-ink:#1D2A25; --mint:#8CC6B6; --pink:#DDA29A; --sky:#9BB6DA; --red:#E5735E;
  --shape:12px 5px 14px 7px;
}
*{box-sizing:border-box}
html{font-size:16px}
html,body{margin:0;background:var(--bg);color:var(--chalk)}
body{line-height:1.55;min-height:100vh}
h1,h2,h3,p{margin:0}
.wrap{max-width:1120px;margin:0 auto;padding:18px 16px 90px}
/* 윗줄: TV 화면처럼 */
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.top h1{font-size:30px;flex:1;min-width:220px;line-height:1.2}
.top h1 small{display:block;font-size:15px;color:var(--chalk3);margin-top:4px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--chalk2);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 12px;white-space:nowrap}
.pill b{color:var(--yellow)}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:var(--shape);padding:18px 20px;margin-bottom:16px}
.card > h2{font-size:21px;margin-bottom:4px;color:var(--chalk)}
.card > h2 .sub{font-size:14px;color:var(--chalk3);margin-left:8px}
.lead{font-size:14.5px;color:var(--chalk3);margin:0 0 12px}
.muted{color:var(--chalk3)} .small{font-size:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:150px}
.in{padding:9px 11px;font-size:15.5px;min-height:42px;min-width:0;border-radius:8px}
textarea.in{width:100%;resize:vertical;line-height:1.5}
select.in{padding-right:28px}
.b{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:0 15px;
  border-radius:var(--shape);background:var(--card2);border:1px solid var(--line2);color:var(--chalk);font-size:15px;white-space:nowrap;text-decoration:none}
.b:hover{background:var(--card3)}
.b:active{transform:scale(.97)}
.b.y{background:var(--yellow);color:var(--yellow-ink);border-color:transparent;font-weight:700}
.b.y:hover{filter:brightness(1.06)}
.b.r{color:var(--pink);border-color:rgba(221,162,154,.4)}
.b.sm{min-height:34px;padding:0 11px;font-size:14px}
.b.big{min-height:56px;font-size:19px;padding:0 26px}
.b[disabled]{opacity:.45;pointer-events:none}
.b svg{width:18px;height:18px}
/* 탭 */
nav.tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px;margin:0 0 18px;background:transparent!important;padding:0;border:0}
nav.tabs button{background:#1F2D27!important;border:1px solid rgba(232,228,214,.16)!important;color:#D9D5C7!important;box-shadow:0 1px 0 rgba(0,0,0,.25)}
nav.tabs button:hover{background:#26372F!important;border-color:rgba(242,209,107,.45)!important;color:#F3F1E7!important}
nav.tabs button.on{background:#F2D16B!important;border-color:#F2D16B!important;color:#1D2A25!important;font-weight:700;box-shadow:0 2px 10px rgba(242,209,107,.18)}
nav.tabs button{all:unset;box-sizing:border-box;cursor:pointer;text-align:center;padding:12px 6px;border-radius:var(--shape);background:var(--card);border:1.5px solid var(--line);
  color:var(--chalk2);font-size:15.5px;line-height:1.25;position:relative}
nav.tabs button:hover{background:var(--card2)}
nav.tabs button .ic{display:block;font-size:20px;margin-bottom:2px}

<script type="module">
import { fb, OPERATOR, SCHOOL, DEFAULT_PERIODS, DEFAULT_SPECIALS, DEFAULT_LUNCH, rid, kstToday } from './fb.js';

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let tT = null;
function toast(m, bad){ const t = $('toast'); t.textContent = m; t.className = 'show' + (bad ? ' bad' : ''); clearTimeout(tT); tT = setTimeout(() => t.className = '', bad ? 4200 : 2600); }
function busy(m){ const b = $('busy'); b.textContent = m || ''; b.hidden = !m; }
const fail = e => { console.error(e); busy(''); toast(friendly(e), true); };
function friendly(e){
  const m = String(e && (e.code || e.message) || e);
  if (/permission|insufficient/i.test(m)) return '권한이 없어요. 승인 상태를 확인하거나 다시 로그인해 주세요.';
  if (/popup-closed|cancelled-popup|user-cancelled/i.test(m)) return '구글 창이 닫혔어요. 다시 눌러 주세요.';
  if (/popup-blocked/i.test(m)) return '팝업이 막혔어요. 주소창 오른쪽에서 팝업을 허용해 주세요.';
  if (/network|unavailable|offline|Failed to fetch/i.test(m)) return '인터넷 연결을 확인해 주세요.';
  return (e && e.message ? e.message : m).replace(/^Firebase:\s*/, '');
}
const S = { SEV: [], sevUnsub: null, CNS: [], cnsUnsub: null, ANSL: [], SUGL: [], sugUnsub: null, bellOpen: false, bellPrev: 0, newVer: '', fb: null, user: null, me: null, B: null, key: '', tab: 'notice', unsub: null, ansUnsub: null, ANS: {}, teachers: null,
  nf: { level: 0 }, edit: '', pend: { notice: [], note: [], survey: [] }, pickFor: '', sugg: null, rost: null, openSv: '' };
try { S.tab = localStorage.getItem('cr_tab2') || 'notice'; } catch (e) {}

/* ================= 시작 · 로그인 ================= */
async function start(){
  try { S.fb = await fb(); }
  catch (e) {
    $('app').innerHTML = `<div class="center"><div class="card"><h2>연결하지 못했어요</h2><p class="lead" style="margin-top:8px">인터넷 연결을 확인하고 새로고침해 주세요. 학교 인터넷에서 막혀 있으면 휴대폰 데이터로 열어 보세요.</p></div></div>`;
    return;
  }
  const { auth, A } = S.fb;
  try { await A.getRedirectResult(auth); } catch (e) { if (!/no-auth-event/.test(String(e.code))) fail(e); }
  A.onAuthStateChanged(auth, u => { S.user = u && !u.isAnonymous ? u : null; route(); });
}
async function login(){
  const { auth, A } = S.fb;
  const p = new A.GoogleAuthProvider();
  p.setCustomParameters({ prompt: 'select_account' });
  try { await A.signInWithPopup(auth, p); }
  catch (e) {
    if (/popup-blocked|operation-not-supported/i.test(String(e.code))) return A.signInWithRedirect(auth, p);
    fail(e);
  }
}
function stopWatch(){ if (S.unsub){ S.unsub(); S.unsub = null; } if (S.ansUnsub){ S.ansUnsub(); S.ansUnsub = null; } if (S.cnsUnsub){ S.cnsUnsub(); S.cnsUnsub = null; } if (S.sugUnsub){ S.sugUnsub(); S.sugUnsub = null; } if (S.sevUnsub){ S.sevUnsub(); S.sevUnsub = null; } }
async function logout(){ stopWatch(); S.me = null; S.B = null; await S.fb.A.signOut(S.fb.auth); }
const isOperator = () => !!(S.user && S.user.email === OPERATOR);

async function route(){
  stopWatch();
  if (!S.user) return vLogin();
  $('app').innerHTML = '<div class="loading">확인하는 중…</div>';
  const { db, F } = S.fb;
  try {
    const snap = await F.getDoc(F.doc(db, 'teachers', S.user.uid));
    S.me = snap.exists() ? snap.data() : null;
  } catch (e) { S.me = null; fail(e); }
  if (!S.me) return isOperator() ? vOperatorOnly() : vJoin();
  if (S.me.status !== 'ok' && isOperator()){   /* 운영자 본인 신청은 바로 승인 */
    try { await F.updateDoc(F.doc(db, 'teachers', S.user.uid), { status: 'ok' }); S.me.status = 'ok'; } catch (e) { fail(e); }
  }
  if (S.me.status === 'pending') return vWait();
  if (S.me.status !== 'ok') return vStopped();
  /* TV 열쇠는 본인만 읽을 수 있는 keys/{uid}에 둡니다 (운영자 명단에는 남기지 않음) */
  try {
    let key = '', inKeys = false;
    try { const ks = await F.getDoc(F.doc(db, 'keys', S.user.uid)); if (ks.exists() && ks.data().boardKey){ key = ks.data().boardKey; inKeys = true; } } catch (e) { console.warn('keys get', e); }
    if (!key && S.me.boardKey){
      key = S.me.boardKey;
      try { await F.setDoc(F.doc(db, 'keys', S.user.uid), { boardKey: key }); inKeys = true; } catch (e) { console.warn('keys set (보안 규칙 확인 필요)', e); }
    }
    /* 열쇠가 keys/로 옮겨진 것이 확인됐을 때만 명단에서 지웁니다 */
    if (S.me.boardKey && inKeys){ await F.updateDoc(F.doc(db, 'teachers', S.user.uid), { boardKey: F.deleteField() }).catch(() => {}); }
    S.me.boardKey = key;
    if (!key) await makeBoard();
  } catch (e) { return fail(e); }
  watchBoard();
}

function vLogin(){
  $('app').innerHTML = `<div class="center">
    <img class="logo" src="icon-192.png" alt="">
    <h1 style="font-size:34px;margin:0 0 8px">교실 화면</h1>

/* 작은 SHA-256 (오래된 TV 브라우저처럼 crypto.subtle 이 없을 때) */

  words[words.length] = ((blen / 4294967296) | 0); words[words.length] = blen;
  for (j = 0; j < words.length;) {

      var t2 = (rr(a, 2) ^ rr(a, 13) ^ rr(a, 22)) + ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
      hash = [(t1 + t2) | 0].concat(hash); hash[4] = (hash[4] + t1) | 0;

  return '';
}

const FONT_BASE = 'https://yjb8634-sudo.github.io/class-diary/fonts/';
let FONTL = null, FONTLOADING = false;
function fontLoadList(after){
  if (FONTL || FONTLOADING) return;
  FONTLOADING = true;
  const j1 = fetch(FONT_BASE + 'fonts.json?h=' + Date.now(), { cache: 'no-cache' }).then(r => r.json());
  const j2 = fetch(FONT_BASE + 'preview.json?h=' + Math.floor(Date.now() / 36e5)).then(r => r.json()).catch(() => ({}));
  Promise.all([j1, j2]).then(([j, pv]) => {
    FONTL = j.fonts || j;
    const css = FONTL.filter(f => f.family && pv[f.id]).map(f => `@font-face{font-family:'PvF-${f.id}';font-display:block;src:url(data:font/woff;base64,${pv[f.id]}) format('woff')}`).join('\n');
    const st = document.createElement('style'); st.id = 'pvFonts'; st.textContent = css; document.head.appendChild(st);
    after();
  }).catch(() => { FONTL = []; after(); });
}
function fontPickHtml(cur, act){
  cur = cur || 'bunpil';
  if (!FONTL) return '<p class="small muted">글꼴 목록을 불러오는 중…</p>';
  if (!FONTL.length) return '<p class="small muted">글꼴 목록을 불러오지 못했어요. 잠시 뒤 다시 열어 주세요.</p>';
  const G = [], by = {};
  FONTL.forEach(f => { const g = f.group || f.name; if (!by[g]){ by[g] = []; G.push(g); } by[g].push(f); });
  const now = FONTL.find(f => f.id === cur) || FONTL[0];
  return `<p class="small" style="margin:4px 0 0">지금 글꼴: <b>${esc(now.name)}</b> · 학교안심 글꼴 ${G.length - 1}종</p>
    <div class="fontgrid">${G.map(g => {
      const L = by[g], sel = L.find(f => f.id === cur), show = sel || L[0];
      const ff = show.family ? `'PvF-${esc(show.id)}',` : '';
      return `<div class="fontopt${sel ? ' on' : ''}" data-${act}="font" data-id="${esc(show.id)}" role="button" tabindex="0">
        <span class="fs" style="font-family:${ff}'Pretendard','Malgun Gothic',sans-serif!important">1학년 2반 · 오늘 급식 12:40</span>
        <span class="fn">${sel ? '✓ ' : ''}${esc(g)}${L.length > 1 ? ` <span class="fw">${L.map(f => `<button class="fwb${f.id === cur ? ' on' : ''}" data-${act}="font" data-id="${esc(f.id)}">${esc(f.w || '')}</button>`).join('')}</span>` : ''}</span></div>`;
    }).join('')}</div>`;
}

/* 생일 글자 → 'MM-DD' */
function bdOf(v){
  if (v == null || v === '') return '';
  if (v instanceof Date && !isNaN(v)) return String(v.getMonth() + 1).padStart(2, '0') + '-' + String(v.getDate()).padStart(2, '0');
  if (typeof v === 'number' && v > 20000 && v < 80000){ const d = new Date(Math.round((v - 25569) * 864e5)); return String(d.getUTCMonth() + 1).padStart(2, '0') + '-' + String(d.getUTCDate()).padStart(2, '0'); }
  let s = String(v).trim();
  let m = s.match(/^(\d{6})\s*-\s*\d/);                      /* 주민번호 앞자리 */
  if (m) s = m[1];

    || s.match(/^(\d{1,2})\s*[.\-/월]\s*(\d{1,2})\s*일?$/);
  if (!m) return '';
  const mo = +m[1], d = +m[2];

function cleanName(s){ return String(s == null ? '' : s).replace(/\s+/g, ' ').trim().slice(0, 20); }
/* 표(2차원 배열)에서 번호 · 이름 · 생일 찾기 */
function rosterFromRows(rows){
  const norm = x => String(x == null ? '' : x).replace(/\s/g, '');
  let hi = -1, cNo = -1, cName = -1, cBd = -1, cHak = -1;
  for (let i = 0; i < Math.min(rows.length, 30); i++){
    const r = rows[i] || [];
    const f = re => r.findIndex(c => re.test(norm(c)));
    const a = f(/^(번호|출석번호|번)$/), b = f(/^(성명|이름|학생명|학생성명|성명\(한글\))$/), h = f(/^학번$/);
    if (b >= 0 && (a >= 0 || h >= 0)){ hi = i; cNo = a; cName = b; cHak = h; cBd = f(/생년월일|생일|출생/); break; }
  }
  const out = [];
  if (hi >= 0){
    for (let i = hi + 1; i < rows.length; i++){
      const r = rows[i] || [];
      let no = cNo >= 0 ? parseInt(norm(r[cNo]), 10) : NaN;
      if (isNaN(no) && cHak >= 0){ const h = norm(r[cHak]); if (/^\d{3,6}$/.test(h)) no = +h.slice(-2); }
      const name = cleanName(r[cName]);
      if (!(no >= 1 && no <= 99) || !name || /^\d+$/.test(name)) continue;
      out.push({ no, name, bd: cBd >= 0 ? bdOf(r[cBd]) : '' });
    }
  } else {
    /* 제목 줄이 없으면: 숫자 칸 다음의 한글 이름 칸 */
    rows.forEach(r => {
      r = r || [];
      for (let j = 0; j < r.length - 1; j++){
        const no = parseInt(norm(r[j]), 10), name = cleanName(r[j + 1]);
        if (no >= 1 && no <= 99 && /^[가-힣]{2,6}$/.test(name.replace(/\s/g, ''))){
          let bd = ''; for (let k = j + 2; k < r.length && !bd; k++) bd = bdOf(r[k]);
          out.push({ no, name, bd }); break;
        }
      }
    });
  }
  const seen = {};
  return out.filter(s => !seen[s.no] && (seen[s.no] = 1)).sort((a, b) => a.no - b.no);
}
function rosterFromText(t){
  const rows = String(t || '').split(/\r?\n/).map(l => l.trim()).filter(Boolean).map(l => {
    if (l.indexOf('\t') >= 0) return l.split('\t');
    const m = l.match(/^(\d{1,3})\s*[.,)\s]\s*([^\d\s]\S*(?:\s[^\d\s]\S*)?)\s*(.*)$/);   /* 이름 칸이 생일(숫자)까지 삼키지 않게 */
    return m ? [m[1], m[2], m[3]] : l.split(/\s+/);
  });
  const r1 = rosterFromRows(rows);
  return r1.length ? r1 : rows.map(r => ({ no: parseInt(r[0], 10), name: cleanName(r[1]), bd: bdOf(r[2]) })).filter(s => s.no >= 1 && s.no <= 99 && s.name);
}

async function readRosterFile(f){
  busy('엑셀 파일을 읽는 중…');
  try {
    const X = await loadXlsx();
    const wb = X.read(await f.arrayBuffer(), { type: 'array', cellDates: true });
    let best = [];
    wb.SheetNames.forEach(n => {

const BK_SUBS = ['answers', 'counsel', 'suggest', 'sevents'];
const bkOut = v => { if (v && typeof v.toMillis === 'function') return { __ts: v.toMillis() }; if (Array.isArray(v)) return v.map(bkOut);
  if (v && typeof v === 'object'){ const o = {}; for (const k in v) o[k] = bkOut(v[k]); return o; } return v; };
const bkIn = v => { if (v && typeof v === 'object' && !Array.isArray(v) && Object.keys(v).length === 1 && typeof v.__ts === 'number') return new Date(v.__ts);
  if (Array.isArray(v)) return v.map(bkIn); if (v && typeof v === 'object'){ const o = {}; for (const k in v) o[k] = bkIn(v[k]); return o; } return v; };
async function bkBuild(){
  const { db, F } = S.fb, B = S.B, sub = {};

    const qs = await F.getDocs(F.collection(db, 'boards', S.key, c));

function bkDownload(j, name){

async function bkDriveSave(j, tok){
  const ck = 'cr_bkfolder_' + S.user.uid;
  let folder = ''; try { folder = localStorage.getItem(ck) || ''; } catch (e) {}
  if (!folder){
    const q = encodeURIComponent("name='교실화면_백업' and mimeType='application/vnd.google-apps.folder' and trashed=false");
    const l = await gfetch(GAPI + 'drive/v3/files?q=' + q + '&fields=files(id)&spaces=drive', {}, tok);
    folder = l.files && l.files[0] && l.files[0].id;
    if (!folder) folder = (await gfetch(GAPI + 'drive/v3/files?fields=id', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: '교실화면_백업', mimeType: 'application/vnd.google-apps.folder' }) }, tok)).id;
    try { localStorage.setItem(ck, folder); } catch (e) {}
  }
  const bd = 'crk' + rid(12), meta = { name: bkName(j), parents: [folder], mimeType: 'application/json' };
  const body = new Blob(['--' + bd + '\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n' + JSON.stringify(meta) + '\r\n--' + bd + '\r\nContent-Type: application/json\r\n\r\n',
    JSON.stringify(j), '\r\n--' + bd + '--']);

async function bkRestore(j){

  busy('게시판을 되살리는 중…');

  board.owner = S.user.uid; board.viewKey = S.B.viewKey || '';
  await F.setDoc(F.doc(db, 'boards', S.key), Object.assign(board, { updatedAt: F.serverTimestamp(), lastBackup: S.B.lastBackup || '' }));
  for (const c of BK_SUBS){

}

function collectPeriods(){

function csvOf(s){
  const R = svSummary(s), A = S.ANS[s.id] || {}, stu = S.B.students || [];
  const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  const ei = s.etc ? s.options.length - 1 : -1;
  const lines = [[q('번호'), q('이름'), q('응답'), q('기타 내용')].join(',')];
  stu.forEach(t => {
    const a = A[t.no];
    lines.push([t.no, q(s.anon ? '' : t.name), q(a ? (s.kind === '체크' ? '체크' : a.ch.map(i => i === ei ? '기타' : s.options[i]).join(' / ')) : '안 함'), q(a ? a.etc : '')].join(','));
  });
  lines.push(''); lines.push([q('보기'), q('명')].join(','));
  s.options.forEach((o, i) => lines.push([q(o), R.counts[i]].join(',')));
  const blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = (s.q || '조사').replace(/[\\/:*?"<>|]/g, ' ').slice(0, 40) + '.csv';
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

    }
    case 'nlv': return save({ notices: (B.notices || []).map(n => n.id === id ? Object.assign({}, n, { level: +t.dataset.v }) : n) });
    case 'ndel': if (!confirm('이 공지를 지울까요?')) return; return save({ notices: (B.notices || []).filter(n => n.id !== id) }, '지웠어요.');
    case 'nedit': S.edit = id; render(); return;
    case 'nsave': {
      const text = $('eText').value.trim(); if (!text) return toast('내용을 적어 주세요.', true);
      const noFile = $('eNoFile') && $('eNoFile').checked;
      S.edit = '';
      return save({ notices: (B.notices || []).map(n => n.id === id ? Object.assign({}, n, { text: text.slice(0, 300), start: $('eStart').value, end: $('eEnd').value }, noFile ? { files: [] } : {}) : n) }, '고쳤어요.');
    }
    /* 알림장 */
    case 'noteadd': {
      const title = $('ntTitle').value.trim().slice(0, 80);
      if (!title) return toast('알림장 제목을 적어 주세요.', true);
      let files = [];
      try { files = await uploadPending('note'); } catch (e) { return fail(e); }
      const it = { id: rid(8), kind: $('ntKind').value, title, text: $('ntText').value.trim().slice(0, 500), due: $('ntDue').value || '', track: $('ntTrack').checked,
        file: files[0] || null, done: [], at: new Date().toISOString() };
      if ((B.notes || []).length >= 60) return toast('알림장이 너무 많아요. 지난 것을 조금 지워 주세요.', true);
      if (await save({ notes: (B.notes || []).concat([it]) }, '알림장을 올렸어요.')){ ['ntTitle', 'ntText', 'ntDue'].forEach(k => $(k).value = ''); $('ntTrack').checked = false; }
      return;
    }
    case 'notedel': if (!confirm('이 알림장을 지울까요?')) return; return save({ notes: (B.notes || []).filter(x => x.id !== id) }, '지웠어요.');
    case 'noteedit': S.edit = 'note_' + id; render(); return;
    case 'notesave': {
      const title = $('enTitle').value.trim(); if (!title) return toast('제목을 적어 주세요.', true);
      const noFile = $('enNoFile') && $('enNoFile').checked;
      S.edit = '';
      return save({ notes: (B.notes || []).map(x => x.id === id ? Object.assign({}, x, { title: title.slice(0, 80), text: $('enText').value.trim().slice(0, 500), due: $('enDue').value }, noFile ? { file: null } : {}) : x) }, '고쳤어요.');
    }
    case 'trkopen': S.edit = S.edit === 'trk_' + id ? '' : 'trk_' + id; render(); return;
    case 'trk': {
      const no = +t.dataset.no;
      return save({ notes: (B.notes || []).map(x => { if (x.id !== id) return x; const d = (x.done || []).slice(), i = d.indexOf(no); if (i >= 0) d.splice(i, 1); else d.push(no); return Object.assign({}, x, { done: d }); }) });
    }
    /* 화면 꾸미기 */
    case 'layreset': if (!confirm('TV 화면의 칸 위치 · 크기 · 여백을 처음 상태로 되돌릴까요?')) return; return save({ layout: {} }, '처음 배치로 되돌렸어요.');
    case 'qsample': { let Q = []; try { Q = await (await fetch('quotes.json')).json(); } catch (e) { return toast('예시를 불러오지 못했어요.', true); } const ta = $('qText'), have = ta.value.split('\n').map(x => x.trim()); ta.value = [ta.value.trim()].concat(Q.filter(q => !have.includes(q))).filter(Boolean).join('\n'); toast('넣었어요. [저장]을 눌러 주세요.'); return; }
    case 'qsave': return save({ quote: { on: $('qOn').checked, mode: $('qMode').value, list: parseQuotes($('qText').value).slice(0, 200) } }, '맨 윗줄 한마디를 저장했어요.');
    case 'ddsave': return save({ ddays: [0, 1, 2].map(i => ({ label: $('dL' + i).value.trim().slice(0, 20), date: $('dD' + i).value })).filter(d => d.label && d.date) }, 'D-day를 저장했어요.');
    case 'ladd': {
      const title = $('lTitle').value.trim().slice(0, 40);
      let url = $('lUrl').value.trim();
      if (url && !/^[a-z]+:\/\//i.test(url)) url = 'https://' + url;
      url = url.replace(/^http:\/\//i, 'https://');
      if (!title) return toast('단추 이름을 적어 주세요.', true);
      if (!/^https:\/\/[^\s.]+\.\S+$/.test(url) || url.length > 500) return toast('사이트 주소를 확인해 주세요. (예: https://forms.gle/…)', true);
      if ((B.links || []).length >= 6) return toast('링크는 6개까지 올릴 수 있어요. 끝난 링크를 지워 주세요.', true);
      if (await save({ links: (B.links || []).concat([{ id: rid(8), title, url, on: true }]) }, 'TV에 링크를 올렸어요.')){ $('lTitle').value = ''; $('lUrl').value = ''; }
      return;
    }
    case 'ltog': return save({ links: (B.links || []).map(l => l.id === id ? Object.assign({}, l, { on: l.on === false }) : l) });
    case 'ldel': if (!confirm('이 단추를 지울까요?')) return; return save({ links: (B.links || []).filter(l => l.id !== id) }, '지웠어요.');
    /* 시간표 설정 */
    case 'classsave': {
      const g = $('sGrade').value.trim(), k = $('sClass').value.trim(), name = $('sName').value.trim();
      if (!/^[1-3]$/.test(g) || !/^\d{1,2}$/.test(k) || +k < 1) return toast('학년 · 반을 숫자로 적어 주세요.', true);
      if (name.length < 2) return toast('성함을 적어 주세요.', true);
      try {
        await F.updateDoc(F.doc(db, 'teachers', S.user.uid), { name, grade: g, klass: String(+k) });
        S.me.name = name; S.me.grade = g; S.me.klass = String(+k);
        await save({ grade: g, klass: String(+k), teacherName: name }, '저장했어요.');
      } catch (e) { fail(e); }
      return;
    }
    case 'padd': { const c = collectPeriods(); c.P.push({ n: String(c.P.length + 1), s: '', e: '' }); return save({ periods: c.P, specials: c.SP, lunch: c.lunch }); }
    case 'pdel': { const c = collectPeriods(); c.P.splice(+t.dataset.i, 1); return save({ periods: c.P, specials: c.SP, lunch: c.lunch }); }
    case 'xadd': { const c = collectPeriods(); c.SP.push({ name: '', s: '', e: '' }); return save({ periods: c.P, specials: c.SP, lunch: c.lunch }); }
    case 'xdel': { const c = collectPeriods(); c.SP.splice(+t.dataset.i, 1); return save({ periods: c.P, specials: c.SP, lunch: c.lunch }); }
    case 'pdef': if (!confirm('교시 시각을 강릉제일고 기본값으로 되돌릴까요?')) return; return save({ periods: DEFAULT_PERIODS, specials: DEFAULT_SPECIALS, lunch: DEFAULT_LUNCH }, '기본값으로 바꿨어요.');
    case 'psave': {
      const c = collectPeriods();
      if (c.P.some(p => !p.s || !p.e || p.e <= p.s)) return toast('시작 · 끝 시각을 확인해 주세요. (끝이 시작보다 뒤여야 해요)', true);
      return save({ periods: c.P, specials: c.SP.filter(x => x.name && x.s && x.e), lunch: c.lunch.trim() }, '교시 시각을 저장했어요.');
    }
    case 'evadd': {
      const title = $('evTitle').value.trim().slice(0, 40), st = $('evStart').value, en = $('evEnd').value || st;
      if (!title || !st) return toast('일정 이름과 날짜를 넣어 주세요.', true);
      if (en < st) return toast('끝 날짜가 시작보다 앞이에요.', true);
      if (await save({ events: (B.events || []).concat([{ id: rid(8), title, start: st, end: en }]) }, '일정을 더했어요.')){ ['evTitle', 'evStart', 'evEnd'].forEach(k => $(k).value = ''); }
      return;
    }
    case 'sevback': try { await F.updateDoc(F.doc(db, 'boards', S.key, 'sevents', id), { gone: F.deleteField() }); toast('되살렸어요. TV에 다시 나와요.'); } catch (e) { fail(e); } return;
    case 'sevdel': if (!confirm('이 일정을 지울까요?')) return;
      try { await F.deleteDoc(F.doc(db, 'boards', S.key, 'sevents', id)); toast('지웠어요.'); } catch (e) { fail(e); } return;
    case 'evdel': return save({ events: (B.events || []).filter(e => e.id !== id) }, '지웠어요.');
    case 'rekey': {
      if (!confirm('새 TV 주소를 만들까요? 예전 주소로 열어 둔 TV는 연결 숫자 화면으로 바뀌니, 숫자를 넣어 다시 연결해 주세요.')) return;
      try {
        const old = S.key, data = Object.assign({}, B); delete data.updatedAt;
        stopWatch();
        await makeBoard(data);
        await F.deleteDoc(F.doc(db, 'boards', old));
        toast('새 TV 주소를 만들었어요.'); watchBoard();
      } catch (e) { fail(e); }
      return;
    }
    /* 학급 명단 */
    case 'xls': $('xlsPick').click(); return;
    case 'rpaste': S.edit = 'paste'; render(); return;
    case 'rpasteok': {
      const r = rosterFromText($('rPaste').value);
      if (!r.length) return toast('번호와 이름을 찾지 못했어요. "1 김민수" 처럼 한 줄에 한 명씩 적어 주세요.', true);
      S.rost = r; S.edit = ''; render(); toast(r.length + '명을 넣었어요. 확인하고 [명단 저장]을 눌러 주세요.'); return;
    }
    case 'radd': { const R = rostRead(); const mx = R.reduce((m, s) => Math.max(m, +s.no || 0), 0); R.push({ no: mx + 1, name: '', bd: '' }); S.rost = R; render(); return; }
    case 'rdel': { const R = rostRead(); R.splice(+t.dataset.i, 1); S.rost = R; render(); return; }
    case 'rclear': if (!confirm('명단을 모두 비울까요? ([명단 저장]을 눌러야 실제로 지워져요)')) return; S.rost = []; render(); return;
    case 'rcancel': S.rost = null; render(); return;
    case 'rsave': {
      const R = rostRead().map(s => ({ no: parseInt(s.no, 10), name: cleanName(s.name), bd: s.bd ? bdOf(s.bd) : '' })).filter(s => s.name || s.no);
      const bad = R.find(s => !(s.no >= 1 && s.no <= 99) || !s.name);
      if (bad) return toast('번호(1~99)와 이름을 모두 채워 주세요.', true);
      const dup = R.find((s, i) => R.findIndex(x => x.no === s.no) !== i);
      if (dup) return toast(dup.no + '번이 두 번 있어요.', true);
      const badBd = rostRead().find(s => s.bd && !bdOf(s.bd));
      if (badBd) return toast((badBd.no || '') + '번 생일을 03-05 처럼 적어 주세요.', true);
      if (await save({ students: R.sort((a, b) => a.no - b.no) }, R.length + '명을 저장했어요.')) S.rost = null;
      return;
    }
    /* 설문 · 투표 */
    case 'svkind': S.svKind = t.dataset.v; render(); return;
    case 'svadd': {
      const kind = $('svKind').value, q = $('svQ').value.trim().slice(0, 100);
      if (!q) return toast('질문을 적어 주세요.', true);
      let options = ['체크'], multi = false, etc = false;
      if (kind === '선택'){
        options = $('svOpts').value.split('\n').map(x => x.trim()).filter(Boolean).map(x => x.slice(0, 80));
        options = options.filter((x, i) => options.indexOf(x) === i);
        etc = $('svEtc').checked; multi = $('svMulti').checked;
        if (options.length + (etc ? 1 : 0) < 2) return toast('보기를 두 개 이상 적어 주세요.', true);
        if (options.length > 150) return toast('보기는 150개까지예요.', true);
        if (etc) options.push('기타');
      }
      if ((B.surveys || []).length >= 30) return toast('조사가 너무 많아요. 지난 조사를 조금 지워 주세요.', true);
      let files = [];
      try { files = await uploadPending('survey'); } catch (e) { return fail(e); }
      const s = { id: 's' + rid(8), q, kind, options, multi, etc, anon: $('svAnon').checked, pub: $('svPub').checked, open: true, showMissing: true,
        desc: $('svDesc').value.trim().slice(0, 200), file: files[0] || null, at: new Date().toISOString() };
      if (await save({ surveys: (B.surveys || []).concat([s]) }, 'TV에 올렸어요.')){
        ['svQ', 'svDesc', 'svOpts'].forEach(k => { if ($(k)) $(k).value = ''; }); ['svMulti', 'svEtc', 'svAnon', 'svPub'].forEach(k => { if ($(k)) $(k).checked = false; });
      }
      return;
    }
    case 'svedit': S.svEdit = S.svEdit === id ? '' : id; ['seQ', 'seDesc', 'seOpts', 'seMulti', 'seEtc', 'seAnon'].forEach(k => { if ($(k)) $(k).remove(); }); render(); return;
    case 'svesave': {
      const s = (B.surveys || []).find(x => x.id === id); if (!s) return;
      const q = $('seQ').value.trim().slice(0, 100);
      if (!q) return toast('질문을 적어 주세요.', true);
      let options = s.options, multi = !!s.multi, etc = !!s.etc;
      if (s.kind !== '체크'){
        options = $('seOpts').value.split('\n').map(x => x.trim()).filter(Boolean).map(x => x.slice(0, 80)).filter(x => x !== '기타');
        options = options.filter((x, i) => options.indexOf(x) === i);
        etc = $('seEtc').checked; multi = $('seMulti').checked;
        if (options.length + (etc ? 1 : 0) < 2) return toast('보기를 두 개 이상 적어 주세요.', true);
        if (options.length > 150) return toast('보기는 150개까지예요.', true);
        if (etc) options.push('기타');
      }
      /* 응답 옮기기: 보기 글자가 같은 것만 남김 */
      const map = s.options.map(o => options.indexOf(o)), A = S.ANS[id] || {}, ops = [];
      let lost = 0;
      Object.keys(A).forEach(no => {
        let ch = []; (A[no].ch || []).forEach(i => { const j = map[i]; if (j != null && j >= 0 && ch.indexOf(j) < 0) ch.push(j); });
        if (!multi) ch = ch.slice(0, 1);
        const same = JSON.stringify(ch) === JSON.stringify(A[no].ch || []);
        const etcTxt = etc && ch.indexOf(options.length - 1) >= 0 ? (A[no].etc || '') : '';
        if (!ch.length){ lost++; ops.push(['del', no]); } else if (!same || etcTxt !== (A[no].etc || '')) ops.push(['set', no, ch, etcTxt]);
      });
      if (lost && !confirm('고치거나 지운 보기를 고른 응답 ' + lost + '개가 사라져요. 계속할까요?')) return;
      const ns = Object.assign({}, s, { q, desc: $('seDesc').value.trim().slice(0, 200), options, multi, etc, anon: $('seAnon').checked });
      if (!await save({ surveys: (B.surveys || []).map(x => x.id === id ? ns : x) }, '조사를 고쳤어요.')) return;
      try {
        await Promise.all(ops.map(o => o[0] === 'del' ? F.deleteDoc(F.doc(db, 'boards', S.key, 'answers', id + '_' + o[1]))
          : F.setDoc(F.doc(db, 'boards', S.key, 'answers', id + '_' + o[1]), { sid: id, no: +o[1], ch: o[2], etc: o[3], at: F.serverTimestamp() })));
      } catch (e) { fail(e); }
      S.svEdit = ''; render(); return;
    }
    case 'svopen': S.openSv = S.openSv === id ? '' : id; render(); return;
    case 'svtog': return save({ surveys: (B.surveys || []).map(s => s.id === id ? Object.assign({}, s, { open: !s.open }) : s) }, '바꿨어요.');
    case 'svpub': return save({ surveys: (B.surveys || []).map(s => s.id === id ? Object.assign({}, s, { pub: !s.pub }) : s) }, '바꿨어요.');
    case 'svshare': { const s = (B.surveys || []).find(x => x.id === id); if (s) svShare(s); return; }
    case 'svclr': { const sel = document.querySelector(`[data-svclr="${CSS.escape(id)}"]`); const no = sel && +sel.value; if (!no) return toast('번호를 골라 주세요.'); return ansClear(id, no); }
    case 'pinmode': {
      const on = t.dataset.v === 'on';
      if (on === (B.pinChange !== false)) return;
      if (on && !B.viewKey && !confirm('학생이 휴대폰에서 PIN을 만들려면 [TV 연결] 탭에서 학생용 주소를 만들어야 해요.\n지금 PIN 방식으로 바꿀까요? (주소는 그다음에 만들어도 돼요)')) return;
      await save({ pinChange: on }, on ? '🔒 PIN으로 안전하게: 이미 낸 답은 PIN을 넣어야 바꿀 수 있어요.' : '🙂 PIN 없이 간단하게: 이름만 누르면 답을 바꿀 수 있어요.');
      return;
    }
    case 'sndsave': { const o = sndRead(), e = sndValidate(o); if (e) return toast(e); await save({ sound: o }, '소리 설정을 저장했어요. 교실 TV에 곧 반영돼요.'); return; }
    case 'sndoff': { const o = sndCur(); o.offDay = o.offDay === kstToday() ? '' : kstToday(); await save({ sound: o }, o.offDay ? '오늘은 교실 TV 음악을 껐어요.' : '오늘 음악을 다시 켰어요.'); return; }
    case 'pinreset': return pinReset(+t.dataset.no);
    case 'pinset': return pinSetFor(+t.dataset.no);
    case 'pcinst': pcModal(); return;
    case 'svcsv': { const s = (B.surveys || []).find(x => x.id === id); if (s) csvOf(s); return; }
    case 'svdel': {
      if (!confirm('이 조사와 응답을 모두 지울까요?')) return;
      if (await save({ surveys: (B.surveys || []).filter(s => s.id !== id) }, '지웠어요.')) delAnswers(id);
      return;
    }
    /* 건의함 */
    case 'sgreload': S.sugg = null; render(); return;
    case 'sgdel': if (!confirm('이 건의를 지울까요?')) return;
      try { await F.deleteDoc(F.doc(db, 'boards', S.key, 'suggest', id)); S.sugg = (S.sugg || []).filter(x => x.id !== id); render(); } catch (e) { fail(e); } return;
    /* 운영자 */
    case 'opreload': return loadTeachers();
    case 'opok': try { await F.updateDoc(F.doc(db, 'teachers', t.dataset.uid), { status: 'ok' }); toast('승인했어요.'); loadTeachers(); } catch (e) { fail(e); } return;
    case 'opstop': if (!confirm('이 선생님의 사용을 멈출까요? (자료는 지우지 않아요)')) return;
      try { await F.updateDoc(F.doc(db, 'teachers', t.dataset.uid), { status: 'stop' }); toast('멈췄어요.'); loadTeachers(); } catch (e) { fail(e); } return;
    case 'opdel': if (!confirm('이 가입 신청을 거절할까요?')) return;
      try { await F.deleteDoc(F.doc(db, 'teachers', t.dataset.uid)); toast('거절했어요.'); loadTeachers(); } catch (e) { fail(e); } return;
  }
});
start();
</script>
</body>
</html>
